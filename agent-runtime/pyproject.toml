[project]
name = "open-agentBuilder-engine"
version = "0.1.0"
description = "Open AgentBuilder Engine - openjiuwen (agent-core) service wrapper"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings~=2.13.1",
    "openjiuwen[sandbox] @ git+https://gitcode.com/openJiuwen/agent-core.git@develop",
    "boto3",
    "aioboto3",
    "aiohttp",
    "httpx",
    "requests",
    "urllib3",
    "pymysql",
    "psycopg2-binary",
    "py-opengauss",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "lxml>=4.9.0",
    "jieba>=0.42.0",
    "tqdm>=4.65.0",
    "websockets>=10.0",
    "mcp>=1.0.0",
    "spiffworkflow>=1.2.0",
    "pydantic-core>=2.0.0",
    "elasticsearch>=8.0.0,<9.0.0",
    "opensearch-py>=2.4.0",
    "aiosqlite>=0.20.0",
    "aiomysql>=0.2.0",
    "PyMySQL>=1.1.0",
    "flask>=3.1.0",
    "pyahocorasick>=2.2.0",
    "model-service",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
tracer-otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
kerberos = [
    # Kerberos/SPNEGO 认证支持（仅用于 LakeSearch Kerberos 认证部署）
    # 系统依赖：libkrb5-dev (Debian/Ubuntu) 或 krb5-devel (RHEL/CentOS)
    "gssapi>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_runtime*", "jiuwen*", "agent_builder*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[[tool.uv.index]]
name = "aliyun-mirrors"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.uv.sources]
# 机制层共享包（monorepo 同仓，runtime/agent-builder 都依赖）。path 相对于本 pyproject。
model-service = { path = "../packages/model_service", editable = true }