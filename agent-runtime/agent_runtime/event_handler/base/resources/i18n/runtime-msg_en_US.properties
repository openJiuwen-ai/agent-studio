103012.reason=The planner cannot read the detailed configuration parameters for the skill.
103012.suggestion=Check the skill definition on the skill management page to ensure its configuration parameters have been saved correctly.
103013=Skill type retrieval failed
103013.reason=The planning engine cannot identify the invocation type of the target skill (e.g., HTTP, Python, Shell).
103013.suggestion=Confirm the skill's metadata definition is complete and that this skill type is supported in the current environment.
103014=Workflow start component parsing failed
103014.reason=The planner cannot identify the start node of the sub-workflow when attempting to call it.
103014.suggestion=Open the called sub-workflow and ensure it contains exactly one valid start node.
103015=Workflow component execution failed
103015.reason=A workflow node assigned by the planner encountered an unexpected interruption or internal error during execution.
103015.suggestion=Check the sub-workflow's execution logs to locate the specific anomalous node and fix it.
103016=Specified version IR template retrieval failed
103016.reason=The system tried to load the planning mode IR template based on version, but no matching record was found in the repository.
103016.suggestion=Verify the version info in the planner configuration; ensure the referenced version is published and available in the template library.
103017=Planner configuration type validation failed
103017.reason=The parameter type for field is incorrect.
103017.suggestion=Go to the planner node's parameter settings and reconfigure the relevant field based on the required type to ensure the data format is legal.
103018=Planner streaming processing anomaly
103018.reason=The planning engine encountered an unexpected interruption while executing streaming output or processing incremental model responses.
103018.suggestion=Check network stability and confirm if the model service supports the streaming output protocol under the selected planning mode.
103025=Agent input type not supported
103025.reason=The Agent received an unrecognized input format (such as an unsupported file type or illegal multimodal data stream), preventing the inference engine from parsing instructions.
103025.suggestion=Check the variable types passed to the Agent to ensure they comply with the input specifications supported by the model (e.g., text, image links, or standard JSON).
103028=Tool switch configuration illegal
103028.reason=The format of the Tool Switch Dict used to control the Agent's dynamic tool selection is incorrect, preventing routing between multiple tools.
103028.suggestion=Check the structure of the tool_switch field; ensure it is a legal key-value mapping and that keys match registered tool names.
103029=Plugin update type error
103029.reason=An illegal object was passed while trying to dynamically update the Agent's skill set. The system requires a list of RestFulApi or Function.
103029.suggestion=Ensure that when updating the plugin list, the objects passed are standard API or function definitions, not raw strings or other basic types.
103030=Task ID length limit exceeded
103030.reason=The internally generated task tracking ID or the externally passed task_id exceeded the maximum threshold of, which may cause database write failure.
103030.suggestion=Shorten the task identifier or check if there is an anomaly in the task generation logic that repeatedly appends IDs.
103031=MCP plugin update type error
103031.reason=When extending Agent capabilities via the Model Context Protocol (MCP), the passed parameter type does not comply with specifications.
103031.suggestion=Check the MCP interface definition and ensure a legal list of MCP protocol objects is passed.
103100=Parameter extraction atomic capability call failed
103100.reason=The controller failed when calling the underlying atomic skill to extract parameters from user input or context, usually due to the model not outputting according to Schema or variable mapping failure.
103100.suggestion=Check the parameter extractor configuration and verify if the model can accurately identify key slot information in the current context.
103101=Parameter correction atomic capability call failed
103101.reason=During parameter completion or correction logic, the controller could not correctly construct correction instructions or received an error from the model.
103101.suggestion=Verify the Prompt for the "parameter correction" phase; ensure the model correctly triggers counter-questions or supplemental logic when parameters are missing.
103102=Controller execution interrupted
103102.reason=The controller received an unexpected interruption signal while managing the execution flow, possibly from user intervention or high-priority system preemption.
103102.suggestion=Check the current controller's concurrency strategy and confirm if other modules triggered illegal interruption instructions.
103103=Global intent jump limit exceeded
103103.reason=Due to frequent global intent triggers, the number of jumps executed by the controller exceeded the threshold, aimed at preventing infinite intent-switching loops.
103103.suggestion=Optimize the trigger threshold or keyword weights for global intents to ensure accuracy and avoid overlapping intent definitions.
103104=Intent recognition error
103104.reason=The controller encountered an internal crash or returned an unexpected classification result during the intent detection module execution.
103104.suggestion=Check the classification model and sample library the intent classifier depends on; ensure the intent definition list is not empty and formatted legally.
103105=Intent-associated workflow execution error
103105.reason=Intent recognition succeeded, but a failure occurred while scheduling the execution of the workflow bound to that intent.
103105.suggestion=Debug the workflow on the canvas for that intent; confirm that the start node's input parameters are compatible with the context passed by the controller.
103200=Multi-agent runner already started
103200.reason=Attempted to start a multi-agent collaboration task that is already running. Repeated initialization of the same Runner instance is prohibited.
103200.suggestion=Check the calling logic to ensure the old task has ended before starting a new one, or query the status interface for current progress.
103201=Target member does not exist
103201.reason=The system cannot find the Agent member identified in the current group during multi-agent task distribution or routing.
103201.suggestion=Check the Agent registration names in the collaboration network; ensure the member ID pointed to in the distribution logic or routing config is correct.
103202=Message processing suspended
103202.reason=The multi-agent flow entered a manual intervention node or a step requiring external feedback; processing is suspended waiting for user input.
103202.suggestion=Provide the required feedback data via the manual audit interface or dialog box to resume the collaboration flow.
103203=Collaboration processing interrupted
103203.reason=The multi-agent collaboration received a forced interruption signal during cross-agent communication or inference, breaking the transaction chain.
103203.suggestion=Check for node timeouts or system resource preemption that may have caused the task to be forcibly released.
103204=Runner is not running
103204.reason=Attempted to send control instructions (e.g., suspend, terminate) to a runner that is already stopped, crashed, or idle.
103204.suggestion=Verify the real-time status of the runner and ensure the target of the instruction is within an active running cycle.
103205=Runner has not started
103205.reason=Attempted to call the execution interface before the runner completed initialization and officially started, resulting in an illegal operation exception.
103205.suggestion=Ensure that the runner has been correctly configured and start() has been called before executing run() or next() methods.
103231=Workspace execution error
103231.reason=A low-level environment crash or uncaught runtime exception occurred while multi-agents were executing tasks in the shared workspace. Usually related to thread pool saturation or OOM.
103231.suggestion=Check system resource usage or view detailed stack logs to confirm if a specific Agent's private code logic caused environmental contamination.
103232=Message queue closure failed
103232.reason=The message bus for inter-agent communication could not be closed normally while attempting to destroy the workspace.
103232.suggestion=Confirm if a deadlocked process is still writing to the queue; if necessary, manually reset the message broker service.
103233=Stopping running task failed
103233.reason=The controller attempted to terminate a running collaboration task, but an Agent was in a non-interruptible blocking call, causing the stop command to timeout or fail.
103233.suggestion=Check if Agent tool calls have reasonable timeouts set, ensuring all long-running nodes can respond to interruption signals.
103234=Idle stop execution failed
103234.reason=An exception occurred when the workspace detected all Agents were idle and tried to auto-shutdown to save resources.
103234.suggestion=Check the workspace's Garbage Collection (GC) logic; ensure no unmanaged resources are hindering the destruction process during the idle period.
103235=Termination condition validation failed
103235.reason=After an iteration, the "termination condition" could not be determined due to a context variable parsing error or an illegal logical expression.
103235.suggestion=Verify the termination expression syntax in the collaboration config and ensure referenced variables exist in the context.
103236=Stop-When logic execution error
103236.reason=The controller failed while executing specific stop_when trigger logic. Unlike general condition checks, this usually involves the failure of a complex code snippet.
103236.suggestion=Debug the custom function logic for stop_when to ensure it runs stably under various edge cases (like empty responses or error returns).
103261=Member message processing failed
103261.reason=This is usually because the member's Prompt template is corrupted or input parameters don't match its preset Schema.
103261.suggestion=Check the individual configuration of that member and verify if the context data passed by the preceding Agent is complete.
103262=Exception during message execution
103262.reason=The member threw an uncaught exception during its inference lifecycle. This may involve model interface failures, plugin crashes, or OOM.
103262.suggestion=View the member's runtime logs to locate the crash; ensure dependent external services and plugin environments are normal.
103291=Message not in processing state
103291.reason=While attempting to operate on message (e.g., updating status), the message was found to have left the processing queue or be inactive (e.g., completed or discarded).
103291.suggestion=Check if the message ID has expired and confirm if the task scheduler has unexpectedly removed the message.
103300=Agent group already started
103300.reason=Attempted to execute a start() command on a group instance that is already in an Active state.
103300.suggestion=Confirm if the old task has released resources via stop() before starting a new round of group collaboration, or use the currently active instance.
103301=Group not initialized
103301.reason=Attempted to call the collaboration interface before the group component completed initialization or entered a running state.
103301.suggestion=Check the IR structure of the group definition; ensure the init() process was successful before calling execution methods.
103302=Group execution exception
103302.reason=The group encountered a system-level error while coordinating transfer logic between multiple Agents (e.g., voting, polling, or distribution).
103302.suggestion=Focus on troubleshooting the group's Selector logic to ensure it can correctly calculate the next Agent to execute based on the current context.
103303=Member registration failed
103303.reason=Failed to add an agent to the group.
103303.suggestion=Check for Agent member uniqueness; ensure the same Agent instance is not registered to the same group multiple times with different roles.
104001=Streaming execution anomaly
104001.reason=The execution engine failed to establish a real-time transmission channel when starting the task in Stream mode, or encountered an unexpected disconnection during transmission.
104001.suggestion=Check the WebSocket or SSE connection status between the front-end and back-end; ensure that middleware is not intercepting long-lived connections.
104002=Executor internal erro
104002.reason=The executor triggered an underlying system exception while processing task scheduling or thread allocation. This typically involves CPU scheduling timeouts or kernel-level instruction errors.
104002.suggestion=Try restarting the execution engine service; if the error persists, check server system logs to troubleshoot resource contention issues.
104003=General request error
104003.reason=An unknown error occurred when the executor initiated a request to an external service (e.g., database or third-party API), usually due to network jitter or non-compliant request formats.
104003.suggestion=Check network firewall configurations and verify the executor's access permissions to external resources.
104004=Operator execution failed
104004.reason=The execution engine threw an exception while running specific operator logic (e.g., data transformation, math nodes). This may be due to illegal input data types or internal algorithm crashes.
104004.suggestion=Check the input value format of this node on the canvas to ensure it meets the operator's business logic requirements.
104005=Failed to get node list from manager
104005.reason=In a distributed environment, the executor cannot synchronize the current Worker node list from the management node, preventing task distribution.
104005.suggestion=Check the service status of the management node and ensure that RPC communication (e.g., gRPC/HTTP) between the executor and manager is not blocked.
104006=Session cleanup failed
104006.reason=A conflict occurred when the executor attempted to reclaim session resources, delete temporary files, or release memory cache after task completion.
104006.suggestion=Check if file handles are locked by other processes or implement a retry mechanism for session cleanup.
104007=User input execution failed
104007.reason=The executor failed while processing real-time instructions injected by the user (e.g., dynamic parameter modification) due to failed instruction validation or lack of environment support for dynamic intervention.
104007.suggestion=Ensure user-input parameters match the preset Schema and that the current execution state allows for dynamic updates.
104008=Streaming data processing failed
104008.reason=The execution engine encountered a serialization error while parsing streaming token blocks or intermediate data from the model.
104008.suggestion=Check if the model output protocol version matches the execution engine to avoid parsing interruptions caused by incompatible Stream formats.
105001=Plugin unknown exception
105001.reason=The plugin system triggered an uncaught runtime exception, usually due to logic errors within the plugin package or incompatibility with the current engine version.
105001.suggestion=Check plugin execution logs to locate the specific crash stack trace and confirm that all plugin dependencies are intact.
105002=Plugin already exists
105002.reason=Attempted to upload or register a plugin with a Plugin ID that already exists in the system.
105002.suggestion=Change the plugin name or version number, or use the "Update Plugin" interface to overwrite the existing installation.
105003=Plugin not found
105003.reason=The workflow cannot retrieve the corresponding executable file or configuration from the plugin library or filesystem when calling a plugin.
105003.suggestion=Confirm that the plugin has been successfully published on the plugin management page and check if the ID reference is correct.
105004=Plugin parameter validation failed
105004.reason=Dynamic parameters passed when calling the plugin do not comply with the plugin's defined Schema (e.g., missing mandatory fields or type mismatch).
105004.suggestion=Adjust input variables in the workflow based on the plugin's Input Schema to ensure parameters are valid.
105005=The free quota of the plug-in has been used up.
105005.reason=The free quota of the preset plug-in has been used up.
105005.suggestion=Configure the authentication by yourself or wait until the quota is updated next month.
105006=Plugin database anomaly
105006.reason=A database connection error occurred while the plugin management service was reading/writing plugin metadata, permissions, or status.
105006.suggestion=Check the backend database service status and connection pool quota; confirm that the plugin configuration table is not locked.
105009=Plugin vector inference failed
105009.reason=The vector model service returned an error while performing semantic vectorization of the plugin description for search recommendations.
105009.suggestion=Check the availability of the Embedding model service and ensure the plugin description text length does not exceed model limits.
105010=API authentication failed
105010.reason=When calling an external API plugin, the target server returned an authentication error (e.g., 401 Unauthorized).
105010.suggestion=Re-check the API Key, Bearer Token, or OAuth2 credentials in the plugin configuration to ensure they are valid and not expired.
105011=API response status code error
105011.reason=The external API responded with an abnormal status code (e.g., 403, 404, 500) instead of 200/201.
105011.suggestion=Troubleshoot the third-party service logic based on the specific HTTP status code; ensure the interface URL and request method are correct.
105012=API request timeout
105012.reason=The external API failed to return data within the preset time. This may be due to network latency or long processing times on the third-party service side.
105012.suggestion=Appropriately increase the timeout threshold in the plugin settings or check the network connectivity of the target service.
105013=Response body too large
105013.reason=The data returned by the plugin exceeds the system's preset security payload limit, which could cause memory overflow.
105013.suggestion=Limit the number of data entries returned by the API or enable pagination/streaming in the plugin.
105014=Proxy connection failed
105014.reason=The proxy server refused the connection or could not resolve the target when the system tried to access an external plugin API via a proxy.
105014.suggestion=Check the global proxy configuration (Proxy Server/Port/Credentials) and verify the status of internal network penetration.
108003=Child node execution index missing
108003.reason=The execution sequence index for a child node under parent node is missing. This prevents Insight from correctly restoring the execution topology.
108003.suggestion=Check if the execution engine correctly generated the Sequence ID when issuing subtasks and verify the integrity of distributed trace data.
108004=Invoke ID does not exist
108004.reason=The system cannot find the invoke_id when attempting to query specific execution records. Data may have been cleaned or delayed during asynchronous database writing.
108004.suggestion=Confirm the accuracy of the queried ID. If querying right after a task ends, please wait and try again for data synchronization.
108005=Invoke type mismatch
108005.reason=The Insight analysis engine expected Prompt-type invocation data.
108005.suggestion=Verify monitor filter settings to ensure the requested analysis object matches the actual component type of the node.
108006=Project ID missing
108006.reason=The mandatory x-insight-project-id parameter is missing from the Insight request header, preventing project-based data isolation.
108006.suggestion=Add the project ID to the request Header to ensure monitoring metrics are archived under the correct business group.
109000=Advanced intent initialization failed
109000.reason=An error occurred while the advanced intent recognition node was loading semantic models, classification schemas, or initializing Embedding vectors.
109000.suggestion=Check if the selected classification model is online and verify that the intent category list follows JSON specifications.
109011=Strategy environment variable not configured
109011.reason=The system attempted to load an external custom strategy, but the environment variable is not defined on the server.
109011.suggestion=Set this path in system environment variables or configuration files to point to the directory containing custom strategy scripts.
109012=Strategy path does not exist
109012.reason=The configured strategy path does not exist in the filesystem, preventing the dynamic loader from locating script files.
109012.suggestion=Check the path spelling and confirm that the execution account has read permissions for the directory.
109013=Invalid strategy file path
109013.reason=The provided path points to a directory rather than a specific strategy script file (e.g., .py or .yaml), causing parsing to stop.
109013.suggestion=Specify the full filename and extension of the strategy script.
109014=Strategy registry not initialized
109014.reason=A strategy lookup or call was attempted before the registry completed its initialize() process, usually due to a race condition during system startup.
109014.suggestion=Check the startup logic to ensure all Providers and strategy registrations are completed before the main logic runs.
109015=Strategy not matched
109015.reason=No planning policy found under the specified provider.
109015.suggestion=Verify the strategy name and associated Provider identifier; confirm the strategy is registered and enabled in the system.
109016=Built-in strategy loading failed
109016.reason=The core built-in strategy file is missing. This is usually due to an incomplete package installation or file migration during updates.
109016.suggestion=Try redeploying the engine's core components to ensure all resources in the builtin_strategies directory are present.
109017=Strategy async call exception
109017.reason=An unexpected runtime error was triggered during the asynchronous execution of a strategy component.
109017.suggestion=Troubleshoot the internal async logic of the strategy; check for uncaught coroutine exceptions or event loop conflicts.
109018=Agent iteration count configuration illegal
109018.reason=The maximum iteration steps for the Agent were set to a non-positive integer. Correcting this prevents the model from entering infinite loops.
109018.suggestion=Modify max_iteration to an integer greater than 0.
109019=Plugin address missing
109019.reason=While trying to distribute a task to a specific plugin, the planning strategy found that the plugin's call URL was empty.
109019.suggestion=Check the Endpoint configuration in the plugin management module to ensure the plugin is deployed and exposes a valid API address.
109300=Memory IR configuration error
109300.reason=The Memory Engine's IR configuration file contains logical errors or illegal formats, preventing the mapping of memory shards and retrieval strategies.
109300.suggestion=Check the Memory module's DSL or JSON configuration to ensure parameter definitions for memory types (e.g., semantic, episodic) are compliant.
109500=Context configuration error
109500.reason=The base settings for the Context Engine are improper.
109500.suggestion=Verify the Context Policy in system settings to ensure sliding window or summary strategy parameters are within the model's supported range.
109501=Memory client initialization failed
109501.reason=The Context Engine failed while initializing the proxy or client responsible for connecting to backend memory storage.
109501.suggestion=Check the connection address, port, and authentication credentials for backend storage services (e.g., Redis, Milvus, or DB).
109510=Processor creation failed
109510.reason=The system could not create a context processor for the current session, possibly due to a failure in loading the custom logic script.
109510.suggestion=Check the plugin or middleware configuration for the context processing flow; ensure class names or function paths are correct.
120007=Code return value Key missing
120007.reason=After the code node finished execution, the returned dictionary did not contain the output variable names defined on the canvas.
120007.suggestion=Check the return statement in the Python/JS script; ensure the dictionary keys strictly match the definitions in the node's "Output Settings."
120008=Code return value type error
120008.reason=The return object type from the code node is illegal. The system requires a dict (dictionary) for variable mapping, but received another type.
120008.suggestion=Modify the code logic to ensure results are returned in the { "key": value } format; do not return strings or lists directly.
100702=MySQL configuration check error
100702.reason=Mandatory MySQL configuration items (e.g., Host, Port, User) are missing or incorrectly formatted during DB initialization.
100702.suggestion=Check database connection parameters in environment variables or configuration files to ensure addresses and credentials are valid.
100703=SQL execution failed
100703.reason=A database-level exception occurred while executing SQL commands.
100703.suggestion=Troubleshoot based on the specific MySQL error to determine if it involves missing table structures, data conflicts, or timeouts.
100704=SQL syntax validation failed
100704.reason=The constructed SQL command failed pre-check, possibly due to syntax errors or illegal characters.
100704.suggestion=Verify the generated dynamic SQL statement; ensure table and field names are spelled correctly and comply with syntax specs.
102301=Model information parameter illegal
102301.reason=Model configuration info (name, version, endpoint) failed validation when starting the NL2Agent flow.
102301.suggestion=Ensure that modelInfo contains a valid model identifier and necessary authentication information.
102302=IR to cloud DSL conversion failed
102302.reason=Failed to convert the IR into a specific DSL description runnable on the cloud platform.
102302.suggestion=Check if the intermediate representation logic is too complex, exceeding the support range of the target cloud DSL.
102303=Intent clarification preprocessing failed
102303.reason=An error occurred during the first stage of NL2Agent when the system tried to understand vague user intent and guide clarification.
102303.suggestion=Adjust the preprocessing stage Prompt instructions to handle unstructured user input more robustly.
102304=Workflow structure design failed
102304.reason=The model was unable to design a reasonable node topology based on user requirements (e.g., node connection conflicts or logic loops).
102304.suggestion=Try simplifying the user requirement description or provide more detailed descriptions for available tools/plugins to help the model deconstruct tasks.
102305=Workflow IR generation failed
102305.reason=While the model designed a structure, it failed to serialize it into the IR JSON format.
102305.suggestion=Check the backend generation template to ensure the generated JSON structure complies with the definition.
102306=NL2Agent model service anomaly
102306.reason=The dedicated NL2Agent model returned an error during invocation.
102306.suggestion=Check the concurrency limits and health status of the model service.
102307=Workflow state machine anomaly
102307.reason=A mismatch in current session or workflow state occurred during dynamic construction by NL2Agent, causing the process to interrupt.
102307.suggestion=Clear the current generation cache and try starting a new generation session.
102308=Workflow IR reflection correction failed
102308.reason=The correction logic failed during self-reflection and correction of the generated IR.
102308.suggestion=Optimize the Prompt settings in the reflection phase to provide clearer error correction instructions.
120000=QA options list is empty
120000.reason=While executing a Question & Answer (QA) node or component, the preset list of alternative options was empty, preventing selection.
120000.suggestion=Check the QA node configuration; ensure the "Options" list contains at least one valid alternative.
120001=Unsupported QA strategy
120001.reason=The QA node is configured with a retrieval or matching strategy that the system cannot recognize.
120001.suggestion=Reselect a supported matching strategy (e.g., "Exact Match" or "Semantic Match") in the node settings.
120002=Index out of range
120002.reason=The system attempted to retrieve options or data based on an index that exceeds the actual length of the array or list.
120002.suggestion=Check the volume of data generated by preceding logic; ensure index access stays within legal bounds.
120003=Input key missing
120003.reason=The QA component failed to find the specified parameter key  while processing input data.
120003.suggestion=Check the connection mapping between nodes to ensure the upstream node correctly outputs the variable.
120005=Global variable type error
120005.reason=The default value type of global variable does not match its defined variable type (e.g., String, Integer, Object).
120005.suggestion=Verify the type definition of the variable in the global variable management page and ensure the default value matches that format.
120006=Workflow nodes exceed limit
120006.reason=The total number of nodes in the current workflow exceeds the maximum system limit.
121007=Event encapsulation failed
121007.reason=An exception occurred during event stream processing
121007.suggestion=Please check the logs for detailed error information
02001003=Interface parameter validation error
02001003.reason=Interface parameter validation error, such as empty controller input or plugin JSON parsing failure.
02001003.suggestion=Please re-validate the interface parameters.
02101016=Insufficient execution permissions for Agent
02101016.reason=The current user does not have permission to run the Agent in the specified project.
02101016.suggestion=Please confirm that the current user has execution permissions for the Agent in the target project.
02201020=Insufficient workflow execution permissions
02201020.reason=The projectId in the current execution request does not match the projectId of the agent.
02201020.suggestion=Please ensure that the projectId in executeParams matches the projectId of the agent.
02201021=Not the latest workflow version
02201021.reason=The workflow version being operated has expired, possibly modified or saved by other users.
02201021.suggestion=Please refresh the page and try again.
