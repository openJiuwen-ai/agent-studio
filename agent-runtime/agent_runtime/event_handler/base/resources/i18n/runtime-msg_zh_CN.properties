999999=系统内部错误
999999.reason=系统内部错误
999999.suggestion=请联系技术支持进行定位
800001=组件的输入参数结构与定义不匹配
800001.reason=组件的输入参数结构与定义不匹配
800001.suggestion=修改组件节点输入参数配置
100000=资源无法找到
100000.reason=资源不存在
100000.suggestion=检查是否存在资源
100001=鉴权失败
100001.reason=身份验证凭据无效或已过期
100001.suggestion=请重新登录系统
100002=参数校验失败
100002.reason=输入参数格式不正确或缺少必要参数
100002.suggestion=请检查请求参数是否符合接口规范
100003=SDK请求失败
100003.reason=第三方服务或SDK用返回异常
100003.suggestion=请检查SDK配置、网络连接或目标服务状态
100004=加密操作失败
100004.reason=调用默认加密方法时发生异常，可能是密钥无效或数据格式不支持
100004.suggestion=请检查加密算法配置、密钥强度及待加密数据的合法性
100005=解密操作失败
100005.reason=调用默认解密方法时发生异常，可能是解密密钥不匹配或密文已被损坏
100005.suggestion=请确保使用正确的解密密钥，并检查密文数据完整性
100006=加解密初始化失败
100006.reason=加密组件或加解密组件初始化异常，可能是由于环境缺失或配置错误
100006.suggestion=请检查环境是否包含必要的密码库，并核对加解密配置参数是否正确
100007=接口功能保留，当前方法不支持
100007.reason=该接口目前处于预留状态，当前版本暂不支持调用
100007.suggestion=请查阅最新 API 文档，确认该功能是否已开放或是否有替代接口
100010=无可用连接服务器
100010.reason=连接池中没有可用的服务器实例，可能是所有节点都已离线或达到最大连接数
100010.suggestion=请检查后端服务运行状态、网络负载情况或增加服务器节点
100011=连接已关闭
100011.reason=尝试通过已关闭的连接发送请求或调用函数
100011.suggestion=请检查连接状态，在调用前确保连接处于活动状态，必要时重新建立连接
100012=连接不存在
100012.reason=指定的连接ID未绑定到当前服务器，或连接信息已失效
100012.suggestion=请核对SDK和ID是否正确，并确认该连接是否已成功在目标服务器上注册绑定
100013=SSL上下文类型错误
100013.reason=提供的 ssl_context 参数类型无效，不符合 ssl.SSLContext 或 ContexConfigDict 的要求
100013.suggestion=请检查传入的 SSL 配置对象，确保其类型为指定的 SSLContext 或配置字典格式
100014=长连接服务启动失败
100014.reason=在启动指定的长连接服务器实例时发生异常
100014.suggestion=请根据错误详情中的 key 值检查相关端口占用、权限配置或网络资源状态
100015=WebSocket 端口类型错误
100015.reason=尝试使用非整数类型的端口号启动 WebSocket 服务
100015.suggestion=请修正配置中的端口号，确保其为有效的整数（int）类型
100016=WebSocket 主机地址类型错误
100016.reason=尝试使用非法类型的主机地址（Host）启动 WebSocket 服务，期望类型为字符串（str）或空值（None）
100016.suggestion=请检查配置中的 host 参数，确保其为有效的字符串格式 IP 地址、域名或 None
100017=WebSocket 连接校验失败
100017.reason=在建立新连接的过程中，服务端期望收到的回响（Echo）标识与实际收到的 sdk_id 不匹配
100017.suggestion=请检查握手协议逻辑，确保客户端发送的验证标识与服务端预期的 sdk_id 一致
100018=缺失 SSL 上下文配置
100018.reason=当前连接模式强制要求启用 SSL/TLS 加密，但未检测到有效的 ssl_context 配置
100018.suggestion=请为该连接模式提供正确的 ssl.SSLContext 实例或 ContexConfigDict 配置字典
100020=日志最大字节数设置错误
100020.reason=配置文件中设定的日志滚动最大字节数不是一个正整数
100020.suggestion=请检查并修改配置文件，确保 max bytes 的值是一个大于 0 的整数
100021=LLM 服务配置缺失
100021.reason=缺少必要的 LLM 服务配置信息，导致无法初始化模型服务
100021.suggestion=请检查配置文件中的 LLM 相关参数（如 API Key、端点地址等）是否完整
100022=LLM 字段格式缺失
100022.reason=LLM 服务返回或请求的内容中缺少必要的格式化字段
100022.suggestion=请核对提示词模板或解析逻辑，确保所有必填字段均已定义
100023=LLM 响应结构错误
100023.reason=LLM 返回的响应数据不符合预定义的结构要求
100023.suggestion=检查模型输出是否符合 JSON 或预设格式，必要时调整提示词以增强输出稳定性
101052=组件单步调试异常
101052.reason=在对组件进行单步跟踪或调试模式执行时发生错误
101052.suggestion=请检查调试器连接状态及组件的上下文信息
100024=LLM 模型来源错误
100024.reason=指定的模型来源无效或无法访问（如未授权或路径不存在）
100024.suggestion=请验证模型提供商、模型名称或本地模型路径是否正确
100025=模型请求失败
100025.reason=向 LLM 服务发起请求时发生网络异常、超时或接口返回错误
100025.suggestion=请检查网络连接、API 配额是否充足以及服务端运行状态
100026=模型加载失败
100026.reason=模型权重加载失败或推理后端初始化异常
100026.suggestion=请检查显存/内存资源是否足够，以及模型文件是否完整
100027=模型类型错误
100027.reason=使用了不支持的模型类型或模型任务类型不匹配
100027.suggestion=请在配置中确认模型类型（如 Chat, Completion, Embedding）是否与调用方法一致
100028=模型解析器解码失败
100028.reason=解析 LLM 输出结果时解码器发生异常，通常是由于非法的编码或截断导致
100028.suggestion=请检查模型的解码参数（如 max_tokens）或尝试清理输出中的异常字符
100029=Agent IR校验失败
100029.reason=Agent 的IR字段验证未通过，内部逻辑流转数据异常
100029.suggestion=请检查 Agent 的提示词设计或工具链输出是否符合预期的 IR 规范
100040=IR 数据校验失败
100040.reason=数据不符合预定义的规范或存在逻辑冲突
100040.suggestion=请检查生成的 IR 数据结构是否完整，并核对字段属性是否合法
100042=IR 版本不支持
100042.reason=当前系统环境无法识别或不支持该版本的 IR 数据
100042.suggestion=请检查 IR 版本号，并确保系统已更新至支持该版本的最新状态
100043=IR 版本配置错误
100043.reason=环境变量或配置项 EXECUTION_SUPPORTED_IR_VERSIONS 的值格式不正确或为空
100043.suggestion=请检查环境配置，确保该变量包含有效的版本列表（如 ["v1", "v2"]）
100044=IR 数据加载失败
100044.reason=无法从提供的 JSON 字符串或文件中解析出有效的 IR 数据，可能存在语法错误
100044.suggestion=请检查 JSON 格式是否正确，并确保其编码为 UTF-8
100045=无效的执行 ID
100045.reason=在状态存储介质（如 Redis 或内存）中找不到指定的执行 ID（Key）
100045.suggestion=请确认执行 ID 是否正确，或检查该 ID 是否已过期、被清理
100051=数据库连接失败
100051.reason=无法建立与数据库服务器的连接，可能是由于地址错误、端口不通或认证失败
100051.suggestion=请检查数据库服务运行状态、网络防火墙配置及连接字符串中的账号密码
100052=数据库执行异常
100052.reason=SQL 语句执行过程中发生错误，可能是由于语法错误、约束冲突或权限不足
100052.suggestion=请检查生成的 SQL 语句逻辑，并核对数据库表结构与索引配置
100061=序列化失败
100061.reason=对象转换为可传输或可存储格式（如 JSON/Protobuf）时发生异常
100061.suggestion=请检查对象中是否包含循环引用或不支持序列化的数据类型
100062=反序列化失败
100062.reason=无法将原始数据转换回指定的数据对象，通常是数据损坏或格式不匹配导致
100062.suggestion=请校验输入数据的完整性，并确保其符合目标数据结构的定义
100066=GET 请求执行失败
100066.reason=执行 HTTP GET 请求时发生错误
100066.suggestion=请检查请求的 URL 是否正确、网络联通性以及目标服务器是否正常响应
100100=Redis 服务不可用
100100.reason=找不到指定的 Redis 服务，或者当前的连接状态异常
100100.suggestion=请检查 Redis 服务器地址配置、端口开放状态以及网络防火墙设置
100101=Redis 初始化失败
100101.reason=在建立 Redis 连接池或初始化客户端时发生异常
100101.suggestion=请核对 Redis 认证密码、数据库索引（DB Index）以及客户端依赖库版本
100102=Redis 数据插入失败
100102.reason=向 Redis 写入数据时发生异常，可能是由于 OOM（内存溢出）或类型不匹配
100102.suggestion=请检查 Redis 剩余内存空间以及所操作的 Key 对应的数据类型是否正确
100103=Redis 列表追加失败
100103.reason=尝试向 Redis 列表（List）末尾添加元素时失败
100103.suggestion=确保目标 Key 是列表类型，并检查 Redis 是否处于可写状态
100104=Redis 元素删除失败
100104.reason=从 Redis 列表中移除指定元素时发生错误
100104.suggestion=请检查 Key 是否存在以及指定的元素值是否在列表中
100105=Redis 指定位置修改失败
100105.reason=尝试设置 Redis 列表中特定索引位置的值时失败，可能索引越界
100105.suggestion=请确保指定的索引（Index）在列表范围内，且 Key 类型正确
100106=Redis 获取列表元素失败
100106.reason=无法从 Redis 列表中获取指定范围或位置的值
100106.suggestion=请确认 Key 是否为列表类型，并检查索引范围是否有效
100107=Redis 弹出元素失败
100107.reason=尝试从列表中弹出（Pop）元素时发生异常
100107.suggestion=请检查列表是否为空，或连接是否在操作期间中断
100108=Redis 获取列表长度失败
100108.reason=无法获取指定列表的长度信息
100108.suggestion=请确认该 Key 确实存在且为列表类型
100109=Redis 获取历史数据失败
100109.reason=从 Redis 中读取历史记录时发生异常，可能是数据格式损坏或 Key 已过期
100109.suggestion=请核对历史数据的存储键名，并确保数据序列化格式兼容
100110=Redis 存储历史数据失败
100110.reason=将历史记录写入 Redis 时失败，可能触发了内存阈值或连接问题
100110.suggestion=请检查 Redis 写入权限及可用内存空间
100111=Redis 设置元素失败
100111.reason=向 Redis 写入元素值时发生异常
100111.suggestion=请检查数据大小是否超过限制，或 Redis 是否配置为只读模式
100112=Redis 删除元素失败
100112.reason=尝试从 Redis 中删除指定的 Key 失败
100112.suggestion=请确认该 Key 是否被锁定或当前用户是否有删除权限
100113=Redis 集群节点配置错误
100113.reason=Redis 集群节点格式不正确，期望格式为以逗号分隔的 IP:PORT 列表
100113.suggestion=请检查配置文件中的 cluster_node 参数，确保每个节点都包含正确的 IP 地址和端口号
100114=获取 Redis 集群节点失败
100114.reason=无法从 Redis 中获取集群节点列表，可能是集群状态异常或权限限制
100114.suggestion=请检查 Redis 集群的运行状态，并确保当前连接账号拥有 CLUSTER NODES 执行权限
100201=Elasticsearch 初始化失败
100201.reason=在初始化 Elasticsearch 客户端时发生异常，可能是由于主机地址无效、协议不匹配或证书错误
100201.suggestion=请核对 Elasticsearch 的连接地址、端口以及身份验证信息是否正确
100300=Embedding 服务请求失败
100300.reason=调用向量化（Embedding）服务时发生异常，可能是网络超时、API 密钥错误或输入文本过长
100300.suggestion=请检查 Embedding 服务的可用性、网络连接以及请求参数是否符合模型输入规范
100502=OBS 配置项错误
100502.reason=必要的 OBS 配置参数不正确或缺失，导致无法通过初始化检查
100502.suggestion=请检查 Access Key (AK)、Secret Key (SK) 以及 Endpoint 等配置是否填写正确
100503=存储桶检查失败
100503.reason=执行 Head Bucket 操作失败，通常是因为存储桶不存在、名称错误或访问权限不足
100503.suggestion=请确认存储桶（Bucket）名称是否正确，并检查当前账号是否拥有该桶的访问权限
100504=OBS 文件上传失败
100504.reason=上传文件到 OBS 时被服务端拒绝或发生网络中断
100504.suggestion=请根据返回的状态码检查上传权限、对象大小限制或存储空间配额
100505=OBS 获取对象失败
100505.reason=无法从存储桶获取对象，可能是对象已被删除或路径错误
100505.suggestion=请确保存储桶中存在该对象，并核对对象的 Key 路径是否完整
100506=OBS 复制对象失败
100506.reason=在存储桶内复制对象时操作失败
100506.suggestion=请检查源对象是否存在，以及目标路径是否具有写权限
100507=OBS 删除对象失败
100507.reason=尝试从存储桶中删除对象时失败
100507.suggestion=请确认当前账号拥有该对象的删除权限，并核对对象标识符
101001=配置格式错误
101001.reason=系统需要 “操作配置”（action_map）是键值对的格式（比如 “名称：内容”），但传入的格式不符合要求
101001.suggestion=请检查配置内容，确认 “操作配置”（action_map）部分是 “名称: 内容” 这样的键值对格式，而非其他格式
101002=配置规则冲突
101002.reason=在使用异步函数（async_fn）模式下，禁止同时指定包装类（wrap_cls）
101002.suggestion=请根据函数性质选择其一：使用 wrap_cls 进行同步对象包装，或使用 async_fn 进行纯异步函数注册
101003=LLM调用失败
101003.reason=LLM组件调用模型服务失败，可能是模型请求参数错误、服务不可用或网络异常
101003.suggestion=请检查模型服务状态、API配置及网络连接，参考详细错误信息定位具体原因
101004=配置类型非法
101004.reason=wrap_cls 必须是 Invokable 的子类，以便引擎进行合规的生命周期管理
101004.suggestion=请检查类继承关系，确保自定义的包装类继承自框架提供的 Invokable 基类
101005=配置不支持的关键字参数
101005.reason=检测到其作用类的 init 方法中存在不支持的关键字参数
101005.suggestion=请简化类的构造函数参数，或使用框架支持的标准参数命名规范
101006=环境变量 TGF_ENABLE 取值错误
101006.reason=系统环境变量 TGF_ENABLE 必须设为 'true' 或 'false'（不区分大小写），当前值不合法
101006.suggestion=请检查环境配置文件或 export 命令，将 TGF_ENABLE 设置为合法布尔值字符串
101007=未找到可调用实体
101007.reason=在指定的引用范围或归属者中找不到可调用实体
101007.suggestion=请核对编排文件中的节点名称是否与注册的组件名称严格匹配
101008=未找到指定变量值
101008.reason=编排逻辑中引用的变量在当前的上下文或作用域中不存在
101008.suggestion=请检查数据流传递配置，确保该变量在之前的步骤中已被正确定义或赋值
101009=配置数据格式错误（JSON 格式非法）
101009.reason=生成的 JSON 结构损坏或不符合编排引擎规范
101009.suggestion=请检查编译器的输出，或验证手动修改后的内容满足规范
101010=集合类型非法
101010.reason=invokable_irs 字段期望为一个字符串列表（每个字符串应为 JSON 格式），但实际传入类型不符
101010.suggestion=请检查传入参数，确保 invokable_irs 是一个包含 JSON 字符串的列表
101011=参数格式错误
101011.reason=无法解析或不符合规范
101011.suggestion=请根据提示修复对应索引处的 JSON 语法或结构错误
101012=系统配置类型错误
101012.reason=system_configs 参数必须以列表（list）形式提供
101012.suggestion=请将系统配置项封装在列表结构中后再进行传递
101013=Agent 标识信息缺失
101013.reason=在执行删除操作时，每个 Agent 必须同时提供 agentId 和 version 属性
101013.suggestion=请核对待删除列表，确保每个项都包含完整的 ID 和版本号信息
101014=执行器状态码不支持
101014.reason=接收到了一个执行器层面的未知或不支持的状态码
101014.suggestion=请检查执行器版本是否与编排引擎匹配，或核对自定义状态码的定义
101015=未知流状态码
101015.reason=流式处理过程中出现了未定义的响应状态码
101015.suggestion=请查阅流式接口协议文档，确认该状态码是否为新增类型或异常上报
101016=IR 注销失败
101016.reason=尝试注销指定的中间表示（IR）组件时失败
101016.suggestion=请检查该 IR 是否正在运行中，并根据返回的状态码确认注销权限
101017=IR 运行异常
101017.reason=启动或执行指定的 IR 实例时发生错误
101017.suggestion=请检查 IR 依赖的服务是否就绪，以及运行时输入的参数是否符合要求
101018=用户输入发送失败
101018.reason=无法将用户输入透传给IR 实例
101018.suggestion=请确认会话（Session）是否仍处于活动状态，并检查网络连接或回调地址是否有效
101019=IR 注册失败
101019.reason=向管理中心注册新的 IR 组件时被拒绝
101019.suggestion=请检查 IR 标识（ID）是否冲突，以及提交的 IR 定义是否完整且符合规范
101020=IR 更新失败
101020.reason=尝试更新已存在的 IR 定义时发生错误
101020.suggestion=请验证更新内容的版本号一致性，并确保当前服务允许热更新操作
101021=IR 管理器缺失
101021.reason=系统中找不到IR 管理器实例，导致管理操作无法路由
101021.suggestion=请检查初始化配置中是否正确注册了该名称的管理器，并核对拼写是否正确
101022=Invokable 管理器缺失
