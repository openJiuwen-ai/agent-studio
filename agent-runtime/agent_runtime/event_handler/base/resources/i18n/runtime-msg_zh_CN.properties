101048.reason=在对用户输入进行安全检查（自定义输入护栏）时发生异常，导致无法判断内容是否合规
101048.suggestion=请检查自定义输入护栏的脚本逻辑或后端检测服务的可用性
101049=自定义执行护栏错误
101049.reason=在组件执行过程中的特定安全检查环节触发了自定义护栏逻辑异常
101049.suggestion=请排查自定义校验规则的代码是否存在逻辑漏洞或执行超时
101050=默认执行护栏错误
101050.reason=系统内置的默认安全护栏在处理组件输出结果时发生非预期崩溃
101050.suggestion=请检查模型输出是否包含特殊不可见字符，并确保系统内置护栏规则库为最新版本
101059=提问组件反思逻辑失败
101059.reason=提问组件在进行“自我反思”时模型调用失败或逻辑中断
101059.suggestion=请检查反思步骤关联的模型状态，确保其提示词能够引导模型输出正确的判定结论
101741=API组件初始化失败
101741.reason=API组件在尝试加载接口配置、初始化鉴权信息或准备执行环境时发生异常
101741.suggestion=请检查API组件的连接器配置，确保目标接口的访问地址及基本认证参数正确无误
101742=API组件参数校验错误
101742.reason=API组件接收到的输入参数不符合目标接口的要求，如缺少必填字段或参数类型不匹配
101742.suggestion=请根据接口文档核对并修正该组件的参数映射，确保传入数据格式合法
101743=API组件输入未定义
101743.reason=API组件的输入端（Inputs）配置缺失，导致无法构造有效的请求报文发送至目标服务器
101743.suggestion=请在组件配置面板中定义输入变量，并确保其已正确连接至前置节点的输出数据
101744=API组件输出处理错误
101744.reason=目标API成功响应，但在尝试解析响应体（Response Body）或将结果映射到工作流变量时失败
101744.suggestion=请检查响应解析逻辑（如 JSON Path），确保其与目标接口实际返回的数据结构保持一致
101745=API组件执行异常
101745.reason=在执行网络请求期间发生底层错误，包括但不限于连接超时、DNS解析失败或收到 5xx 系列服务器错误
101745.suggestion=请确认外部服务是否运行正常，并检查网络防火墙或代理服务器是否允许编排引擎访问该接口地址
101041=规划器类型非法
101041.reason=规划器组件配置了系统无法识别的规划算法类型，导致任务拆解引擎无法初始化。
101041.suggestion=请检查 Planner 节点的“规划模式”设置，确保选择了当前版本支持的合法类型。
101801=子工作流构建失败
101801.reason=系统无法根据中间表示（IR）构造子工作流实例。这通常是因为引用的子工作流已被删除、未发布或 ID 不存在。
101801.suggestion=请确认子工作流是否存在且处于已发布状态，并重新保存父工作流以刷新引用。
101802=子工作流初始化错误
101802.reason=子工作流在加载资源、准备变量空间或连接内部组件时发生非预期异常。
101802.suggestion=请单独测试运行该子工作流，排除其内部节点配置导致的初始化障碍。
101803=子工作流配置校验失败
101803.reason=父工作流中定义的子工作流节点参数配置不完整或不符合子工作流的输入要求
101803.suggestion=请进入该组件的参数映射界面，确保所有子工作流要求的必填输入项均已正确映射。
101804=子工作流执行异常
101804.reason=子工作流在运行过程中由于内部节点报错导致流程中断
101804.suggestion=请查看该子工作流的具体执行日志，定位内部具体哪个节点触发了异常。
101805=非法的子工作流引用
101805.reason=递归调用冲突：检测到子工作流 ID 与当前父工作流 ID 相同。系统禁止自循环引用以防止死循环。
101805.suggestion=请更换引用的子工作流，避免在工作流中直接或间接地调用自身。
101811=不支持的循环类型
101811.reason=循环组件配置了系统无法识别的循环模式。
101811.suggestion=请检查循环节点的类型设置，确保其为系统支持的模式（如按次数循环或按列表项迭代）。
101812=循环组件必填项缺失
101812.reason=在执行循环时，关键配置字段为空，导致循环引擎无法确定起始条件或迭代对象。
101812.suggestion=请在循环组件配置中填写缺失的字段，例如迭代列表或终止条件。
101813=循环组件字段类型错误
101813.reason=字段的输入类型与循环模式要求的类型不符（例如：列表循环要求输入为 list，但实际收到了 string）。
101813.suggestion=请检查前置节点传递给循环组件的变量类型，确保数据格式满足循环逻辑的要求。
101862=循环次数非法
101862.reason=循环次数配置超出了系统允许的范围 [1, 1000]，旨在防止因配置失误导致的死循环或资源耗尽。
101862.suggestion=请将循环次数调整为 1 到 1000 之间的整数。
101831=聚合值类型不一致
101831.reason=尝试对不同类型的数据进行聚合（例如将数字和对象强行合并到同一个列表），导致类型冲突。
101831.suggestion=请确保所有参与聚合的数据项类型一致，或在聚合前使用脚本节点统一数据格式。
101832=不支持的聚合策略
101832.reason=系统无法执行指定的聚合策略（例如无效的合并算法或摘要算法）。
101832.suggestion=请在聚合组件配置中选择有效的策略，如“追加到列表”、“对象合并”或“字符串拼接”。
101850=输入字段不能为空
101850.reason=组件要求的必填输入字段未能获取到任何数据（None 或空字符串）。
101850.suggestion=请检查工作流的上游节点是否输出了该字段，或在当前节点为该字段配置默认值。
101870=不支持的 MCP 类型
101870.reason=系统接收到无法识别的 MCP 组件类型 可能是协议版本不匹配或引用了未注册的扩展协议。
101870.suggestion=请检查 MCP 服务器的协议版本，并确保在编排引擎中正确配置了对应的协议处理器。
101872=MCP 组件必填项缺失
101872.reason=在执行协议交互时，关键字段为空。
101872.suggestion=请完善 MCP 组件的配置信息，确保所有标识外部服务或资源的必填参数均已填写。
101873=MCP 执行错误
101873.reason=在与 MCP 服务器进行通信或执行远程指令时发生异常
101873.suggestion=请检查外部 MCP 服务的运行状态、网络连通性以及该服务生成的详细错误日志。
101874=不支持的 MCP 方法
101874.reason=尝试调用 MCP 协议中未定义或当前服务器未实现的方法
101874.suggestion=请核对 MCP 服务器支持的功能列表（Capabilities），确保调用的方法在协议规范内。
101875=MCP 参数类型错误
101875.reason=参数的输入值类型与协议预定义的类型不符。
101875.suggestion=请检查工作流中传递给 MCP 组件的变量类型，确保其符合协议定义的规范。
101890=卡片组件初始化失败
101890.reason=卡片组件在加载渲染引擎或读取基础配置时发生异常
101890.suggestion=请检查卡片节点的输入参数配置，确保引用的卡片协议版本与当前平台适配
101891=卡片模板缺失
101891.reason=卡片组件未检测到有效的卡片 JSON 模板或模板 ID，导致无法构建交互视图
101891.suggestion=请在组件配置中填入合法的卡片模板内容，或从模板库中选择一个已发布的模板
101892=卡片模板组装错误
101892.reason=在将业务变量注入卡片模板时发生错误，通常是由于引用的变量不存在或模板占位符语法错误
101892.suggestion=请检查卡片模板中的变量绑定配置，确保所有占位符对应的变量在工作流上下文中均已定义
101893=卡片组件调用非预期错误
101893.reason=同步调用卡片发送接口时，由于底层库异常或第三方网关返回了未定义的错误码
101893.suggestion=请查看系统日志以排查网络连接问题或卡片消息推送平台的实时状态
101894=卡片组件异步调用异常
101894.reason=在异步（Async）推送卡片消息的过程中，事件循环中断或回调处理程序抛出异常
101894.suggestion=请检查异步执行器的资源占用情况，并确认消息队列或 Webhook 地址是否响应超时
101032=工作流定义失效
101032.reason=工作流拓扑结构定义存在逻辑断点或不合法，导致执行引擎无法定位后续待执行的节点
101032.suggestion=请检查工作流画布中的节点连接线是否完整，确保没有孤立节点，并重新保存/发布工作流以刷新定义
101039=组件执行错误
101039.reason=工作流运行至具体的某个节点时，组件内部逻辑抛出异常。该错误通常由组件特有的运行环境或业务逻辑触发
101039.suggestion=请查看对应节点的输入输出日志，根据报错详情定位并修复具体组件的配置问题
101040=工作流执行异常
101040.reason=工作流引擎在调度或管理执行生命周期时遇到系统级错误。这可能涉及内存溢出、线程中断或数据库状态同步失败
101040.suggestion=请尝试重新触发工作流任务，若错误持续出现，请联系系统管理员检查后台服务运行状态
101046=工作流循环执行超限
101046.reason=工作流中存在逻辑回环，且运行时的总跳转次数或循环轮数已超过系统全局设定的硬性上限。此机制用于防止无限循环耗尽计算资源
101046.suggestion=请优化工作流逻辑，确保循环具备明确的跳出条件，或检查是否存在逻辑设计死循环
101051=回调异常信息采集失败
101051.reason=工作流在触发异常回调时，未能成功捕获或序列化当前执行栈的错误上下文。
101051.suggestion=请检查回调记录器的存储空间或外部日志系统的连接状态，确保系统有权限写入异常追踪数据。
#101052-101058重复
101901=组件配置加载失败
101901.reason=加载组件的具体配置时失败，原因可能是该组件已下线或版本配置不匹配。
101901.suggestion=请更新该节点的组件版本，或在组件库中重新确认该组件的发布状态。
101902=IR 校验错误
101902.reason=工作流的中间表示（Intermediate Representation）未能通过语法或逻辑一致性校验。
101902.suggestion=请根据详细提示修复画布中的逻辑冲突（如循环依赖或必填端口未连线）。
101903=无效的 ID 格式
101903.reason=工作流或节点 ID 包含了系统禁止的特殊字符，目前仅支持数字、字母和下划线。
101903.suggestion=请修改 ID 名称，移除空格、连字符（-）或其他特殊符号。
101904=初始化数据类型错误
101904.reason=启动工作流时传入的初始参数不完整，必须提供完整的 IR（定义）或 workflow_state（状态恢复数据）。
101904.suggestion=请检查调用接口的 Payload，确保提供了正确的启动参数。
101905=组件执行超时
101905.reason=节点的运行时间超过了预设的上限，系统为防止资源长期占用已自动终止该任务。
101905.suggestion=请检查该节点的业务逻辑是否存在死循环或长耗时操作，或者在组件设置中调大执行超时时间限制。
101906=工作流初始化失败
101906.reason=工作流在启动阶段无法正确加载运行环境、解析 IR 定义或分配执行资源
101906.suggestion=请根据报错原因排查工作流配置的完整性，并确认编排引擎的系统资源是否充裕。
101907=工作流执行被终止
101907.reason=执行实例已被手动中止或由于系统级指令强制关停。
101907.suggestion=如果这不是预期的手动操作，请检查是否有外部监控服务触发了强制停止逻辑。
101908=任务达到最大迭代次数
101908.reason=任务节点执行的循环次数超过了系统或节点设定的硬上限，通常是为了防止逻辑死循环。
101908.suggestion=请检查循环逻辑的终止条件是否正确，确保在预期内能正常退出循环。
101911=异步执行冲突
101911.reason=尝试对同一个执行实例进行并发异步操作，或分布式环境下任务锁定冲突。
101911.suggestion=请确保不要对同一执行 ID 同时发起多个状态变更请求，并检查分布式锁（例如 Redis Lock）的状态。
101912=获取异步结果失败
101912.reason=引擎尝试从后端存储检索异步任务的运行结果时失败
101912.suggestion=请确认任务存储服务的连通性，并检查任务结果是否已过期被清理。
101913=取消异步任务失败
101913.reason=尝试停止异步任务时，由于任务已完成、任务已不存在或调度器拒绝操作而失败。
101913.suggestion=请确认任务的实时状态，若任务仍在运行但无法取消，请检查调度引擎的响应能力。
101914=Celery 代理初始化失败
101914.reason=工作流异步引擎无法连接到 Celery。
101914.suggestion=请检查中间件服务的运行状态及连接字符串配置，确保网络防火墙已放行对应端口。
101920=ApsWorker 注册失败
101920.reason=执行节点尝试在异步工作流调度中心注册自身身份时发生错误
101920.suggestion=请检查工作节点的网络环境及集群配置，确保各节点 ID 唯一且心跳同步正常。
101921=Redis 监听器异常
101921.reason=ApsWorker 在监听 Redis 消息发布订阅（Pub/Sub）频道时发生连接中断或数据解析错误
101921.suggestion=请确认 Redis 服务的稳定性，并检查是否存在大并发消息导致监听缓冲区溢出。
101922=获取本地主机名错误
101922.reason=异步工作节点在尝试识别本地主机标识时失败，导致无法完成服务注册。
101922.suggestion=请检查运行环境的系统配置，确保 /etc/hosts 或相关的 DNS 配置允许正确解析主机名。
101923=Worker ID 异常
101923.reason=异步执行任务时发现 Worker ID 不合法或已失效，导致任务无法被正确指派或认领
101923.suggestion=请重启该节点的 Worker 服务，确保系统自动分配一个有效的唯一标识。
101924=异常终点组件触发终止
101924.reason=执行流程进入了预设的“异常结束”节点，该节点主动触发了工作流的非正常终止逻辑。
101924.suggestion=这是由于业务逻辑触碰了预设的报错路径（Error Path），请根据业务流程排查为何会流转至此异常终点。
101931=工作流流式回调实例无效
101931.reason=工作流在尝试进行流式数据推送到前端或下游时，发现注册的回调处理实例（Callback Instance）已销毁、未初始化或类型不匹配。
101931.suggestion=请检查流式调用接口的上下文生命周期，确保在整个执行期间回调对象保持活跃，且没有被提前回收。
101951=组件类冲突
101951.reason=尝试在组件池中注册组件，但该类型名称已被其他组件占用。
101951.suggestion=请检查自定义组件的命名空间或类型定义，确保每个扩展组件在全局范围内具有唯一的类型标识。
101952=无效的组件类名称
101952.reason=组件类型名称不符合系统命名规范（如包含特殊字符或关键字冲突）
101952.suggestion=请修改组件类的注册名称，仅使用合法的字符组合，并避开系统的保留字。
101953=注册对象类型错误
101953.reason=组件池注册接口期望接收到一个类对象（Class），但实际传入了实例、函数或其他非类类型的数据。
101953.suggestion=请确保在调用注册方法时传递的是组件类本身，而非已实例化的对象或方法引用。
101954=组件类未找到
101954.reason=工作流引擎尝试加载节点，但在当前运行环境的组件池中未找到对应的注册信息。
101954.suggestion=请确认该自定义组件是否已正确导入并执行了注册逻辑，或者检查 IR 中定义的类型名称是否拼写正确
101955=组件实例化失败
101955.reason=组件池找到了类定义，但在调用构造函数创建组件实例时抛出异常。这通常由组件构造函数中的逻辑错误或缺少必要的构造参数引起。
101955.suggestion=请检查组件类的 __init__ 方法代码，确保其能够独立于特定执行上下文正确创建对象。
101956=组件池初始化失败
101956.reason=系统在启动时扫描插件目录或建立组件索引失败。
101956.suggestion=请检查插件目录权限、配置文件路径以及是否有损坏的第三方组件包导致扫描中断。
102001=LLM 服务返回空值
102001.reason=模型推理服务响应成功但在 Body 中未包含任何文本内容或有效负载，通常发生在模型拒绝回答或触发安全过滤时。
102001.suggestion=请检查输入提示词是否敏感，或尝试调整模型的温度值以改变生成策略。
102002=HTTP 请求网络错误
102002.reason=在调用远程模型接口时发生网络层异常，如 DNS 解析失败、网关超时（504）或连接被重置。
102002.suggestion=请检查模型服务商的 API 地址是否可访问，并确认网络防火墙或代理服务器配置正常。
102003=LLM 业务逻辑错误
102003.reason=模型服务返回了非 200 状态码，或者在协议层面返回了明确的错误标识。
102003.suggestion=请根据具体报错信息检查账户余额、Token 配额或 API 参数是否合法。
102004=LLM 服务连接失败
102004.reason=建立 TCP 连接或 SSL 握手时失败，通常由于目标服务器宕机或网络不稳定。
102004.suggestion=请验证模型服务端点（Endpoint）是否正确，并尝试增加连接重试机制。
102005=环境变量获取失败
102005.reason=提示词引擎无法从执行上下文中读取必要的环境变量（如 API_KEY、BASE_URL），导致无法发起请求。
102005.suggestion=请确保系统环境变量已正确注入，或者在工作流的全局配置中补全缺少的配置项。
102006=输出解析器初始化失败
102006.reason=定义的解析逻辑在创建实例时报错。
102006.suggestion=请检查输出解析器的配置是否符合规范，确保与预期的模型输出格式匹配。
102007=输出解析器执行异常
102007.reason=在处理模型返回的字符串时，解析器抛出异常。通常是因为模型输出并非合法的 JSON 或未包含预期的关键字。
102007.suggestion=请优化提示词以引导模型输出更严谨的结构化数据，或在解析前增加数据清洗步骤。
102008=MEP 协议返回异常
102008.reason=多模型执行协议（MEP）在分发或聚合多个模型请求时发生逻辑错误。
102008.suggestion=请检查 MEP 路由规则配置，确保下游各个备选模型的健康状况正常。
102009=运行时上下文缺失
102009.reason=提示词引擎在执行过程中丢失了必需的运行时上下文引用，导致无法读取 Trace ID 或变量池。
102009.suggestion=请检查线程池调度或异步调用链中是否正确传递了 Context 对象。
102010=IR 构建错误
102010.reason=在将提示词定义转换为IR时解析失败
102010.suggestion=请检查提示词配置中的 DSL 语法，确保条件分支和变量引用的逻辑闭环。
102011=不支持的模型服务类型
102011.reason=配置中指定了系统无法识别的服务提供商或协议类型。
102011.suggestion=请核对支持的服务类型列表（例如 OpenAI, Anthropic, DashScope 等），修正拼写或更新驱动包。
102012=LLM 执行被中断
102012.reason=组件在等待模型返回时接收到了来自运行环境的中断信号，可能是由于用户主动取消或工作流整体超时。
102012.suggestion=无需特别处理，如非预期中断，请排查前端是否存在误触取消操作或调大全局超时设置。
102050=变量初始化参数错误
102050.reason=在创建提示词变量对象时传入了错误的参数类型或配置项，导致变量引擎无法识别占位符。
102050.suggestion=请检查模板中定义的变量属性（如 Name, Type, Default Value），确保其符合变量定义的规范。
102051=组装器初始化错误
102051.reason=提示词组装器在初始化时接收到的配置信息不完整，无法建立模板与变量之间的映射关系。
102051.suggestion=请核对组装器的核心配置，确保传入了有效的模板内容和变量列表。
102052=组装器键值对匹配错误
102052.reason=更新模板参数时，传入的键（Key）在模板定义中不存在，或者缺少了模板中要求的必填变量。
102052.suggestion=请根据模板定义的变量名核对输入数据。
102053=模板格式化错误
102053.reason=模板语法存在错误（如大括号未闭合、使用了非法转义字符），导致 Jinja2 或 String 格式化引擎无法渲染最终结果。
102053.suggestion=请检查提示词文本中的语法格式，确保占位符使用正确且没有语法逻辑冲突。
102054=提示词组件初始化失败
102054.reason=提示词管理组件在加载配置或连接后端存储时发生异常。
102054.suggestion=请检查组件的注册状态和配置文件路径，确保组件所需的底层资源已就绪。
102055=提示词组件调用失败
102055.reason=在执行提示词渲染或处理逻辑时发生非预期中断
102055.suggestion=请检查调用链中的变量传递过程，排查是否存在空指针或非法的逻辑跳转。
102056=格式定义非法
102056.reason=为约束模型输出而定义的格式不符合标准规范
102056.suggestion=请使用标准的校验工具检查结构定义，确保 keywords（如 properties, type）使用正确。
102101=提示词模板重复
102101.reason=尝试创建或导入模板时，系统检测到已存在相同名称或唯一标识符的模板，导致命名冲突。
102101.suggestion=请更换模板名称或 ID，或在更新现有模板时使用更新接口而非创建接口。
102102=提示词模板不存在
102102.reason=引擎尝试加载指定的模板，但在数据库或本地存储中未找到对应的记录。可能是由于模板 ID 错误、模板已被删除或环境迁移导致数据丢失
102102.suggestion=请核对模板 ID 是否正确，并确认该模板在当前租户或空间下是否已保存。
102103=模板数据异常
102103.reason=从存储中检索到的模板数据格式损坏或关键字段（如内容、版本号）缺失，导致模板无法被正常解析。
102103.suggestion=请尝试重新保存该模板以修复受损的数据结构，或检查数据库层面的数据一致性。
102104=模板存储加载失败
102104.reason=系统在连接模板仓库时发生 I/O 错误或权限受限，导致无法读取模板列表。
102104.suggestion=请检查存储服务的运行状态（如 MySQL/Redis），并验证服务账号的读取权限。
102150=提示词变异操作失
102150.reason=大模型在执行“变异”指令（即对提示词进行同义改写或策略调整）时，未能保留原始模板中的变量占位符，导致新生成的提示词无法与业务参数匹配。
102150.suggestion=请检查变异指令的提示词，要求模型在优化内容时必须严格保留所有的变量标签。
102151=提示词交叉操作失败
102151.reason=大模型在执行“交叉”指令（即融合两个优秀提示词的优点）时，生成的混合模板丢失了父级模板中的共有占位符。
102151.suggestion=请确保参与交叉的父模板具有一致的占位符结构，并优化交叉引导词以强调结构完整性。
102152=测试用例占位符不匹配
102152.reason=在提示词评估或自优化过程中，测试用例中定义的变量占位符与原始模板不一致，导致数据无法正确注入。
102152.suggestion=请核对测试用例的数据结构，确保其 Key 值与原始提示词模板中的变量名完全对应。
102153=测试用例内容不匹配
102153.reason=测试用例中的消息模板内容与系统中存储的原始模板内容不符，无法建立有效的版本对应关系进行对比优化。
102153.suggestion=请刷新测试用例，确保其基于当前最新的提示词模板版本构建。
102154=提示词优化参数非法
102154.reason=启动优化任务时传入的配置参数（如迭代次数、样本比例或评估指标权重）不符合逻辑或超出范围。
102154.suggestion=请根据接口文档核对优化参数的取值范围，并确保所有必填配置项均已正确填写。
102155=提示词优化任务不存在
102155.reason=系统无法根据提供的 Job ID 检索到对应的优化任务记录，可能是任务已被物理删除或 ID 输入错误。
102155.suggestion=请确认任务 ID 的准确性，或在任务列表中重新发起优化申请。
102156=任务状态异常
102156.reason=尝试执行的操作（如停止、重启）与任务当前所处的状态冲突（例如：无法重启一个正在运行中的任务）。
102156.suggestion=请先刷新任务状态，待当前流程结束后再尝试后续操作。
102157=提示词优化评估失败
102157.reason=在对新生成的提示词变体进行自动评分或效果对比时发生异常。可能是由于评估模型不可用或评估逻辑代码崩溃。
102157.suggestion=请检查评估器的配置，并确保评估模型及其 API Key 状态正常。
102158=优化任务启动失败
102158.reason=任务调度器在尝试拉起优化工作流时发生底层错误。通常涉及资源锁定、并发配额限制或初始化超时。
102158.suggestion=请稍后重试，或检查系统后端调度引擎的负载情况。
102159=优化任务重启失败
102159.reason=尝试对已失败或已停止的任务进行断点续传或重跑时失败。
102159.suggestion=如果多次重启失败，建议直接克隆该任务并创建一个全新的优化作业。
102160=无法获取评估标签
102160.reason=在优化评估阶段，系统无法从历史消息记录中提取出作为基准的预期结果，导致无法计算准确率或评分。
102160.suggestion=请检查测试数据集，确保每个测试用例都包含正确的预期输出。
102161=优化用例校验失败
102161.reason=导入或执行优化任务时，测试用例的数据格式未能通过校验。
102161.suggestion=请按照指定的 CSV/JSON 模板格式重新整理测试用例数据，并注意字符编码规范。
102170=优化任务存储失败
102170.reason=在保存优化中间过程、变体结果或评估报告时，数据库写入发生异常。
102170.suggestion=请检查后端存储服务的磁盘空间及连接池状态，确保系统具备持久化大规模评估数据的能力。
102201=不支持的元模板类型
102201.reason=请求的元模板标识符不在系统支持的预设列表内，无法匹配对应的生成逻辑。
102201.suggestion=请核对元模板名称是否正确，或参考系统文档获取当前支持的元模板清单。
102202=元模板不存在
102202.reason=尝试调用的元模板文件或配置在存储层缺失，可能已被删除或路径配置错误。
102202.suggestion=请确认元模板资源已部署至正确目录下，或联系管理员同步模板库。
102203=元模板工具解析失败
102203.reason=在解析用于生成提示词的工具描述（Tool/Function Definition）时发生错误，通常由于工具的 JSON 格式非法。
102203.suggestion=请检查传入元模板的工具定义，确保其符合标准的 OpenAPI 或 Function Calling 规范。
102204=元模板构建失败
102204.reason=元模板渲染引擎在将基础元数据转化为最终提示词时发生内部崩溃或逻辑死锁。
102204.suggestion=请排查元模板内容的复杂性，并检查系统内存资源是否足以支撑大规模模板构建。
102205=元模板输入项缺失
102205.reason=调用元模板生成接口时，未提供该模板必需的控制参数。
102205.suggestion=请根据元模板的要求补全输入参数，确保所有必填 Key 均已赋值。
102206=LLM 配置类型不支持
102206.reason=为元模板指定的下游推理模型类型尚未适配模板生成引擎。
102206.suggestion=请切换至主流的 LLM 类型（如 OpenAI、Azure 或系统内置驱动），或联系开发团队增加模型适配。
102207=LLM 生成结果失败
102207.reason=在执行提示词自动生成的推理过程中，模型返回了错误信息或连接中断。
102207.suggestion=请检查后端 LLM 服务的状态、配额以及请求超时设置。
102208=模板编辑失败
102208.reason=在对现有模板进行程序化修改或打补丁（Patching）时发生错误，通常与文件权限或并发锁定有关。
102208.suggestion=请确认当前用户具备该模板的编辑权限，并检查是否有其他任务正在占用该资源。
102209=存储类型不匹配
102209.reason=提示词引擎试图通过错误的存储协议访问数据。
102209.suggestion=请核对系统配置中的 Storage Backend 设置，确保与物理存储类型保持一致。
102210=提示词模块初始化错误
102210.reason=提示词引擎的核心配置文件加载失败，或者依赖的外部环境变量存在逻辑冲突。
102210.suggestion=请重新检查主配置文件（如 config.yaml）的语法，并确保所有必需的外部依赖项已安装。
102211=捕获到未知异常
102211.reason=提示词引擎触发了未预见的代码逻辑异常。
102211.suggestion=请将详细的错误堆栈反馈给技术支持团队，并尝试重启相关服务模块。
102212=SSL 环境配置解析异常
102212.reason=用于 SSL 证书验证的环境变量 JSON 字符串格式非法，导致引擎无法建立安全连接。
102212.suggestion=请核对 SSL_VERIFY 相关环境变量的 JSON 格式，确保双引号和转义字符使用正确。
102213=优化反馈处理异常
102213.reason=在处理用户提供的针对提示词效果的反馈数据时发生异常。
102213.suggestion=请检查反馈数据的入参结构，确保反馈 ID 与优化任务 ID 正确对应
102214=优化 Badcase 异常
102214.reason=系统在尝试根据 Badcase 数据反向优化提示词时失败，可能是由于 Badcase 样本量不足或格式不兼容。
102214.suggestion=请增加 Badcase 样本的多样性，并确保每个样本都包含明确的错误分类标签。
103001=规划器配置校验失败
103001.reason=规划器组件的元数据或运行参数不完整，导致无法通过预执行检查。
103001.suggestion=请检查规划器节点的设置界面，确保所有必填项已正确填写，且逻辑连接无误。
103002=提示词名称缺失
103002.reason=规划器未关联具体的提示词（Prompt）模板，导致引擎无法构造任务拆解指令。
103002.suggestion=请在规划器配置中选择一个有效的提示词模板，或在关联的提示词节点中指定名称。
103003=规划模型缺失
103003.reason=未为规划器指定执行推理的大语言模型（LLM），导致规划逻辑无法启动。
103003.suggestion=请在规划器设置中关联一个已配置的模型服务。
103004=模型调用失败
103004.reason=规划引擎在请求大模型进行任务规划时，收到错误响应或连接超时。
103004.suggestion=请检查后端模型服务的可用性、API Key 有效性、模型是否支持插件与MCP调用及网络连通性。
103005=规划状态类获取失败
103005.reason=系统无法根据当前的规划模式找到对应的状态管理类，通常由插件加载错误引起。
103005.suggestion=请检查规划模式设置是否与当前引擎版本兼容，并确认相关扩展组件已安装。
103006=正则解析失败
103006.reason=规划器尝试利用正则表达式从模型返回的文本中提取结构化步骤时失败，模型输出格式不符合预期。
103006.suggestion=请优化规划器的提示词，引导模型输出更加规范的格式，或调整正则表达式的匹配规则。
103007=索引访问失败
103007.reason=规划引擎在尝试访问步骤列表或变量数组时，索引值超出了实际范围。
103007.suggestion=请排查前置逻辑是否产生了预期的列表数据，确保索引操作在合法范围内。
103008=插件配置获取失败
103008.reason=规划器无法从全局配置中心读取所需的插件参数（如 API 密钥或 Endpoint）。
103008.suggestion=请检查全局变量或插件中心的配置信息，确保规划器依赖的参数已正确注入。
103009=比较表达式解析失败
103009.reason=规划器中的条件判断表达式非法，导致无法得出布尔值（True/False）结果。
103009.suggestion=请核对比较运算符（如 ==, >, <）的使用方式，确保比较的对象类型可兼容。
103010=IR 模板获取失败
103010.reason=系统找不到对应规划模式的中间表示（IR）模板文件，导致无法生成可执行的执行图。
103010.suggestion=请确认规划模式配置正确，并检查系统资源目录中是否存在对应的 .ir 或配置文件。
103011=提示词格式化失败
103011.reason=在将运行时变量注入规划提示词模板时发生错误，通常是由于变量占位符语法错误。
103011.suggestion=请检查提示词模板中的变量标签，确保其与传入的参数名称一一对应。
103011.2=规划护栏执行失败
103011.2.reason=规划器在执行安全护栏检查时发生异常，无法验证规划步骤的合规性。
103011.2.suggestion=请检查护栏规则库的连接状态及规则脚本的合法性。
103012=技能配置获取失败
103012.reason=规划器无法读取技能的详细配置参数。
103012.suggestion=请在技能管理页面检查该技能的定义，确保其配置参数已正确保存。
103013=技能类型获取失败
103013.reason=规划引擎无法识别目标技能的调用类型（如 HTTP, Python, Shell）。
103013.suggestion=请确认技能的元数据定义完整，且该类型技能在当前环境中已被支持。
103014=工作流起始组件解析失败
103014.reason=规划器在尝试调用子工作流时，无法识别该工作流的起始节点。
103014.suggestion=请打开被调用的子工作流，确保其包含且仅包含一个合法的起始节点。
103015=工作流组件运行失败
103015.reason=规划器指派的工作流节点在执行过程中发生非预期中断或内部错误。
103015.suggestion=请查看子工作流的执行日志，定位具体的异常节点并进行修复。
103016=指定版本的 IR 模板获取失败
103016.reason=系统尝试根据版本号加载规划模式的IR模板，但在存储库中未找到匹配的记录。可能是该版本已被移除或版本号不合法。
103016.suggestion=请核对规划器配置中的版本信息，确保所引用的版本在模板库中已发布且处于可用状态。
103017=规划器配置类型校验失败
103017.reason=字段的参数类型不正确。
103017.suggestion=请进入规划器节点的参数设置界面，根据提示的类型要求重新配置相关字段，确保数据格式合法。
103018=规划器流式处理异常
103018.reason=规划引擎在执行流式输出（Streaming）或处理模型增量响应时发生非预期中断。。
103018.suggestion=请检查网络连接的稳定性，并确认模型服务端是否支持当前所选规划模式下的流式输出协议。
103025=Agent 输入类型不支持
103025.reason=Agent 接收到了无法识别的输入格式（如不支持的文件类型或非法的多模态数据流），导致推理引擎无法解析任务指令。
103025.suggestion=请检查传递给 Agent 的变量类型，确保其符合当前模型支持的输入规范（如文本、图片链接或标准 JSON）。
103028=工具切换配置非法
103028.reason=用于控制 Agent 动态选择工具的切换逻辑字典（Tool Switch Dict）格式不正确，导致 Agent 无法在多个工具间进行路由。
103028.suggestion=请核对 tool_switch 字段的结构，确保其为一个合法的键值对映射，且 Key 值与已注册的工具名称一致。
103029=插件更新类型错误
103029.reason=尝试动态更新 Agent 的技能集时传入了非法对象。系统要求输入 RestFulApi 或 Function 的列表。
103029.suggestion=请确保在更新插件列表时，传入的对象是标准的 API 定义或函数定义类，而非原始字符串或其他基础类型。
103030=任务 ID 长度超限
103030.reason=Agent 内部生成的任务追踪 ID 或外部传入的 task_id 长度超过了系统预设的最大阈值，可能导致数据库写入失败。
103030.suggestion=请缩短任务标识符的长度，或检查任务生成逻辑中是否存在重复拼接 ID 的异常。
103031=MCP 插件更新类型错误
103031.reason=在通过 Model Context Protocol (MCP) 扩展 Agent 能力时，传入的参数类型不符合规范。
103031.suggestion=请核对 MCP 接口定义，确保传入的是合法的 MCP 协议对象列表。
103100=参数提取原子能力调用失败
103100.reason=控制器在调用底层原子技能尝试从用户输入或上下文提取参数时发生异常，通常是由于模型未按规范要求输出或变量映射失败。
103100.suggestion=请检查参数提取器的配置，并核对模型是否能够准确识别当前上下文中的关键槽位信息。
103101=参数修正原子能力调用失败
103101.reason=在执行参数补全或修正逻辑时，控制器无法正确构造修正指令或接收到模型反馈的错误信息。
103101.suggestion=请验证“参数修正”环节的提示词引导词，确保模型在参数缺失时能正确触发反问或补充逻辑。
103102=控制器执行中断
103102.reason=控制器在管理执行流时收到了预料之外的中断信号，可能源于用户的主动干预或系统级的高优先级强制抢占。
103102.suggestion=请检查当前控制器的并发策略，并确认是否存在其他模块触发了非法的中断指令。
103103=全局意图跳转超限
103103.reason=由于全局意图频繁触发，控制器执行的跳转次数超过了系统设定的阈值，旨在防止陷入意图切换死循环。
103103.suggestion=请优化全局意图的触发阈值或关键词权重，确保意图识别的精准度，避免多个意图配置过于接近。
103104=意图识别错误
103104.reason=控制器在意图检测模块执行期间发生内部崩溃或返回了非预期的分类结果。
103104.suggestion=请检查意图分类器所依赖的分类模型及样本库，确保意图定义列表不为空且格式合法。
103105=意图关联工作流执行错误
103105.reason=意图识别成功，但在调度该意图所绑定的对应工作流执行时发生故障。
103105.suggestion=请进入该意图对应的工作流画布进行调试，确认起始节点的输入参数与控制器传递的意图上下文兼容。
103200=多智能体运行器已启动
103200.reason=尝试启动一个已经在运行中的多智能体协作任务。系统禁止对同一个 Runner 实例进行重复初始化。
103200.suggestion=请检查调用逻辑，确保在发起新任务前旧任务已结束，或直接通过状态查询接口获取当前进度。
103201=目标成员不存在
103201.reason=在多智能体分发任务或进行路由跳转时，系统无法在当前群组中找到标识的Agent 成员。
103201.suggestion=请核对协作网络中的 Agent 注册名称，确保分发逻辑或路由配置中指向的成员 ID 正确无误。
103202=消息处理挂起
103202.reason=多智能体流转进入了人工干预节点或需要外部反馈的环节，当前消息处理进程已挂起，等待用户输入。
103202.suggestion=请通过人工审核接口或对话框提供所需的反馈数据，以恢复智能体协作流。
103203=协作处理被中断
103203.reason=多智能体在进行跨 Agent 通讯或推理过程中收到了强制中断信号，导致当前的协作事务链条断裂。
103203.suggestion=请检查是否存在节点超时或系统资源抢占导致的任务强制释放。
103204=运行器未在运行
103204.reason=尝试对一个已经停止、崩溃或处于闲置状态的运行器发送控制指令（如挂起、终止）。
103204.suggestion=请先验证运行器的实时状态，确保指令发送对象处于活跃的运行周期内。
103205=运行器尚未启动
103205.reason=在运行器完成初始化并正式启动之前，尝试调用其执行接口，导致非法操作异常。
103205.suggestion=请确保在执行 run() 或 next() 方法前，已正确完成了运行器的配置与 start() 调用。
103231=运行空间执行错误
103231.reason=多智能体在共享的运行空间内执行协作任务时发生底层运行环境崩溃或未捕获的运行时异常。这通常涉及线程池满载或内存溢出。
103231.suggestion=请检查系统资源占用情况，或查看详细堆栈日志以确认是否由于某个 Agent 的私有代码逻辑导致了环境污染。
103232=消息队列关闭失败
103232.reason=在尝试销毁运行空间时，无法正常关闭 Agent 间通讯的消息总线。
103232.suggestion=请确认是否存在残留的死锁进程正在持续写入队列，必要时请手动重置消息代理服务。
103233=停止运行任务失败
103233.reason=控制器尝试终止正在运行的协作任务，但由于某个 Agent 处于不可中断的阻塞调用中，导致任务停止指令超时或失效。
103233.suggestion=请检查 Agent 工具调用是否设置了合理的超时时间，确保所有长时间运行的节点都能响应中断信号。
103234=空闲停止执行失败
103234.reason=运行空间检测到所有 Agent 已进入空闲状态，尝试自动关停环境以节省资源时发生异常。
103234.suggestion=检查运行空间的垃圾回收（GC）逻辑，确保没有非托管资源在空闲期阻碍销毁进程。
103235=停止条件校验失败
103235.reason=在每次迭代后校验“终止条件”时，由于上下文变量解析错误或逻辑表达式非法，导致无法判断协作是否该结束。
103235.suggestion=请核对协作配置中的终止表达式语法，并确保表达式引用的变量在上下文中确实存在。
103236=执行 Stop-When 逻辑错误
103236.reason=控制器在执行特定的 stop_when 触发器逻辑时发生错误。与一般条件校验不同，这通常涉及更复杂的代码片段执行失败。
103236.suggestion=请调试 stop_when 的自定义函数逻辑，确保其在各种边界场景（如空响应或异常返回）下均能稳定运行。
103261=成员消息处理失败
103261.reason=这通常是因为该成员的提示词模板损坏或输入参数不符合其预设规范。
103261.suggestion=请检查该成员的独立配置，并核对前置 Agent 传递给它的上下文数据是否完整。
103262=消息执行期间异常
103262.reason=成员在执行推理任务的生命周期中抛出未捕获异常。这可能涉及模型接口调用失败、插件执行崩溃或内存溢出。
103262.suggestion=查看该成员的运行日志以定位具体崩溃位置，确保其依赖的外部服务和插件环境正常。
103291=消息未处于处理状态
103291.reason=尝试对消息进行操作（如更新状态或强制中止）时，发现该消息已离开处理队列，或处于非活动状态（如已完成、已丢弃）。
103291.suggestion=请检查消息 ID 是否过期，并确认任务调度器是否已意外移除了该消息。
103300=智能体群组已启动
103300.reason=尝试对一个已处于 Active 状态的群组实例执行 start() 命令。
103300.suggestion=在发起新一轮群组协作前，请先确认旧任务是否已通过 stop() 释放资源，或直接使用当前活跃实例。
103301=群组未初始化
103301.reason=在群组组件未完成初始化或未进入运行状态时尝试调用其协作接口。
103301.suggestion=请检查群组定义的 IR 结构，确保在调用执行方法前已成功执行了 init() 过程。
103302=群组执行异常
103302.reason=群组在协调多个 Agent 间的流转逻辑（如投票、轮询或分发）时发生系统级错误。
103302.suggestion=重点排查群组的选择器（Selector）逻辑，确保其能根据当前上下文正确计算出下一个执行的 Agent。
103303=成员注册失败
103303.reason=向群组添加 Agent 成员时失败。
103303.suggestion=请检查 Agent 成员的唯一性，确保没有重复将同一个 Agent 实例以不同角色注册到同一个群组中。
104001=流式运行异常
104001.reason=执行引擎在以流式（Stream）模式启动任务时，未能正确建立实时传输通道，或在传输过程中遭遇非预期的连接中断。
104001.suggestion=请检查前端与后端之间的 WebSocket 或 SSE 连接状态，确保中间件未拦截长连接。
104002=执行器内部错误
104002.reason=执行器在处理任务调度或线程分配时触发了底层系统异常。这通常涉及 CPU 调度超时或内核级指令错误。
104002.suggestion=请尝试重启执行引擎服务，若错误持续，请检查服务器系统日志排查资源竞争问题。
104003=通用请求错误
104003.reason=执行器向外部服务（如数据库或第三方 API）发起请求时发生未知错误，通常是由于网络抖动或请求格式不符合对方规范。
104003.suggestion=请检查网络防火墙配置，并验证执行器对外部资源的访问权限。
104004=算子执行失败
104004.reason=执行引擎在运行特定的算子逻辑（如数据转换、数学运算节点）时抛出异常。可能是由于输入数据类型非法或算子内部算法崩溃。
104004.suggestion=请进入画布检查该节点的输入值格式，确保符合算子的业务逻辑要求。
104005=从管理器获取节点列表失败
104005.reason=分布式环境下的执行器无法从管理节点同步当前的 Worker 节点列表，导致任务无法正常分发。
104005.suggestion=请检查管理节点的服务状态，并确保执行器与管理器之间的 RPC 通信（如 gRPC/HTTP）未被拦截。
104006=会话清理失败
104006.reason=任务结束后，执行器尝试回收 Session 资源、删除临时文件或释放内存缓存时发生冲突。
104006.suggestion=请排查是否存在文件句柄被其他进程锁定，或增加会话清理的重试机制。
104007=用户输入执行失败
104007.reason=执行器在处理用户实时注入的指令（如动态参数修改）时，由于指令校验未通过或执行环境不支持动态干预而报错。
104007.suggestion=请确保用户输入的参数符合预设的规范，且当前执行状态允许动态更新。
104008=流式数据处理失败
104008.reason=执行引擎在解析来自模型的流式 Token 块或中间过程数据时发生序列化错误。
104008.suggestion=请检查模型输出的协议版本是否与执行引擎匹配，避免因不兼容的 Stream 格式导致解析中断。
105001=插件未知异常
105001.reason=插件系统触发了未捕获的运行时异常，通常由于插件包逻辑错误或与当前引擎版本不兼容导致。
105001.suggestion=请检查插件运行日志，定位具体的崩溃堆栈信息，并确认插件的依赖库是否完整。
105002=插件已存在
105002.reason=尝试上传或注册一个标识符（Plugin ID）已存在的插件。
105002.suggestion=请更改插件名称或版本号，或使用“更新插件”接口对现有插件进行覆盖安装。
105003=插件未找到
105003.reason=工作流在调用插件时，无法在插件库或文件系统中检索到对应的执行文件或配置。
105003.suggestion=请确认该插件是否已在插件管理页面成功发布，并检查 ID 引用是否正确。
105004=插件参数校验失败
105004.reason=调用插件时传入的动态参数不符合插件定义的规范（如缺少必填项或类型不匹配）。
105004.suggestion=请根据插件定义的输入规范调整工作流中的输入变量，确保参数合法。
105005=插件免费额度用尽
105005.reason=预置插件免费额度已消耗完。
105005.suggestion=请自行配置鉴权使用或是等待下月额度刷新。
105006=插件数据库异常
105006.reason=插件管理服务在读写插件元数据、权限或状态时发生数据库连接错误。
105006.suggestion=请检查后端数据库服务状态及连接池配额，确认插件配置表未被锁定。
105009=插件向量推理失败
105009.reason=在对插件描述进行语义向量化以便进行搜索推荐时，向量模型服务返回错误。
105009.suggestion=请检查 Embedding 模型服务的可用性，确认插件的描述文本长度未超过模型限制。
105010=API 鉴权失败
105010.reason=调用外部 API 插件时，目标服务器返回了身份验证错误（如 401 Unauthorized）。
105010.suggestion=请重新检查插件配置中的 API Key、Bearer Token 或 OAuth2 凭证是否有效且未过期。
105011=API 响应状态码错误
105011.reason=外部 API 响应了非 200/201 的异常状态码（如 403, 404, 500 等）。
105011.suggestion=请根据返回的具体 HTTP 状态码排查三方服务逻辑，确保接口地址和请求方法正确。
105012=API 请求超时
105012.reason=外部 API 在预设时间内未返回数据。可能是由于网络延迟或三方服务处理耗时过长。
105012.suggestion=请在插件设置中适当调大超时阈值，或检查目标服务的网络连通性。
105013=响应体过大
105013.reason=插件返回的数据量超过了系统设定的安全负载上限，可能导致内存溢出。
105013.suggestion=请限制 API 返回的数据条数，或在插件中启用分页/流式处理。
105014=代理连接失败
105014.reason=系统尝试通过代理服务器访问外部插件 API 时，代理服务器拒绝连接或无法解析目标。
105014.suggestion=请检查全局代理配置（Proxy Server/Port/Credentials）是否正确，并确认内网穿透状态。
108003=子节点执行索引缺失
108003.reason=在追踪调用链时，父节点下属的子节点执行顺序索引不存在。这会导致 Insight 无法正确还原执行拓扑图。
108003.suggestion=请检查执行引擎在下发子任务时是否正确生成了 Sequence ID，并确认分布式链路追踪数据的完整性。
108004=调用 ID 不存在
108004.reason=尝试查询特定执行记录时，系统无法找到该 invoke_id。可能是数据已被清理，或者在异步写入数据库时发生了延迟。
108004.suggestion=请确认查询的 ID 是否准确。如果是在任务刚结束时查询，请稍后重试以等待数据同步完成。
108005=调用类型不匹配
108005.reason=Insight 分析引擎预期处理的是提示词类型的调用数据。
108005.suggestion=请核对监控过滤器设置，确保请求的分析对象与实际节点的组件类型保持一致。
108006=项目 ID 缺失
108006.reason=Insight 请求头中缺少必填的 x-insight-project-id 参数，导致无法对监控数据进行项目隔离。
108006.suggestion=请在请求 Header 中补充项目 ID，确保监控指标能归档到正确的业务组下。
109000=高级意图初始化失败
109000.reason=高级意图识别节点在加载语义模型、分类 、规范或初始化向量时发生错误。
109000.suggestion=请检查该节点所选的分类模型是否在线，并验证意图分类列表是否符合 JSON 规范。
109011=策略环境变量未配置
109011.reason=系统尝试加载外部自定义策略，但环境变量未在服务器中定义。
109011.suggestion=请在系统环境变量或配置文件中设置该路径，指向存放自定义策略脚本的目录。
109012=策略路径不存在
109012.reason=配置的策略路径在文件系统中不存在，导致动态加载器无法定位脚本文件。
109012.suggestion=请检查路径拼写是否正确，并确认执行账户具备访问该目录的读取权限。
109013=无效的策略文件路径
109013.reason=提供的路径指向了一个目录而非具体的策略执行脚本（如 .py 或 .yaml），导致解析中断。
109013.suggestion=请明确指定策略脚本的完整文件名及其后缀。
109014=策略注册中心未初始化
109014.reason=在注册中心完成 initialize() 过程前，尝试执行策略查找或调用。通常发生在系统启动阶段的竞态冲突。
109014.suggestion=请检查启动逻辑，确保所有的 Provider 和策略注册动作在主逻辑运行前已成功闭环。
109015=策略未匹配
109015.reason=在指定的提供者下未找到规划策略。
109015.suggestion=请核对策略名称及关联的 Provider 标识符，确认该策略是否已在系统中注册并启用。
109016=内置策略加载失败
109016.reason=系统内置的核心策略文件缺失。这通常由于软件包安装不完整或版本更新导致的文件迁移。
109016.suggestion=请尝试重新部署引擎核心组件，确保 builtin_strategies 目录下的所有资源完整。
109017=策略异步调用异常
109017.reason=策略组件在执行异步调用时触发了非预期的运行时错误。
109017.suggestion=排查策略内部的异步逻辑，检查是否存在未捕获的协程异常或事件循环冲突。
109018=Agent 迭代次数配置非法
109018.reason=智能体的最大迭代步数被设置为非正整数。这会防止模型进入死循环或无法启动任务。
109018.suggestion=请将 max_iteration 修改为大于 0 的整数。
109019=插件地址缺失
109019.reason=规划策略在尝试分发任务给特定插件时，发现该插件的调用 URL 为空。
109019.suggestion=请检查插件管理模块中的 Endpoint 配置，确保该插件已正确部署并暴露了合法的 API 地址。
109300=记忆 IR 配置错误
109300.reason=记忆引擎的IR配置文件存在逻辑错误或格式不合法，导致无法正确映射记忆分片与检索策略。
109300.suggestion=请检查记忆模块的 DSL 或 JSON 配置文件，确保记忆类型（如语义记忆、情节记忆）的参数定义符合规范。
109500=上下文配置错误
109500.reason=上下文引擎的基础配置设置不当
109500.suggestion=请核对系统设置中的 Context Policy，确保滑动窗口或摘要策略的参数在模型支持的范围内。
109501=记忆客户端初始化失败
109501.reason=上下文引擎在尝试初始化负责连接后端记忆存储的代理（Proxy）或客户端时失败。
109501.suggestion=请检查后端存储服务（如 Redis, Milvus 或数据库）的连接地址、端口及鉴权凭证是否正确。
109510=处理器创建失败
109510.reason=系统无法为当前的对话会话创建上下文处理器，可能是由于自定义处理逻辑脚本加载失败。
109510.suggestion=请检查上下文处理流的插件或中间件配置，确保相关类名或函数路径正确。
120007=代码返回值 Key 缺失
120007.reason=代码节点执行完毕后，返回的字典中不包含画布上定义的输出变量名。
120007.suggestion=请检查 Python/JS 脚本的 return 语句，确保返回的字典键名与节点“输出设置”中的定义严格一致。
120008=代码返回值类型错误
120008.reason=代码节点的返回对象类型非法。系统要求返回一个 dict（字典），以便进行变量映射，但实际收到了其他类型。
120008.suggestion=请修改代码逻辑，确保最终结果以 { "key": value } 的格式返回，不要直接返回字符串或列表。
100702=MySQL 配置检查错误
100702.reason=数据库初始化时，必要的 MySQL 配置项（如 Host, Port, User）缺失或格式不正确。
100702.suggestion=请检查环境变量或配置文件中的数据库连接参数，确保连接地址和凭证有效。
100703=SQL 执行失败
100703.reason=执行 SQL 指令时发生数据库层面异常。
100703.suggestion=请根据 MySQL 返回的具体错误原因排查是否涉及表结构缺失、数据冲突或连接超时。
100704=SQL 语法校验失败
100704.reason=构建的 SQL 命令未能通过预检查，可能是语法错误或包含非法字符。
100704.suggestion=请核对生成的动态 SQL 语句，确保表名、字段名拼写正确且符合语法规范。
102301=模型信息参数非法
102301.reason=在启动 NL2Agent（自然语言生成 Agent）流程时，传入的模型配置信息（如名称、版本、Endpoint）校验不通过。
102301.suggestion=请确保 modelInfo 中包含有效的模型标识及必要的认证信息。
102302=IR 转换为云端 DSL 失败
102302.reason=将IR转换为特定 DSL 描述时失败。
102302.suggestion=请检查中间表示逻辑是否过于复杂，超出了目标云平台 DSL 的支持范围。
102303=意图澄清预处理失败
102303.reason=在自然语言转 Agent 的第一阶段，系统尝试理解用户模糊意图并引导澄清时发生错误。
102303.suggestion=请调整预处理阶段的提示词指令，使其能够更健壮地处理非结构化用户输入。
102304=工作流结构设计失败
102304.reason=模型无法根据用户需求设计出合理的节点拓扑结构（如节点间连线冲突或逻辑环路）。
102304.suggestion=请尝试简化用户需求描述，或者增加可用工具/插件的描述信息以便模型更好地拆解。
102305=工作流 IR 生成失败
102305.reason=模型虽然设计了结构，IRJSON 时失败。
102305.suggestion=请检查后端生成模板，确保其生成的 JSON 结构符合规范。
102306=NL2Agent 模型服务异常
102306.reason=NL2Agent 专用模型在调用过程中返回错误。
102306.suggestion=检查模型服务的并发限额及健康状况。
102307=工作流状态机异常
102307.reason=在 NL2Agent 动态构建工作流时，当前生成的会话状态或工作流状态不匹配，导致流程中断。
102307.suggestion=请清除当前生成缓存，尝试启动一个新的生成会话。
102308=工作流 IR 反思修正失败
102308.reason=在对生成的 IR 进行自我检查和反思修正（Self-Reflection）时，修正逻辑报错。
102308.suggestion=优化反思阶段的提示词设置，使其能够给出更明确的纠错指令。
120000=QA 选项列表为空
120000.reason=在执行问答（QA）类节点或组件时，预设的备选选项配置为空，导致模型或系统无法进行选择。
120000.suggestion=请检查 QA 节点的配置，确保“选项”列表中至少包含一个有效的备选项。
120001=不支持的 QA 策略
120001.reason=QA 节点配置了系统无法识别的检索或匹配策略。
120001.suggestion=请在节点设置中重新选择支持的匹配策略（如“精确匹配”或“语义匹配”）。
120002=索引超出范围
120002.reason=系统尝试根据索引获取选项或数据时，索引值超过了数组或列表的实际长度。
120002.suggestion=请检查前置逻辑生成的数据量，确保索引访问在合法区间内。
120003=输入键缺失
120003.reason=QA 组件在处理输入数据时，未能找到指定的参数键。
120003.suggestion=请检查节点间的连线映射，确保上游节点正确输出了变量。
120005=全局变量类型错误
120005.reason=全局变量的默认值类型与定义的变量类型（如 String, Integer, Object）不匹配。
120005.suggestion=请在全局变量管理页面核对该变量的类型定义，并确保默认值符合该格式。
120006=工作流节点超限
120006.reason=当前工作流包含的节点总数超过了系统允许的最大限制。
121007=事件封装失败
121007.reason=事件流处理过程中发生异常
121007.suggestion=请查看日志获取详细错误信息
02001003=接口参数校验异常
02001003.reason=接口参数校验异常，如控制器输入为空，插件JSON解析失败。
02001003.suggestion=请重新校验接口参数是否正确。
02101016=智能体应用执行权限不足
02101016.reason=当前用户无权在指定项目中运行该智能体应用。
02101016.suggestion=请确认当前用户在目标项目中拥有该智能体应用的执行权限。
02201020=工作流执行权限不足
02201020.reason=当前执行请求的projectId与智能体所属projectId不一致。
02201020.suggestion=请确保executeParams中的projectId与智能体所属projectId一致。
02201021=不是最新的工作流
02201021.reason=当前操作的工作流版本已过期，可能已被其他用户修改或保存了新版本。
02201021.suggestion=请刷新网页后重试。
