# nginx-gateway 配置：跨节点入口的 Basic Auth + 反代到 VictoriaLogs
# 读写 htpasswd 文件由 deploy-monitor.sh 用 openssl 分别生成并挂载进容器。

server {
    listen 3100 ssl;
    client_max_body_size 10m;

    ssl_certificate /etc/nginx/tls/gateway.crt;
    ssl_certificate_key /etc/nginx/tls/gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LOGS:10m;
    ssl_session_timeout 10m;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Vector app 节点只能写入，不能复用采集凭据查询日志。
    location ^~ /insert/elasticsearch/ {
        auth_basic "VictoriaLogs write";
        auth_basic_user_file /etc/nginx/htpasswd/write.htpasswd;
        proxy_pass http://victoria-logs:9428;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_set_header X-Scope-OrgID $http_x_scope_orgid;
    }

    # 运维查询入口使用独立凭据；Grafana 在内部网络直接连接 VictoriaLogs。
    location ^~ /select/ {
        auth_basic "VictoriaLogs query";
        auth_basic_user_file /etc/nginx/htpasswd/query.htpasswd;
        proxy_pass http://victoria-logs:9428;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    location / {
        return 403;
    }
}
