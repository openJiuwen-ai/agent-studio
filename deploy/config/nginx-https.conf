# openJiuwen AgentStudio Nginx 配置 — HTTPS 模式
# 使用方式：将此文件重命名为 nginx.conf 替换 config/nginx.conf
# 前置条件：需在 config/ 目录放置证书文件 cert.pem、pri_key.pem、keypassfifo
# 并在 docker-compose.yml 中取消证书 volume 的注释
worker_processes auto;
worker_rlimit_nofile 65535;
events {
   # 提升每个worker进程能处理的并发连接数
   worker_connections 16000;
   # 使用高性能的epoll事件模型（仅适用于Linux）
   use epoll;
   # 允许worker进程同时接受多个新连接
   multi_accept on;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    port_in_redirect off;
    server_tokens off;

    etag off;

    # 基础性能优化
    sendfile on;                 # 启用高效文件传输模式[1,7](@ref)
    tcp_nopush on;               # 仅在sendfile开启时生效，合并数据包[1](@ref)
    tcp_nodelay on;              # 禁用Nagle算法，降低小包延迟[1,7](@ref)
    keepalive_timeout 65;        # 保持长连接，减少TCP握手开销[1,6](@ref)
    keepalive_requests 1000;     # 单个连接最大请求数[1](@ref)

    # 文件描述符缓存 (极大提升IO性能)[2](@ref)
    open_file_cache max=100000 inactive=20s; # 缓存文件句柄和元数据
    open_file_cache_valid 30s;   # 缓存有效性检查间隔
    open_file_cache_min_uses 2;  # 文件被访问至少2次后才缓存
    open_file_cache_errors on;   # 缓存错误信息

    gzip  on;
    gzip_min_length  1k;
    gzip_buffers     4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 2;
    gzip_types       text/plain application/x-javascript text/css application/xml text/javascript application/x-httpd-php application/javascript application/json;

    client_body_timeout 600;
    client_header_timeout 600;
    send_timeout 600;

    # 缓冲区优化
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 注意：不要把 $X_Csrf_Token 写进访问日志，避免敏感凭证随日志扩散。
    # 该变量仍会通过下方 proxy_set_header X-Csrf-Token 透传给后端。
    log_format access '$remote_addr --- $remote_user [$time_local] "$filtered_request"' '$status "$http_user_agent" "$http_x_forwarded_for" --- "$http_upgrade" --- "$connection_upgrade"';

    access_log /opt/cloud/wiseagent-nginx/logs/access.log access;
    error_log /opt/cloud/wiseagent-nginx/logs/error.log crit;

    upstream agent_manager {
        server studio-manager:31111 max_fails=3 fail_timeout=5 weight=1;
    }

    upstream agent_service {
        server studio-service:31113 max_fails=3 fail_timeout=5 weight=1;
    }

    server {
        # `pod_ip` 是字面量主机名，必须能被 DNS 解析，否则 nginx 启动失败。
        # 默认监听全部地址；如需绑定指定 IP，把 443 改为 <IP>:443。
        # listen 80;
        listen 443 ssl;
        http2 on;
        proxy_ignore_client_abort   on;
        ssl_protocols TLSv1.2;
        ssl_session_timeout 60s;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        add_header Access-Control-Allow-Origin $http_origin;
        add_header Access-Control-Allow-Headers *;
        add_header Access-Control-Allow-Methods "GET, POST,PUT,DELETE,PATCH";
        add_header X-Frame-Options "SAMEORIGIN" always;

        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;
        ssl_password_file /home/service/nginx/keypassfifo;
        ssl_certificate  /home/secret/cert.pem;
        ssl_certificate_key  /home/secret/pri_key.pem;
        ssl_stapling on;
        ssl_stapling_verify on;
        server_name  localhost;

        if ( $request_method = 'OPTIONS' ) {
            return 204;
        }
        set $filtered_request $request;

        if ($filtered_request ~ (.*)assword=[^&]*(.*)) {
            set $filtered_request $1assword=******$2;
        }
        if ($filtered_request ~ (.*)oken=[^&]*(.*)) {
            set $filtered_request $1oken=******$2;
        }
        if ($filtered_request ~ (.*)key=[^&]*(.*)) {
            set $filtered_request $1key=******$2;
        }
        if ($filtered_request ~ (.*)Key=[^&]*(.*)) {
            set $filtered_request $1Key=******$2;
        }
        if ($filtered_request ~ (.*)(123456|password123)(.*)) {
            set $filtered_request $1******$3;
        }

        set $X_Csrf_Token "";
        if ($http_cookie ~ "X-Csrf-Token=(.+?)(?=;|$)") {
           set $X_Csrf_Token $1;
        }

        error_page 502 503 /50x.html;

        client_max_body_size 1200M;
        client_body_buffer_size 2048k;
        proxy_connect_timeout    600;
        proxy_read_timeout       600;
        proxy_send_timeout       600;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header test $http_x_forwarded_for;
        proxy_set_header X-Original-URL https://$host;
        proxy_set_header X-Csrf-Token $X_Csrf_Token;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header X-Powered-By;
        fastcgi_hide_header X-Powered-By;
        proxy_buffers 8 8k;
        proxy_busy_buffers_size   32k;
        proxy_buffer_size    32k;

        set $server_scheme "https";

        #下面误删，用于服务path需要前缀时，替换成：rewrite ^${context_path}/(.*) /$1 last;
        #rewritercontext_path

        location / {
            rewrite ^/$ /openjiuwen/ permanent;
        }

        location /actuator/health {
        	default_type text/plain;
        	return 200 "health check";
        }

        location = /openjiuwen {
            rewrite ^/openjiuwen$ /openjiuwen/ permanent;
        }

        location ~* /openjiuwen/(.+\.(js|css|jpeg|jpg|png|svg|webp))$ {
            alias  /opt/cloud/wiseagent-nginx/nginx/dist/hws/$1;
            add_header Cache-Control "max-age=31536000";
            access_log off;
        }
        location /openjiuwen/{
            alias  /opt/cloud/wiseagent-nginx/nginx/dist/hws/;
            index  index.html index.htm;
            try_files  $uri $uri/ index.html =404;
            if ($request_filename ~ .*\.(htm|html)$)
            {
                add_header Cache-Control no-cache;
            }
        }

        location /health {
            proxy_pass  $server_scheme://agent_manager;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_http_version 1.1;
                        proxy_set_header Connection "";
        }

        location /saml/login {
            proxy_pass  $server_scheme://agent_manager;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_http_version 1.1;
                        proxy_set_header Connection "";
        }

        location ~^/v1/.*/agents/generator {
            proxy_pass  $server_scheme://agent_manager;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
        }

        location ~^/v1/.*/workflows/generator {
            proxy_pass  $server_scheme://agent_manager;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
        }

        location ~/v1/.*/agent-manager/.* {
            proxy_pass  $server_scheme://agent_manager;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
        }

