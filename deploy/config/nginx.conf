# openJiuwen AgentStudio Nginx 配置 — HTTP 模式
# 默认用于 Docker Compose 部署（在线/离线）
# 如需 HTTPS，请将此文件替换为 nginx-https.conf，并配置证书

worker_processes auto;
worker_rlimit_nofile 65535;
events {
   worker_connections 16000;
   use epoll;
   multi_accept on;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    port_in_redirect off;
    server_tokens off;

    etag off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    open_file_cache max=100000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip  on;
    gzip_min_length  1k;
    gzip_buffers     4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 2;
    gzip_types       text/plain application/x-javascript text/css application/xml text/javascript application/x-httpd-php application/javascript application/json;

    client_body_timeout 600;
    client_header_timeout 600;
    send_timeout 600;

    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 注意：不要把 $X_Csrf_Token 写进访问日志，避免敏感凭证随日志扩散。
    # 该变量仍会通过下方 proxy_set_header X-Csrf-Token 透传给后端。
    log_format access '$remote_addr --- $remote_user [$time_local] "$filtered_request"' '$status "$http_user_agent" "$http_x_forwarded_for" --- "$http_upgrade" --- "$connection_upgrade"';

    access_log /opt/cloud/wiseagent-nginx/logs/access.log access;
    error_log /opt/cloud/wiseagent-nginx/logs/error.log crit;

    upstream agent_manager {
        server studio-manager:31111 max_fails=3 fail_timeout=5 weight=1;
    }

    upstream agent_builder {
        server studio-builder:31015 max_fails=3 fail_timeout=5 weight=1;
    }

    server {
        listen 80;

        add_header Access-Control-Allow-Origin $http_origin;
        add_header Access-Control-Allow-Headers *;
        add_header Access-Control-Allow-Methods "GET, POST,PUT,DELETE,PATCH";
        add_header X-Frame-Options "SAMEORIGIN" always;

        server_name  localhost;

        if ( $request_method = 'OPTIONS' ) {
            return 204;
        }
        set $filtered_request $request;

        if ($filtered_request ~ (.*)assword=[^&]*(.*)) {
            set $filtered_request $1assword=******$2;
        }
        if ($filtered_request ~ (.*)oken=[^&]*(.*)) {
            set $filtered_request $1oken=******$2;
        }
        if ($filtered_request ~ (.*)key=[^&]*(.*)) {
            set $filtered_request $1key=******$2;
        }
        if ($filtered_request ~ (.*)Key=[^&]*(.*)) {
            set $filtered_request $1Key=******$2;
        }
        if ($filtered_request ~ (.*)(123456|password123)(.*)) {
            set $filtered_request $1******$3;
        }

        set $X_Csrf_Token "";
        if ($http_cookie ~ "X-Csrf-Token=(.+?)(?=;|$)") {
           set $X_Csrf_Token $1;
        }

        error_page 502 503 /50x.html;

        client_max_body_size 1200M;
        client_body_buffer_size 2048k;
        proxy_connect_timeout    600;
        proxy_read_timeout       600;
        proxy_send_timeout       600;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header test $http_x_forwarded_for;
        proxy_set_header X-Original-URL http://$host;
        proxy_set_header X-Csrf-Token $X_Csrf_Token;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header X-Powered-By;
        fastcgi_hide_header X-Powered-By;
        proxy_buffers 8 8k;
        proxy_busy_buffers_size   32k;
        proxy_buffer_size    32k;

        set $server_scheme "http";

        #下面误删，用于服务path需要前缀时，替换成：rewrite ^${context_path}/(.*) /$1 last;
        #rewritercontext_path

        location / {
            rewrite ^/$ /openjiuwen/ permanent;
        }

        location /actuator/health {
        	default_type text/plain;
        	return 200 "health check";
        }

        location = /openjiuwen {
            rewrite ^/openjiuwen$ /openjiuwen/ permanent;
        }

        location ~* /openjiuwen/(.+\.(js|css|jpeg|jpg|png|svg|webp))$ {
            alias  /opt/cloud/wiseagent-nginx/nginx/dist/hws/$1;
            add_header Cache-Control "max-age=31536000";
            access_log off;
        }
        location /openjiuwen/{
            alias  /opt/cloud/wiseagent-nginx/nginx/dist/hws/;
            index  index.html index.htm;
            try_files  $uri $uri/ index.html =404;
            if ($request_filename ~ .*\.(htm|html)$)
            {
                add_header Cache-Control no-cache;
            }
        }

        location /health {
            proxy_pass  $server_scheme://agent_manager;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_http_version 1.1;
                        proxy_set_header Connection "";
        }

        location /saml/login {
            proxy_pass  $server_scheme://agent_manager;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_http_version 1.1;
                        proxy_set_header Connection "";
        }

        location ~^/v1/.*/agents/generator {
            proxy_pass  $server_scheme://agent_manager;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
        }

        location ~^/v1/.*/workflows/generator {
            proxy_pass  $server_scheme://agent_manager;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
        }

        location ~/v1/.*/agent-manager/.* {
            proxy_pass  $server_scheme://agent_manager;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
        }

# /v1/{project_id}/releases/{release_id}
location ~^/v1/.*/releases/.* {
			limit_except GET {
              deny all;
			}
            proxy_pass  $server_scheme://agent_manager;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
            break;
        }

#/v1/agent-builder/chat/completions
location ~^/v1/agent-builder/chat/completions {
            proxy_pass  $server_scheme://agent_builder;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
        }

#/v1/agent-builder/embeddings
location ~^/v1/agent-builder/embeddings {
            proxy_pass  $server_scheme://agent_builder;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
        }

#/v1/agent-builder/rerank
location ~^/v1/agent-builder/rerank {
            proxy_pass  $server_scheme://agent_builder;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
        }
		location /v1 {
            proxy_pass  $server_scheme://agent_manager;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
        }
		location /v2 {
            proxy_pass  $server_scheme://agent_manager;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
        }
   }
}
