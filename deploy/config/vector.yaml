data_dir: /var/lib/vector
timezone: Asia/Shanghai

api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  manager:
    type: file
    include:
      - /logs/studio-manager/**/*.log
    read_from: beginning
    fingerprint: {strategy: device_and_inode}
    multiline:
      start_pattern: '^\[\d{4}-\d{2}-\d{2} '
      mode: halt_before
      condition_pattern: '^\[\d{4}-\d{2}-\d{2} '
      timeout_ms: 1000

  service:
    type: file
    include:
      - /logs/studio-service/**/*.log
    read_from: beginning
    fingerprint: {strategy: device_and_inode}
    multiline:
      start_pattern: '^\[\d{4}-\d{2}-\d{2} '
      mode: halt_before
      condition_pattern: '^\[\d{4}-\d{2}-\d{2} '
      timeout_ms: 1000

  runtime_common:
    type: file
    include:
      - /logs/studio-runtime/common.log
    read_from: beginning
    fingerprint: {strategy: device_and_inode}
    multiline:
      start_pattern: '^\d{4}-\d{2}-\d{2} '
      mode: halt_before
      condition_pattern: '^\d{4}-\d{2}-\d{2} '
      timeout_ms: 1000

  runtime_other:
    type: file
    include:
      - /logs/studio-runtime/agent-runtime/run/*.log
      - /logs/studio-runtime/jiuwen.log/**/*.log*
    exclude:
      - /logs/studio-runtime/jiuwen.log
    read_from: beginning
    fingerprint: {strategy: device_and_inode}

  console:
    type: file
    include:
      - /logs/studio-console/*.log
    read_from: beginning
    fingerprint: {strategy: device_and_inode}

transforms:
  manager_fields:
    type: remap
    inputs: [manager]
    source: |
      .service = "manager"
      .host = get_env_var!("NODE_NAME")
      .collector = "vector"
      .filename = .file
      parsed, err = parse_regex(.message, r'^\[(?P<log_time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\] \[(?P<level>[A-Z ]+)\] \[(?P<trace_id>[^\]]*)\]')
      if err == null {
        .level = strip_whitespace!(parsed.level)
        if parsed.trace_id != "" { .trace_id = parsed.trace_id }
        event_time, time_err = parse_timestamp(parsed.log_time, format: "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC")
        if time_err == null { .timestamp = event_time }
      }

  service_fields:
    type: remap
    inputs: [service]
    source: |
      .service = "service"
      .host = get_env_var!("NODE_NAME")
      .collector = "vector"
      .filename = .file
      parsed, err = parse_regex(.message, r'^\[(?P<log_time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\] \[(?P<level>[A-Z ]+)\] \[(?P<trace_id>[^\]]*)\]')
      if err == null {
        .level = strip_whitespace!(parsed.level)
        if parsed.trace_id != "" { .trace_id = parsed.trace_id }
        event_time, time_err = parse_timestamp(parsed.log_time, format: "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC")
        if time_err == null { .timestamp = event_time }
      }

  runtime_fields:
    type: remap
    inputs: [runtime_common, runtime_other]
    source: |
      .service = "runtime"
      .host = get_env_var!("NODE_NAME")
      .collector = "vector"
      .filename = .file
      parsed, err = parse_regex(.message, r'(?i)^(?:[^|\n]*\|){1,8}\s*(?P<level>TRACE|DEBUG|INFO|WARN|ERROR|FATAL)\s*\|')
      if err == null {
        .level = upcase!(parsed.level)
      }
      time_parts, time_err = parse_regex(.message, r'^(?P<log_time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}[,.]\d{3})')
      if time_err == null {
        normalized_time = replace!(time_parts.log_time, ",", ".")
        event_time, parse_err = parse_timestamp(normalized_time, format: "%Y-%m-%d %H:%M:%S%.3f", timezone: "UTC")
        if parse_err == null { .timestamp = event_time }
      }

  console_fields:
    type: remap
    inputs: [console]
    source: |
      .service = "console"
      .host = get_env_var!("NODE_NAME")
      .collector = "vector"
      .filename = .file
      access_time, access_err = parse_regex(.message, r'^\S+.*\[(?P<log_time>\d{2}/[A-Za-z]{3}/\d{4}:\d{2}:\d{2}:\d{2} [+-]\d{4})\]')
      if access_err == null {
        event_time, parse_err = parse_timestamp(access_time.log_time, format: "%d/%b/%Y:%H:%M:%S %z")
        if parse_err == null { .timestamp = event_time }
      } else {
        error_time, error_err = parse_regex(.message, r'^(?P<log_time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2})')
        if error_err == null {
          event_time, parse_err = parse_timestamp(error_time.log_time, format: "%Y/%m/%d %H:%M:%S", timezone: "UTC")
          if parse_err == null { .timestamp = event_time }
        }
      }

sinks:
  victoria_logs:
    type: elasticsearch
    inputs: [manager_fields, service_fields, runtime_fields, console_fields]
    endpoints:
      - http://victoria-logs:9428/insert/elasticsearch/
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: host,service
    acknowledgements:
      enabled: true
    buffer:
      type: disk
      max_size: 1073741824
      when_full: block
