# ============================================================================
# 客户 Header 改写规则引擎 — 三服务共享配置
# ----------------------------------------------------------------------------
# studio-manager / studio-runtime / studio-builder 共用本文件作为唯一配置源，
# 各服务只读取自己需要的部分。完整用法见 customer-header-deploy-guide.md。
#
# 启用：建议通过 .env 设置 CUSTOMER_HEADER_ENABLED=true，优先级高于本文件。
#       enabled 默认 false（向后兼容：不启用时业务语义不变）。
#
# 改写链路：manager 在 boundary 原样透传 cust-*；下游各服务按 targets.* 自行改名。
# ============================================================================
customer-header:
  # 总开关。生产环境用 .env 的 CUSTOMER_HEADER_ENABLED 覆盖，不要直接改这里。
  enabled: false
  # 运行环境，目前仅 simple 模式启用身份替代。
  environment: simple

  # 客户身份 Header 的原始来源名（客户传入时用的名字）。
  # fallback: iam —— 客户未传时回退到平台自身鉴权主体。
  identity:
    user-id-header: cust-userid
    token-header: cust-token
    fallback: iam

  # 入站捕获白名单：只有此处的 cust-* 会被各服务捕获并参与后续改写。
  # x-auth-token 不在此处，它属于平台鉴权主体，单独处理。
  capture:
    customer-allow: [cust-userid, cust-token]

  # boundary 透传：manager 调下游时原样转发下列 cust-*（不改名），由下游再 rename。
  boundary:
    agent-runtime-inbound:           # → studio-runtime
      customer-passthrough: [cust-userid, cust-token]
    agent-builder-inbound:           # → studio-builder
      customer-passthrough: [cust-userid, cust-token]

  # 下游改写规则。每个 target 对应一类出站调用。
  # mappings: from（原始 cust-*，不区分大小写）→ to（下游期望名，保留大小写）。
  targets:
    # 知识库 LakeSearch（studio-manager，Java 同进程引擎）
    LAKESEARCH:
      mappings:
        - { from: cust-userid, to: userid }
        - { from: cust-token, to: token }

    # IR 检索认证：forward-list 只声明需转发的 Header 名，值运行时来自平台 principal
    # （X-Auth-Token 仅声明名字，不在此存值）。
    IR_AUTH_KEYS:
      forward-list: [cust-userid, cust-token, X-Auth-Token]

    # 以下各 target 结构同构：剥 cust- 前缀，改写为下游期望名。
    RUNTIME_LLM_CHAT:                # studio-runtime：LLM 调用
      mappings:
        - { from: cust-userid, to: userId }
        - { from: cust-token, to: token }

    RUNTIME_MCP_CALL:                # studio-runtime：MCP 外部服务调用（studio-manager 调测出站亦用此规则）
      mappings:
        - { from: cust-userid, to: userId }
        - { from: cust-token, to: token }

    RUNTIME_KB_CALL:                 # studio-runtime：知识库检索
      mappings:
        - { from: cust-userid, to: userId }
        - { from: cust-token, to: token }

    RUNTIME_SEARCH:                  # studio-runtime：Search（待实现，占位）
      mappings:
        - { from: cust-userid, to: userId }
        - { from: cust-token, to: token }

    BUILDER_LLM_CHAT:                # studio-builder：Chat 调测
      mappings:
        - { from: cust-userid, to: userId }
        - { from: cust-token, to: token }

    BUILDER_MODEL_EMBEDDING:          # studio-builder：Embedding 调测
      mappings:
        - { from: cust-userid, to: userId }
        - { from: cust-token, to: token }

    BUILDER_MODEL_RERANK:             # studio-builder：Rerank 调测
      mappings:
        - { from: cust-userid, to: userId }
        - { from: cust-token, to: token }

    # 模型认证探针：rename 规则同上；归一（剥前缀）与 request-over-config 由运行时处理。
    MODEL_AUTH_CHECK:
      mappings:
        - { from: cust-userid, to: userId }
        - { from: cust-token, to: token }

  # 占位：长期记忆 Header 适配，本期不实施（schema 未建模、代码尚未读取）。
  # 预留 optional-integrations.long-term-memory-header-adaptation.enabled = false。
