# paas-env.properties —— 文件化部署环境变量样例(通用)
#
# 用途:无环境变量注入通道的部署环境(参数以文件方式下发),把参数集中于此文件,
#       启动服务前由 paas_env.sh 加载器 source 导出为进程环境变量。
#
# 值的三种形态:
#   1. 平台占位符  —— 如 ${DB_HOST}:环境相关参数,交付时由平台(或部署者)替换;
#   2. 常量        —— 如 6379 / single:通用默认值,无需替换,加载即生效;
#   3. 混合        —— 常量骨架内嵌占位符,如 jdbc:mariadb://${DB_HOST}:3306/agent-builder?...
# 注意:仍含未替换占位符的行会被加载器整行跳过(混合行中的占位符未替换,整行不生效,
#       常量骨架不单独生效——避免注入残缺值)。
#
# 键名形态说明(与 docker-compose.yml 的 environment 段一致,该文件是完整权威键表):
#   - studio-manager(Java)   : 小写下划线,如 spring_datasource_url(与 application-manager.yml 占位符桥同名直通)
#   - runtime/builder(Python): 大写下划线,如 REDIS_HOST / DATASOURCE_OBS_SERVER(Python 侧直接读取)
#   同一参数(如 Redis)在两类服务下各有一份键,指向同一平台参数。
# 以下仅列各服务常用核心键;完整键集见 deploy/docker-compose.yml 对应服务的 environment 段。

# ============ studio-manager(Java)核心 ============
# JDBC URL:混合形态——URL 骨架与库名为常量,主机/账号/口令按环境替换
spring_datasource_url=jdbc:mariadb://${DB_HOST}:3306/agent-builder?allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8
spring_datasource_username=${DB_USERNAME}
spring_datasource_password=${DB_PASSWORD}
# 驱动:MySQL 无需设置;GaussDB/PostgreSQL 部署时按需替换常量值
#spring_datasource_driver_class_name=org.postgresql.Driver
redis_host=${REDIS_HOST}
redis_port=6379
redis_password=${REDIS_PASSWORD}
obs_url=${OBS_URL}
obs_bucket=${OBS_BUCKET}
obs_ak=${OBS_AK}
obs_sk=${OBS_SK}
# 常量:manager 自调用鉴权默认指向自身
user_auth_endpoint=http://127.0.0.1:31111
# 混合:端口为常量,主机按环境替换
agent_runtime_endpoint=http://${RUNTIME_HOST}:31014
agent_builder_endpoint=http://${BUILDER_HOST}:31015

# ============ runtime / builder(Python)核心 ============
REDIS_HOST=${REDIS_HOST}
REDIS_PORT=6379
REDIS_PASSWORD=${REDIS_PASSWORD}
REDIS_MODE=single
DATASOURCE_OBS_SERVER=${OBS_URL}
DATASOURCE_OBS_BUCKET=${OBS_BUCKET}
