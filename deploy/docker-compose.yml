# openJiuwen AgentStudio Docker Compose 部署编排
# 在线/离线统一编排：8 个服务（4 基础设施 + 4 应用）
# 在线部署：IMAGE_SOURCE=ghcr/dockerhub，脚本自动 pull 镜像
# 离线部署：IMAGE_SOURCE=offline，脚本自动 docker load 镜像

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-100m}
    max-file: ${DOCKER_LOG_MAX_FILES:-5}

services:
  # ── 基础设施 ──

  mysql:
    logging: *default-logging
    image: ${MYSQL_IMAGE:-mysql:8.0}
    pull_policy: if_not_present
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-123456}
      MYSQL_DATABASE: "agent-builder"
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_general_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agent-net

  redis:
    logging: *default-logging
    image: ${REDIS_IMAGE:-redis:7}
    pull_policy: if_not_present
    restart: always
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  minio:
    logging: *default-logging
    image: ${MINIO_IMAGE:-minio/minio:latest}
    pull_policy: if_not_present
    restart: always
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${OBS_AK:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBS_SK:-minioadmin}
      MINIO_DOMAIN: minio
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      # minio/minio 镜像不含 curl/bash（/dev/tcp 是 bash 专有），用镜像内置的 mc 探活。
      # `local` 是 mc 内置默认别名，指向 http://localhost:9000。
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      agent-net:
        aliases:
          # OBS SDK 默认使用 virtual-hosted-style，请求 host 为 <bucket>.<endpoint>
          # 此 alias 使 DNS 能解析 <bucket>.minio → minio 容器，兼容 virtual-hosted-style
          - ${OBS_BUCKET:-agent-builder}.minio

  minio-init:
    logging: *default-logging
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    pull_policy: if_not_present
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      OBS_AK: ${OBS_AK:-minioadmin}
      OBS_SK: ${OBS_SK:-minioadmin}
      OBS_BUCKET: ${OBS_BUCKET:-agent-builder}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${OBS_AK} $${OBS_SK};
      mc mb --ignore-existing local/$${OBS_BUCKET};
      echo 'MinIO bucket created';
      "
    networks:
      - agent-net

  # ── 应用服务 ──

  studio-console:
    logging: *default-logging
    image: ${STUDIO_CONSOLE_IMAGE}
    pull_policy: ${APP_PULL_POLICY:-always}
    restart: always
    cpus: 0.5
    mem_limit: 512m
    volumes:
      - ./config/nginx.conf:/home/conf/nginx.conf
      - console_logs:/opt/cloud/wiseagent-nginx/logs
      # HTTPS启动：取消以下注释，并将证书文件放到 ./config/ 目录
      # - ./config/keypassfifo:/home/service/nginx/keypassfifo
      # - ./config/cert.pem:/home/secret/cert.pem
      # - ./config/pri_key.pem:/home/secret/pri_key.pem
    ports:
      # HTTPS启动：改为 443:443
      - '${CONSOLE_PORT:-80}:80'
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/80'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      studio-manager:
        condition: service_healthy
      studio-service:
        condition: service_healthy
      studio-runtime:
        condition: service_healthy
    networks:
      - agent-net

  studio-manager:
    logging: *default-logging
    image: ${STUDIO_MANAGER_IMAGE}
    pull_policy: ${APP_PULL_POLICY:-always}
    restart: always
    privileged: true
    cpus: 2
    mem_limit: 4g
    ports:
      - "${MANAGER_PORT:-31111}:31111"
    volumes:
      # 日志聚合：暴露 Java 日志供 Vector 采集（可选，见 ./deploy.sh logging）
      - manager_logs:/opt/cloud/studio-manager/logs
    environment:
      spring_datasource_url: ${SPRING_DATASOURCE_URL:-}
      spring_datasource_username: ${SPRING_DATASOURCE_USERNAME:-}
      spring_datasource_password: ${SPRING_DATASOURCE_PASSWORD:-}
      spring_datasource_driver_class_name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-}
      redis_host: ${REDIS_HOST:-}
      redis_password: ${REDIS_PASSWORD:-}
      redis_port: ${REDIS_PORT:-6379}
      cluster_node_list: ${REDIS_CLUSTER_NODES:-}
      redis_master_name: ${REDIS_SENTINEL_MASTER:-}
      redis_sentinel_ports: ${REDIS_SENTINEL_PORTS:-}
      obs_url: ${OBS_URL:-}
      obs_bucket: ${OBS_BUCKET:-}
      obs_staging_bucket: ${OBS_BUCKET:-}
      obs_ak: ${OBS_AK:-}
      obs_sk: ${OBS_SK:-}
      server_ssl_enabled: ${SERVER_SSL_ENABLED:-false}
      CB_CF_SERVER_KEYSTORE: ${CB_CF_SERVER_KEYSTORE:-}
      CB_CF_TRUST_KEYSTORE: ${CB_CF_TRUST_KEYSTORE:-}
      server_ssl_trust_store_password: ${SERVER_SSL_TRUST_STORE_PASSWORD:-}
      server_ssl_key_store_password: ${SERVER_SSL_KEY_STORE_PASSWORD:-}
      server_ssl_key_password: ${SERVER_SSL_KEY_PASSWORD:-}
      agent_runtime_endpoint: ${AGENT_RUNTIME_ENDPOINT:-http://studio-service:31113}
      user_auth_endpoint: ${USER_AUTH_ENDPOINT:-http://studio-manager:31111}
      jiu_wen_service_endpoint: ${JIUWEN_BASE_URL:-http://studio-runtime:31014}
      jiuwen_base_url: ${JIUWEN_BASE_URL:-http://studio-runtime:31014}
      front_page_block_nodes: ${FRONT_PAGE_BLOCK_NODES:-Sql,DataQuery,Agent}
      share_knowledge_enabled: ${SHARE_KNOWLEDGE_ENABLED:-true}
      workflow_async_enable: ${WORKFLOW_ASYNC_ENABLED:-true}
      # 知识库模式（可选，默认 LakeSearch 行为不变）：LakeSearch/CUSTOM
      knowledge_source: ${KNOWLEDGE_SOURCE:-LakeSearch}
      # LakeSearch 地址（可选，CUSTOM 模式必填，默认空）
      knowledge_lakeSearch_endpoint: ${KNOWLEDGE_LAKESEARCH_ENDPOINT:-}
      # LakeSearch 鉴权方式（可选，默认 basic；mock 无鉴权用 none）
      knowledge_lakeSearch_auth_mode: ${KNOWLEDGE_LAKESEARCH_AUTH_MODE:-basic}
      # SSO 鉴权验证地址，填写后启用 SSO 远程鉴权，留空则使用默认简单鉴权
      auth_sso_validate_url: ${AUTH_SSO_VALIDATE_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/31111'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - agent-net

  studio-service:
    logging: *default-logging
    image: ${STUDIO_SERVICE_IMAGE}
    pull_policy: ${APP_PULL_POLICY:-always}
    restart: always
    privileged: true
    cpus: 2
    mem_limit: 4g
    ports:
      - "${SERVICE_PORT:-31113}:31113"
    volumes:
      # 日志聚合：暴露 Java 日志供 Vector 采集（可选，见 ./deploy.sh logging）
      - service_logs:/opt/cloud/studio-service/logs
    environment:
      spring_datasource_url: ${SPRING_DATASOURCE_URL:-}
      spring_datasource_username: ${SPRING_DATASOURCE_USERNAME:-}
      spring_datasource_password: ${SPRING_DATASOURCE_PASSWORD:-}
      spring_datasource_driver_class_name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-}
      redis_host: ${REDIS_HOST:-}
      redis_password: ${REDIS_PASSWORD:-}
      redis_port: ${REDIS_PORT:-6379}
      cluster_node_list: ${REDIS_CLUSTER_NODES:-}
      redis_master_name: ${REDIS_SENTINEL_MASTER:-}
      redis_sentinel_ports: ${REDIS_SENTINEL_PORTS:-}
      obs_url: ${OBS_URL:-}
      obs_bucket: ${OBS_BUCKET:-}
      obs_staging_bucket: ${OBS_BUCKET:-}
      obs_ak: ${OBS_AK:-}
      obs_sk: ${OBS_SK:-}
      server_ssl_enabled: ${SERVER_SSL_ENABLED:-false}
      CB_CF_SERVER_KEYSTORE: ${CB_CF_SERVER_KEYSTORE:-}
      CB_CF_TRUST_KEYSTORE: ${CB_CF_TRUST_KEYSTORE:-}
      server_ssl_trust_store_password: ${SERVER_SSL_TRUST_STORE_PASSWORD:-}
      server_ssl_key_store_password: ${SERVER_SSL_KEY_STORE_PASSWORD:-}
      server_ssl_key_password: ${SERVER_SSL_KEY_PASSWORD:-}
      user_auth_endpoint: ${USER_AUTH_ENDPOINT:-http://studio-manager:31111}
      agent_manager_endpoint: ${AGENT_MANAGER_ENDPOINT:-http://studio-manager:31111}
      jiuwen_base_url: ${JIUWEN_BASE_URL:-http://studio-runtime:31014}
      koosearch_endpoint: ${KOOSEARCH_ENDPOINT:-}
      # SSO 鉴权验证地址，填写后启用 SSO 远程鉴权，留空则使用默认简单鉴权
      auth_sso_validate_url: ${AUTH_SSO_VALIDATE_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      studio-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/31113'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - agent-net

  studio-runtime:
    logging: *default-logging
    image: ${STUDIO_RUNTIME_IMAGE}
    pull_policy: ${APP_PULL_POLICY:-always}
    restart: always
    privileged: true
    cpus: 2
    mem_limit: 4g
    ports:
      - "${RUNTIME_PORT:-31014}:31014"
    volumes:
      # 日志聚合：暴露 Python/NGINX 日志供 Vector 采集（可选，见 ./deploy.sh logging）
      - runtime_logs:/opt/cloud/logs
    environment:
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_CLUSTER_NODES: ${REDIS_CLUSTER_NODES:-}
      REDIS_SENTINEL_MASTER: ${REDIS_SENTINEL_MASTER:-}
      REDIS_SENTINEL_NODES: ${REDIS_SENTINEL_NODES:-}
      REDIS_MODE: ${REDIS_MODE:-single}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      DATASOURCE_OBS_SERVER: ${OBS_URL:-}
      DATASOURCE_OBS_BUCKET: ${OBS_BUCKET:-}
      DATASOURCE_OBS_AK: ${OBS_AK:-}
      DATASOURCE_OBS_SK: ${OBS_SK:-}
      DATASOURCE_OBS_ENABLE_SSL: ${DATASOURCE_OBS_ENABLE_SSL:-false}
      MODEL_ROUTER_API: ${MODEL_ROUTER_API:-http://studio-service:31113/v1/agent-builder}
      HTTPS: ${SERVER_SSL_ENABLED:-false}
      HTTPS_CERT_FILE: ${HTTPS_CERT_FILE:-}
      HTTPS_KEY_FILE: ${HTTPS_KEY_FILE:-}
      TLS_CERT_KEY_PASSWD: ${TLS_CERT_KEY_PASSWD:-}
      TLS_CERT_KEY_PATH: /opt/cloud/agent-runtime/tls/key.pem
      TLS_CERT_PATH: /opt/cloud/agent-runtime/tls/cert.pem
      SECURITY_SANDBOX_SERVER: ${SECURITY_SANDBOX_SERVER:-}
      SECURITY_SANDBOX_SSL_VERIFY: ${SECURITY_SANDBOX_SSL_VERIFY:-false}
      SECURITY_SANDBOX_IDLE_TTL: ${SECURITY_SANDBOX_IDLE_TTL:-600}
      SECURITY_SANDBOX_TIMEOUT: ${SECURITY_SANDBOX_TIMEOUT:-300}
      SECURITY_SANDBOX_SCOPE: ${SECURITY_SANDBOX_SCOPE:-system}
      OPENSEARCH_HOSTS: ${OPENSEARCH_HOSTS:-}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-admin}
      OPENSEARCH_USE_SSL: ${OPENSEARCH_USE_SSL:-false}
      OPENSEARCH_SSL_VERIFY: ${OPENSEARCH_SSL_VERIFY:-false}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-false}
      LONG_TERM_MEMORY_ENABLE: ${LONG_TERM_MEMORY_ENABLE:-false}
      MEMORY_USER_PROFILE_ENABLE: ${MEMORY_USER_PROFILE_ENABLE:-false}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-bge-m3}
      MEMORY_EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-}
      MEMORY_EMBEDDING_API_KEY: ${MEMORY_EMBEDDING_API_KEY:-}
      MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-}
      MEMORY_LLM_BASE_URL: ${MEMORY_LLM_BASE_URL:-}
      MEMORY_LLM_API_KEY: ${MEMORY_LLM_API_KEY:-}
      MEMORY_DB_HOST: ${MEMORY_DB_HOST:-}
      MEMORY_DB_PORT: ${MEMORY_DB_PORT:-3306}
      MEMORY_DB_USER: ${MEMORY_DB_USER:-}
      MEMORY_DB_PASSWORD: ${MEMORY_DB_PASSWORD:-}
      MEMORY_DB_NAME: ${MEMORY_DB_NAME:-agent-memory}
      JIUWEN_LOG_FILE: /opt/cloud/logs/tgf_python.log
      JIUWEN_LOG_PATH: /opt/cloud/logs/jiuwen.log
      JIUWEN_LOGGING_LOG_FILE: /opt/cloud/logs/jiuwen_python.log
      LOGGING_LOG_PATH: /opt/cloud/logs/
      TGF_LOG_DIR: /opt/cloud/logs/
      PORT: ${SERVER_PORT:-31014}
      PLUGIN_SSL_API_CERT: ${PLUGIN_SSL_API_CERT:-false}
      WORKFLOW_EXECUTE_TIMEOUT: ${WORKFLOW_EXECUTE_TIMEOUT:-900}
      IR_LLM_API_KEY: ${IR_LLM_API_KEY:-sk-placeholder}
      DATASOURCE_OBS_PATH_STYLE: ${DATASOURCE_OBS_PATH_STYLE:-path}
      GUNICORN_WORK_NUM: ${GUNICORN_WORK_NUM:-}
      SECURITY_SANDBOX_TYPE: ${SECURITY_SANDBOX_TYPE:-jiuwenbox}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      # agent_builder 启动时会强制初始化关系库存储；代码读取的是 STORE_DB_*（非 STORE_MYSQL_*）
      STORE_DB_TYPE: ${STORE_DB_TYPE:-mysql}
      STORE_DB_HOST: ${STORE_DB_HOST:-mysql}
      STORE_DB_PORT: ${STORE_DB_PORT:-3306}
      STORE_DB_USER: ${SPRING_DATASOURCE_USERNAME:-root}
      STORE_DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-123456}
      STORE_DB_DATABASE: ${STORE_DB_DATABASE:-agent-builder}
      STORE_DB_SSLMODE: ${STORE_DB_SSLMODE:-disable}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      studio-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/31014'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - agent-net

  # ── 日志聚合栈（可选；profiles: logging，默认不启动；用 ./deploy.sh logging 启停）──
  # 数据流：app 日志命名卷 → Vector tail/缓冲 → VictoriaLogs 存储 → Grafana 查询
  # 四个 app 服务通过命名卷共享日志给 Vector。

  victoria-logs:
    logging: *default-logging
    image: ${VICTORIA_LOGS_IMAGE:-victoriametrics/victoria-logs:v1.50.0}
    pull_policy: ${MONITOR_PULL_POLICY:-if_not_present}
    restart: always
    profiles: ["logging"]
    command: -storageDataPath=/victoria-logs-data -retentionPeriod=${VICTORIA_LOGS_RETENTION:-7d} -retention.maxDiskSpaceUsageBytes=${VICTORIA_LOGS_MAX_DISK_USAGE_BYTES:-10737418240} -storage.minFreeDiskSpaceBytes=${VICTORIA_LOGS_MIN_FREE_DISK_BYTES:-2147483648}
    volumes:
      - victoria_logs_data:/victoria-logs-data
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9428/health 2>/dev/null | grep -q OK || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  vector:
    logging: *default-logging
    image: ${VECTOR_IMAGE:-timberio/vector:0.55.0-alpine}
    pull_policy: ${MONITOR_PULL_POLICY:-if_not_present}
    restart: always
    profiles: ["logging"]
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      NODE_NAME: ${NODE_NAME:-local}
      APP_LOG_TIMEZONE: ${APP_LOG_TIMEZONE:-Asia/Shanghai}
      APP_PROJECT_NAME: ${APP_PROJECT_NAME:-deploy}
    volumes:
      - ./config/vector.yaml:/etc/vector/vector.yaml:ro
      # 与各 app 服务共享同一命名卷（只读），tail 其中的日志文件
      - manager_logs:/logs/studio-manager:ro
      - service_logs:/logs/studio-service:ro
      - runtime_logs:/logs/studio-runtime:ro
      - console_logs:/logs/studio-console:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector_data:/var/lib/vector
    depends_on:
      victoria-logs:
        condition: service_healthy
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8686/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    logging: *default-logging
    image: ${GRAFANA_IMAGE:-grafana-victorialogs:11.3.0-0.29.0}
    pull_policy: ${MONITOR_PULL_POLICY:-if_not_present}
    restart: always
    profiles: ["logging"]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_PLUGINS_PLUGIN_ADMIN_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      # 启动时自动 provisioning VictoriaLogs 数据源和日志 dashboard
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/config/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      victoria-logs:
        condition: service_healthy
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null | grep -q '\"database\":.*\"ok\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
  minio_data:
  manager_logs:
  service_logs:
  runtime_logs:
  console_logs:
  victoria_logs_data:
  grafana_data:
  vector_data:

networks:
  agent-net:
    driver: bridge
