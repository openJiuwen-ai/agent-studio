  time-zone: GMT+8
  date-format: 'yyyy-MM-dd HH:mm:ss' # 启用时间戳后此配置失效，可保留/删除
  serialization:
    write-dates-as-timestamps: ${write_dates_as_timestamps:true}  # 将Date序列化为毫秒级时间戳
  default-property-inclusion: non_null
  fail-on-unknown-properties: false

workspace:
  role: '${workspace_role:[{"roleId":"ADMIN","roleNameCn":"空间管理员","roleNameEn":"Admin"},{"roleId":"OWNER","roleNameCn":"空间所有者","roleNameEn":"OWNER"},{"roleId":"DEVELOPER","roleNameCn":"开发工程师","roleNameEn":"DEVELOPER"},{"roleId":"OPERATOR","roleNameCn":"运维工程师","roleNameEn":"OPERATOR"}]}'

