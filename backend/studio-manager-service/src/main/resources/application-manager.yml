# ==========================================云服务私有配置项start=====================================
spring:
  # 是否开启软删除
  is-soft-delete: ${soft_delete:true}
  codec:
    max-in-memory-size: ${spring_codec_max_in_memory_size:128MB}
  servlet:
    multipart:
      max-file-size: ${spring_servlet_multipart_max_file_size:128MB}
      max-request-size: ${spring_servlet_multipart_max_request_size:128MB}
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${spring_datasource_url}
    username: ${spring_datasource_username}
    password: ${spring_datasource_password}
    driver-class-name: ${spring_datasource_driver_class_name:org.mariadb.jdbc.Driver}
  jpa:
    #    hibernate:
    #      ddl-auto: update
    show-sql: true
  sql:
    init:
      encoding: UTF-8
      schema-locations:
        - ${spring_sql_manager_ddl:classpath:sql/ddl.sql}
        - ${spring_sql_knowledge_ddl:classpath:sql/knowledge-base/ddl.sql}
      data-locations:
        - ${spring_sql_manager_dml:classpath:sql/dml.sql}
        - ${spring_sql_knowledge_dml:classpath:sql/knowledge-base/dml.sql}
      mode: ${spring_sql_init_mode:always}
      continue-on-error: true
  h2:
    console:
      enabled: false
  jackson:
    time-zone: GMT+8
    date-format: 'yyyy-MM-dd HH:mm:ss' # 启用时间戳后此配置失效，可保留/删除
    serialization:
      write-dates-as-timestamps: ${write_dates_as_timestamps:true}  # 将Date序列化为毫秒级时间戳
    default-property-inclusion: non_null
  # 线程池配置
  pools:
    asyncExecutor:
      corePoolSize: ${agent_settings_pools_asyncExecutor_corePoolSize:10}
      maxPoolSize: ${agent_settings_pools_asyncExecutor_maxPoolSize:100}
      queueCapacity: ${agent_settings_pools_asyncExecutor_queueCapacity:10}
      threadNamePrefix: asyncExecutor-
      keepAliveSeconds: ${agent_settings_pools_asyncExecutor_keepAliveSeconds:60}
  # quartz自动化配置
  quartz:
    job-store-type: jdbc
    properties:
      org:
        quartz:
          scheduler:
            instanceName: clusteredScheduler
            instanceId: AUTO
          jobStore:
            useProperties: false
            tablePrefix: QRTZ_
            isClustered: true
            clusterCheckinInterval: ${org_quartz_jobStore_clusterCheckinInterval:1800000}
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            driverDelegateClass: ${org_quartz_jobStore_driverDelegateClass:org.quartz.impl.jdbcjobstore.StdJDBCDelegate}
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 20
            threadPriority: 5
            threadsInheritContextClassLoaderOfInitializingThread: true
    overwrite-existing-jobs: true
  application:
    name: ${application_name:manage}
  data:
    redis:
      database: '0'
      host: ${redis_host:127.0.0.1}
      port: ${redis_port:6379}
      password: ${redis_password:}
  http-client:
    pool:
      #连接池的最大连接数，0代表不限；如果取0，需要考虑连接泄露导致系统崩溃的后果
      maxTotalConnect: 2000
      #每个路由的最大连接数,如果只调用一个地址,可以将其设置为最大连接数
      maxConnectPerRoute: 1000
      # 指客户端和服务器建立连接的超时时间,ms , 最大约21秒,因为内部tcp在进行三次握手建立连接时,默认tcp超时时间是20秒
      connectTimeout: 5000
      # 指客户端从服务器读取数据包的间隔超时时间,不是总读取时间,也就是socket timeout,ms
      readTimeout: 50000
      # 从连接池获取连接的timeout,不宜过大,ms
      connectionRequestTimout: 200
      # 重试次数
      retryTimes: 3
      # 编码格式
      charset: UTF-8
      # 长连接保持时间 单位s,不宜过长
      keepAliveTime: 10
  cloud:
    openfeign:
      client:
        config:
          agentRuntime:
            url: ${agent_runtime_endpoint:http://127.0.0.1:31014}
            connectTimeout: ${feign.agentRuntime.connectTimeout:10000}
            readTimeout: ${feign.agentRuntime.readTimeout:120000}

# 审计日志配置
studio:
  operationLog:
    switch: ${studio_operationLog_switch:false}
    # 审计日志参数敏感字段名正则，命中后对字段值做掩码处理
    sensitiveFieldPattern: '${studio_operationLog_sensitiveFieldPattern:(?i)(?:.*(?:password|pwd|token|authorization|api[-_]?key|secret|credential|auth[-_]?(?:info|key|id|value|type|keys)|access[-_]?key|client[-_]?secret|iam[-_]?credentials|oauth[-_]?scope|app[-_]?code|iam[-_]?(?:ak|sk)).*|(?:ak|sk))}'

server:
  port: 31111
  address: 0.0.0.0
  max-http-request-header-size: 100KB
  ssl:
    client-auth: none
    protocol: TLS
    # 支持TLS1.3的java版本，可以配置为：TLSv1.3,TLSv1.2
    enabled-protocols: TLSv1.2
    # 默认配置支持的算法为安全推荐的算法
    # 支持TLS1.3的java版本，可以配置为：TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    ciphers: TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    key-password: ${server_ssl_key_password}
    key-store: ${APP_PATH:/opt/cloud/studio-manager}/ssl/server.keystore
    key-store-password: ${server_ssl_key_store_password}
    key-store-type: jks
    trust-store: ${APP_PATH:/opt/cloud/studio-manager}/ssl/trust.keystore
    trust-store-password: ${server_ssl_trust_store_password}
    trust-store-type: JKS
    # 是否开启ssl
    enabled: ${server_ssl_enabled:false}
  tomcat:
    max-http-response-header-size: 16KB

mybatis:
  mapper-locations:
