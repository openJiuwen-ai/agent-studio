      description: 获取应用百宝箱列表。
      operationId: ListApps
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目ID。
          pattern: ^[a-zA-Z0-9_-]+$
        - name: offset
          in: query
          required: false
          type: integer
          format: int32
          default: 0
          minimum: 0
          maximum: 10000
          description: 分页记录的起始位置偏移量，默认值0。
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
          default: 5
          minimum: 1
          maximum: 1000
        - name: name
          in: query
          required: false
          type: string
          maxLength: 64
          description: 名称。
        - name: tag_id
          in: query
          required: false
          type: string
          maxLength: 64
          description: 标签ID。
        - name: source
          in: query
          required: false
          type: string
          enum:
            - all
            - workflow
            - agent
            - controller
          description: 来源。
        - name: type
          in: query
          required: false
          type: string
          enum:
            - scene
            - chat
          description: 场景型和对话型。
        - name: workflow_type
          in: query
          required: false
          type: string
          description: 工作流类型。
          enum:
            - chat
            - task
        - name: selected
          in: query
          required: false
          type: boolean
          default: false
          description: 精选体验。
      responses:
        '200':
          description: 搜索的应用列表。
          schema:
            $ref: '#/definitions/AppListRsp'
        '400':
          description: 请求错误。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-iam-auth-meta-anno:
        abacAction: ''
        authLevel: PROJECT
        needAbacCheck: false
        needRbacCheck: false
        needCbcCheck: false
