          description: 版本号，空：查询所有（草稿+发布）；时间戳：查询已发布；latest：查询草稿。
          type: string
          maxLength: 64
        - name: app_id
          in: path
          required: true
          type: string
          maxLength: 64
        - name: showlatest
          in: query
          required: false
          description: 是否返回资源最新版本。
          type: boolean
        - name: resourceType
          in: query
          required: false
          description: 资源类型。
          type: string
          maxLength: 20
        - name: nestedCheck
          in: query
          required: false
          description: 是否检查嵌套层级。
          type: boolean
          default: false
        - name: workspace_id
          in: query
          required: true
          type: string
          description: 项目空间ID。
          pattern: ^[a-zA-Z0-9_()\-]+$
          maxLength: 64
          minLength: 1
      responses:
        '200':
          description: 关联关系列表。
          schema:
            $ref: '#/definitions/RelationList'
        '400':
          description: 请求错误。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '401':
          description: 鉴权失败。
          schema:
            type: string
        '403':
          description: 没有操作权限。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '404':
          description: 找不到资源。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
        '500':
          description: 服务内部错误。
          schema:
            $ref: 'AgentStudio-Manager-API.yaml#/definitions/ErrorRsp'
      x-order: 0
      x-iam-auth-meta-anno:
        abacAction: ''
        authLevel: PROJECT
        needAbacCheck: false
        needRbacCheck: false
        needCbcCheck: false
        model: v3
definitions:
  ErrorRsp:
    type: object
    description: 完整错误信息。
    properties:
      error_code:
        type: string
        description: 错误码。
      error_msg:
        type: string
        description: 错误信息。
      details:
        type: array
        items:
          $ref: '#/definitions/ErrorDetail'
        description: 调用接口返回的错误信息。
      error_reason:
        type: string
        description: 错误原因。
      error_suggestion:
        type: string
        description: 错误建议。
  ErrorDetail:
    type: object
    description: 错误信息。
    properties:
      error_code:
        type: string
        description: 错误码。
      error_msg:
        type: string
        description: 错误信息。
  CommonDeleteRsp:
    type: object
    properties:
      id:
        type: string
        description: 删除对象ID。
      version_id:
        type: string
        description: 删除对象版本ID。
  SearchCriteria:
    type: object
    properties:
      workspace_id:
        type: string
        description: 空间ID。
        pattern: ^[a-zA-Z0-9_-]+$
        maxLength: 64
      id:
        type: string
        description: ID。
        pattern: ^[a-zA-Z0-9_-]+$
        maxLength: 64
      ids:
        type: array
        description: ID列表。
        maxItems: 100
        items:
          type: string
      name:
        type: string
        description: 名称。
        maxLength: 64
      call_mode:
        description: 插件调用类型。
        type: string
        maxLength: 64
      tool_chinese_name:
        type: string
        description: 中文名称。
        maxLength: 64
      tool_desc:
        type: string
        description: 工具的描述，尽可能的准确简短描述工具的用途。该描述直接影响大模型对工具使用的判断，尽量描述清楚，如果Assistant实际执行效果不符合预期，可以调整。
        maxLength: 64
      creator:
        type: string
        description: 创建者。
        maxLength: 256
      type:
        type: string
        description: 类型。
        maxLength: 64
      sub_type:
        type: string
        description: 子类型。
        maxLength: 64
      intf_type:
        type: string
        description: 接口类型。
        maxLength: 64
      tag_id:
        type: string
        description: 标签ID。
        maxLength: 256
      user_id:
        type: string
        description: 用户ID。
        maxLength: 256
      source:
        type: string
        description: 知识库来源。
        maxLength: 64
      exclude_ids:
        type: array
        maxItems: 100
        items:
          type: string
        description: 排除的ID列表。
      workflow_type:
        type: string
        description: 工作流类型。
        maxLength: 16
      published:
        type: boolean
        description: 是否已发布。
      customize_node:
        type: boolean
        description: 是否是自定义节点。
      status:
        type: string
        description: 状态。
        maxLength: 64
      description:
        type: string
        description: 描述。
        maxLength: 1000
      label:
        type: string
        description: 描述。
        maxLength: 32
      category:
        type: string
        description: 类别
  AppInfo:
    type: object
    description: 应用的相关信息。
    properties:
      app_id:
        type: string
        description: 应用唯一标识。
      project_id:
        type: string
        description: 租户唯一标识。
      name:
        type: string
        description: 应用名称。
        readOnly: true
      description:
        type: string
        description: 应用描述。
        readOnly: true
      icon:
        type: string
        description: 应用图标。
      tags:
        type: array
        items:
          type: string
        description: 应用标签列表，长度不超过3。
      app_type:
        type: string
        description: 应用类型，分为对话型和场景型。
      resource_id:
        type: string
        description: 应用来源标识。
      workflow_type:
        type: string
        description: 工作流类型。
      resource_type:
        type: string
        description: 应用来源类型，分为agent和workflow。
      creator:
        type: string
        description: 应用创建者。
      publish_time:
        type: string
        format: date-time
        description: 应用发布时间。
      free_trial_quota:
        description: "应用免费试用额度试用情况"
        $ref: 'AgentStudio-Workflow-API.yaml#/definitions/FreeTrialQuota'
  AppListRsp:
    type: object
    description: App列表响应体。
    properties:
      count:
        type: integer
        format: int64
        description: 应用总数。
      app_list:
        type: array
        items:
          $ref: '#/definitions/AppInfo'
        description: 应用列表。
  TagInfo:
    type: object
    description: 标签的相关信息。
    properties:
      tag_id:
        type: string
        description: 标签唯一标识。
      name:
        type: string
        description: 标签名称。
        readOnly: true
      name_en:
        type: string
        description: 标签英文名称。
        readOnly: true
  VoiceInteraction:
    type: object
    description: 语音交互配置。
    properties:
      language:
        type: string
        description: 语种。
      timbre:
        type: string
        description: 人员标识。
      domain:
        type: string
        description: 领域。
  Status:
    type: object
    required:
      - code
      - desc
    properties:
      code:
        type: integer
        description: 错误码。
      desc:
        type: string
        maxLength: 1024
        description: 错误描述信息。
  Message:
    type: object
    required:
      - content
    properties:
      role:
        type: string
        minLength: 1
        maxLength: 64
        description: 角色。
      content:
        type: string
        minLength: 1
        description: 内容。
  NodeRunInfo:
    type: object
    properties:
      agent_id:
        type: string
        maxLength: 128
        description: 工作流ID。
      node_id:
        type: string
        maxLength: 128
        description: 节点ID。
      parent_node_id:
        type: string
        maxLength: 128
        description: 父节点ID。
      node_status:
        type: string
        description: 工作流节点状态。
        enum:
          - node_started
          - node_wait
          - node_finished
      parent_workflow_id:
        type: string
        maxLength: 128
        description: 父工作流节点ID。
      loop_index:
        type: integer
        description: 循环次数。
      loop_node_id:
        type: string
        maxLength: 128
        description: 上层循环节点ID。
      status:
        $ref: '#/definitions/Status'
        description: 工作流运行状态。
      node_name:
        type: string
        maxLength: 128
        description: 节点名称。
      node_type:
        type: string
        maxLength: 32
        description: 节点类型。
      error_message:
        type: string
        maxLength: 4096
        description: 错误信息。
      inputs:
        type: object
        description: 输入参数：debug才设置。
        additionalProperties:
          type: object
      outputs:
        type: object
        description: 输出参数：debug才设置。
        additionalProperties:
          type: object
      messages:
        type: array
        items:
          $ref: '#/definitions/Message'
        description: 消息节点或提问器节点的输出。
      metadata:
        type: object
        additionalProperties:
          type: object
        description: 节点特有的输出，如：大模型原始回复debug才设置。
      start_time:
        type: integer
        format: int64
        description: 开始时间，13位时间戳 workflow_started，node_started必填。
      end_time:
        type: integer
        format: int64
        description: 结束时间，13位时间戳 workflow_finished，node_finished必填。
      startup_time:
        type: integer
        format: int64
        description: 真正启动的时间，13位时间戳。
      prefill_time:
        type: integer
        format: int64
        description: 预热时间，如大模型节点表示首token时间。
      execution_id:
        type: string
        maxLength: 128
        description: execution ID。
      inner_error:
        type: object
        properties:
          is_success:
            type: boolean
            description: 是否成功。
          error_body:
            type: object
            properties:
              error_code:
                type: string
                description: 错误码。
              error_message:
                type: string
                description: 错误信息。
      memory:
        type: object
        description: 记忆变量。
        additionalProperties:
          type: object
  WorkflowRunReq:
    type: object
    properties:
      inputs:
        type: object
        additionalProperties:
          type: object
      globals:
        type: object
        additionalProperties:
          type: object
      environment:
        type: object
        $ref: '#/definitions/WorkflowEnvironment'
      messages:
        type: array
        items:
          $ref: '#/definitions/Message'
        description: user消息。
  WorkflowVO:
    type: object
    description: 工作流和前端交互对象定义。
    required:
      - id
      - name
      - nodes
    properties:
      id:
        type: string
        description: 工作流ID。
      name:
        type: string
        description: 工作流名称。
      description:
        type: string
        description: 工作流描述。
      icon:
        type: string
        description: 图标。
      nodes:
        type: array
        items:
          $ref: '#/definitions/WorkflowNodeVO'
        description: 工作流节点列表。
      edges:
        type: array
        items:
          $ref: '#/definitions/WorkflowEdgeVO'
        description: 工作流连线。
      layouts:
        type: object
        description: "位置信息\n{\n\t\"node_start\": {\n\t\t\"x\": 70,\n\t\t\"y\": 180\n\t},\n\t\"node_end\": {\n\t\t\"x\": 1690,\n\t\t\"y\": 190\n\t}\n}。"
        additionalProperties:
          example:
            node_start:
              x: 70
              'y': 180
            node_end:
              x: 1690
              'y': 190
          type: object
      configs:
        type: object
        description: 工作流全局配置。
        additionalProperties:
          type: object
      comments:
        type: array
        description: 工作流级别的通用注释列表
        items:
          type: object
          description: 注释对象
  WorkflowNodeVO:
    type: object
    description: 工作流节点定义。
    required:
      - id
      - name
      - type
    properties:
      id:
        type: string
        description: 节点ID。
      name:
        type: string
        description: 节点名称。
      type:
        type: string
        description: 节点类型。
      inputs:
        type: array
        items:
          $ref: '#/definitions/WorkflowFieldVO'
        description: 节点输入配置。
      outputs:
        type: array
        items:
          $ref: '#/definitions/WorkflowFieldVO'
        description: 节点输出配置。
      configs:
        type: object
        additionalProperties:
          required:
            - name
          type: object
        description: 节点定制扩展信息。
      branches:
        type: array
        items:
          $ref: '#/definitions/WorkflowBranchVO'
        description: 节点分支信息。
  WorkflowEdgeVO:
    type: object
    description: 工作流连线。
    required:
      - source
      - target
    properties:
      id:
        type: string
        description: 连线ID，格式$source_$branch_$target。
      source:
        type: string
        description: 原节点ID。
      exception_branch:
        type: boolean
        description: 是否为异常分支。
        default: false
      target:
        type: string
        description: 目标节点ID。
      branch:
        type: string
        description: 分支ID，有分支时有值。
      sourceBranchId:
        type: string
        description: 开始并行分支标识。
        example: 165599a2-2d49-4dee-af64-588ab7068d20
      targetBranchId:
        type: string
        description: 结束并行分支标识。
        example: 165599a2-2d49-4dee-af64-588ab7068d20
  WorkflowFieldVO:
    type: object
    description: 工作流通用字段定义，用于inputs，outputs，condition。
    required:
      - name
      - type
    properties:
      name:
        type: string
        description: 字段名。
      cn_name:
        type: string
        description: 中文名称。
      type:
        type: string
        description: 字段数据类型。
      description:
        type: string
        description: 字段描述。
      required:
        type: boolean
        description: 是否必填。
      source:
        type: string
        default: user
        description: 字段数据来源。
        enum:
          - system
          - environment
          - user
          - pre_defined
          - request
      schema:
        type: object
        description: 字段schema。
      aging_level:
        type: string
        description: 记忆变量时长。
      storage_method:
        type: string
        description: 记忆变量存储方式。
      field_type:
        type: string
        description: 字段输入框类型。
      reflection:
        type: boolean
        description: 为每个参数增加是否进行反思的开关，默认关闭。
        default: false
      value:
        type: object
        description: 字段取值。
        properties:
          type:
            type: string
            description: 取值类型。
            enum:
              - generated
              - ref
              - literal
              - nested
          content:
            type: object
            description: "取值结构如下：\ntype：generated， content=null\ntype：ref ，content为对象\n\tref_node_ID：引用节点\n\tref_var_name：引用变量名\ntype：literal，content为字符。"
          operator:
            type: string
            description: 运算符类型：increment-递增，decrement-递减，empty-null，empty_str-空字符，empty_arr-空列表。
            enum:
              - increment
              - decrement
              - empty
              - empty_str
              - empty_arr
          hint:
            type: string
            description: 字段值提示。
          default:
            type: object
            description: 默认值。
          display:
            type: object
            description: 前端显示值。
      validator:
        type: array
        items:
          properties:
            type:
              type: string
              description: 校验器类型。
            params:
              type: array
              items:
                type: string
              description: 校验器参数。
        description: 校验器列表。
      memory:
        type: array
        description: 字段相关的内存信息或状态。
        items:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              description: 记忆变量名称。
            aging_level:
              type: string
              description: 记忆变量时长。
            storage_method:
              type: string
              description: 记忆变量存储方式。
            default_value:
              type: object
              description: 记忆变量的默认值。
            description:
              type: string
              description: 记忆变量的描述。
            value:
              type: object
              description: 字段取值。
              properties:
                type:
                  type: string
                  description: 取值类型。
                  enum:
                    - generated
                    - ref
                    - literal
                    - nested
                content:
                  type: object
                  description: "取值结构如下：\ntype：generated， content=null\ntype：ref ，content为对象\n\tref_node_ID：引用节点\n\tref_var_name：引用变量名\ntype：literal，content为字符。"
                operator:
                  type: string
                  description: 运算符类型：increment-递增，decrement-递减，empty-null，empty_str-空字符，empty_arr-空列表。
                  enum:
                    - increment
                    - decrement
                    - empty
                    - empty_str
                    - empty_arr
                hint:
                  type: string
                  description: 字段值提示。
                default:
                  type: object
                  description: 默认值。
                display:
                  type: object
                  description: 前端显示值。
  WorkflowBranchVO:
    type: object
    description: 工作流节点分支对象，任何会出现分叉的节点使用该象承载分支信息。
    properties:
      id:
        type: string
        description: 分支对应ID，和连线上的branch字段对应。
      configs:
        type: object
        additionalProperties:
          type: object
        description: "用于承载分支的其他信息，比如分支节点的条件信息使用WorkflowBranchConfigVO\n样例：\n{\n\t\"logic\": \"and\",\n\t\"conditions\": [\n\t\t{\n\t\t\t\"operator\": \"eq\",\n\t\t\t\"left\": {\n\t\t\t\t\"name\": \"\",\n\t\t\t\t\"type\": \"string\",\n\t\t\t\t\"desc\": \"\",\n\t\t\t\t\"required\": false,\n\t\t\t\t\"value\": {\n\t\t\t\t\t\"type\": \"ref\",\n\t\t\t\t\t\"content\": {\n\t\t\t\t\t\t\"ref_node_ID\": \"system\",\n\t\t\t\t\t\t\"ref_var_name\": \"rawQuery\"\n\t\t\t\t\t}\n\t\t\t\t},\n\t\t\t\t\"schema\": null\n\t\t\t},\n\t\t\t\"right\": {\n\t\t\t\t\"name\": \"\",\n\t\t\t\t\"type\": \"string\",\n\t\t\t\t\"desc\": \"\",\n\t\t\t\t\"schema\": null,\n\t\t\t\t\"required\": false,\n\t\t\t\t\"value\": {\n\t\t\t\t\t\"type\": \"literal\",\n\t\t\t\t\t\"content\": \"11\"\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t]\n}。"
  WorkflowBranchConfigVO:
    type: object
    description: 分支节点config对象。
    required:
      - logic
    properties:
      logic:
        type: string
        description: 逻辑操作符。
        enum:
          - and
          - or
      conditions:
        type: array
        items:
          type: object
          properties:
            operator:
              type: string
              description: 操作符。
            left:
              description: 左值。
              $ref: '#/definitions/WorkflowFieldVO'
            right:
              description: 右值。
              $ref: '#/definitions/WorkflowFieldVO'
  WorkflowConfigVO:
    type: object
    description: 工作流节点扩展字段。
    required:
      - name
    properties:
      name:
        type: string
        description: 字段名。
      value:
        type: object
        description: 字段取值。
  WorkflowValidationVO:
    type: object
    properties:
      success:
        type: boolean
        description: 校验结果。
      errors:
        type: array
        description: 错误信息。
        items:
          type: object
          properties:
            id:
              type: string
              description: 节点ID。
            type:
              type: string
              description: 节点类型。
            reason:
              type: string
              description: 错误原因。
  WorkflowRunRsp:
    type: object
    description: 工作流执行接口响应体。
    required:
      - outputs
      - start_time
      - node_info
    properties:
      session_id:
        type: string
        description: 消息所属session唯一标识。
      outputs:
        type: object
        additionalProperties:
          type: object
        description: 输出，支持多个参数。
      error_message:
        type: string
        maxLength: 4096
        description: 错误信息。
      metadata:
        type: object
        additionalProperties:
          type: object
        description: 工作流扩展信息。
      status:
        $ref: '#/definitions/Status'
        description: 工作流运行状态。
      start_time:
        type: integer
        format: int64
        description: 开始时间，13位时间戳 workflow_started，node_started必填。
      end_time:
        type: integer
        format: int64
        description: 结束时间，13位时间戳 workflow_finished，node_finished必填。
      node_info:
        type: array
        items:
          $ref: '#/definitions/NodeRunInfo'
        description: 节点信息(开debug显示节点详细信息包括输入输出，关debug只提供基础信息：状态，时延)。
  AuthInfo:
    type: object
    description: 工具鉴权信息。
    properties:
      scope:
        type: string
        example: USER
        description: 工具鉴权方式，分为用户级、服务级和IAM方式。
        maxLength: 8
        minLength: 1
        enum:
          - USER
          - SERVICE
          - IAM
      domain:
        type: string
        description: 工具鉴权秘钥位置。
        example: HEADERS
        minLength: 1
        maxLength: 64
        enum:
          - HEADERS
          - QUERY
      auth_keys:
        type: array
        description: 工具鉴权秘钥列表。
        minItems: 1
        maxItems: 5
        items:
          $ref: '#/definitions/AuthKeyInfo'
      iam_credentials:
        type: object
        additionalProperties:
