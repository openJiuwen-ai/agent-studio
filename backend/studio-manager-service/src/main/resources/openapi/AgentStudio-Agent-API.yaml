                - length_limit_validate-提问器长度校验
                - enum_legality_validate-提问器枚举校验
                - date_time_format-提问器日期校验
                - common_data_format_check-通用格式校验
            params:
              type: array
              items:
                type: string
              description: 校验器参数。
        description: 校验器列表。
      memory:
        type: array
        description: 字段相关的内存信息。
        items:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              description: 记忆变量名称。
            aging_level:
              type: string
              description: 记忆变量时长。
            storage_method:
              type: string
              description: 记忆变量存储方式。
            default_value:
              type: object
              description: 记忆变量的默认值。。
            description:
              type: string
              description: 记忆变量的描述。
            value:
              description: 字段取值。
              $ref: '#/definitions/WorkflowFieldVOValue'
