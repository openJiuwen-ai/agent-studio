  WorkflowFieldVO:
    type: object
    description: 工作流通用字段定义，用于inputs,outputs,condition。
    required:
      - name
      - type
    properties:
      name:
        type: string
        description: 字段名。
      cn_name:
        type: string
        description: 中文名称。
      type:
        type: string
        description: |-
          字段数据类型：
          - integer-整型
          - number-浮点型
          - string-字符串型
          - array-列表类型
          - boolean-布尔类型
          - object-对象类型
          - time-时间类型
          - file-文件类型。
      description:
        type: string
        description: 字段描述。
      required:
        type: boolean
        description: 是否必填。
      source:
        type: string
        default: user
        description: 字段数据来源。
        enum:
          - system
          - environment
          - user
          - pre_defined
          - request
      schema:
        type: object
        description: 字段Schema。
      aging_level:
        type: string
        description: 记忆变量时长。
      storage_method:
        type: string
        description: 记忆变量存储方式。
      field_type:
        type: string
        description: 字段输入框类型，input-字符串类型，object-对象类型。
      reflection:
        type: boolean
        description: 为每个参数增加是否进行反思的开关，默认关闭。
        default: false
      value:
        description: 字段取值。
        $ref: '#/definitions/WorkflowFieldVOValue'
      validator:
        type: array
        items:
          properties:
            type:
              type: string
              description: |-
