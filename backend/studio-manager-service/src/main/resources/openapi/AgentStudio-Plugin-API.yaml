definitions:
  BaseResp:
    type: object
    properties:
      code:
        type: integer
      message:
        type: string
      data:
        type: object
  ExportParams:
    type: object
    description: 导出相关参数
    required:
      - is_append
    properties:
      tool_ids:
        type: array
        items:
          type: string
        description: 工具id
      agent_ids:
        type: array
        items:
          type: string
        description: agent id
      workflow_ids:
        type: array
        items:
          type: string
        description: 工作流id
      agents:
        type: array
        items:
          $ref: '#/definitions/ExportAgent'
      workflows:
        type: array
        items:
          $ref: '#/definitions/ExportWorkflow'
  ImportRsp:
    type: object
    description: 导入插件响应体
    properties:
      succeed_len:
        type: integer
        format: int32
        description: 导入成功的数量
        default: 0
      count:
        type: integer
        format: int32
        description: 导入成功的数量
        default: 0
      succeed_ids:
        type: array
        items:
          type: string
        description: 导入成功的id
      failed_len:
        type: integer
        format: int32
        description: 导入失败的数量
        default: 0
      failed_ids:
        type: array
        items:
          type: string
        description: 导入失败的id
      inner_plugins_msg:
        type: array
        items:
          $ref: '#/definitions/ExtraMsg'
        description: 需要手动添加的预制插件信息
      auth_plugins_msg:
        type: array
        items:
          $ref: '#/definitions/ExtraMsg'
        description: 需要手动进行鉴权配置的插件信息
      auth_mcps_msg:
        type: array
        items:
          $ref: '#/definitions/ExtraMsg'
        description: 需要手动进行鉴权配置的mcp信息
      import_list:
        type: array
        items:
          $ref: '#/definitions/ImportRes'
        description: 导入列表
  ExtraMsg:
    type: object
    properties:
      id:
        type: string
        maxLength: 64
        description: id
      name:
        type: string
        maxLength: 64
        description: 名称
  ParsePluginReq:
    type: object
    properties:
      content:
        type: string
        description: 插件api定义的的字符串
  BatchCreatePluginToolReq:
    type:  object
    description: 批量创建工具请求体
    required:
      - tools
    properties:
      tools:
        type: array
        description: 工具列表，支持批量创建多个工具
        minItems: 1
        maxItems: 100  # 可根据业务限制最大数量
        items:
          $ref: '#/definitions/CreatePluginToolReq'
  CreatePluginToolReq:
    type: object
    description: 创建工具请求体
    required:
      - tool_display_name
      - tool_chinese_name
    properties:
      plugin_id:
        type: string
        description: 归属的插件id
        example: 预定会议室工具归属的插件
        pattern: ^[a-zA-Z0-9_-]+$
        maxLength: 64
      tool_display_name:
        type: string
        description: 工具展示名称
        example: 预定会议室工具
        maxLength: 64
        minLength: 1
      tool_chinese_name:
        type: string
        description: 工具展示中文名称
        example: 预定会议室工具
        maxLength: 64
        minLength: 1
      tool_desc:
        type: string
        example: 预定会议室，请在需要预定会议室时调用此工具，预定前需要先查询会议室状态
        description: 工具的描述，尽可能的准确简短描述工具的用途。该描述直接影响大模型对工具使用的判断，尽量描述清楚，如果Assistant实际执行效果不符合预期，可以调整。
        maxLength: 600
        minLength: 1
      call_mode:
        type: string
        description: 插件执行类型：pi：api类型的插件；functiongraph：函数类型的插件
      icon:
        type: string
        description: 图标
      request_info:
        description: 工具请求信息，包含URL、Method、Headers、Path参数信息
        $ref: '#/definitions/RequestInfo'
      auth_info:
        description: 工具鉴权信息，无需鉴权、用户级鉴权、服务级鉴权
        $ref: '#/definitions/AuthInfo'
      visibility:
        type: string
        description: 可见范围
        maxLength: 32
      intf_type:
        type: string
        description: 接口类型
      input_schema:
        type: string
        example: '{''type'':''object'',''properties'':{''start'':{''type'':''string'',''description'':''会议开始时间，格式为yyyy-MM-dd HH:mm''},''end'':{''type'':''string'',''description'':''会议结束时间，格式为yyyy-MM-dd HH:mm''},''meetingRoom'':{''type'':''string'',''description'':''会议室''}},''required'':[''start'',''end'',''meetingRoom'']}'
        description: 工具入参的JsonSchema
        maxLength: 200000
      is_input_list:
        type: boolean
        description: 入参是否要封装到数组中
        default: false
      output_schema:
        type: string
        example: '{''type'':''object'',''properties'':{''result'':{''type'':''string'',''description'':''预定会议室的结果''}}}'
        description: 工具出参的JsonSchema
        maxLength: 200000
      is_output_list:
        type: boolean
        description: 出参是否要封装到数组中
        default: false
      metadata:
        type: string
        description: 扩展参数。
        example: ''
        maxLength: 4096
      auth_required:
        type: boolean
        description: 是否需要鉴权
        default: false
      test_status:
        type: string
        description: 测试状态：SUCCESS、FAILED、UNKNOWN
        example: SUCCESS
  BatchCreatePluginToolRsp:
    type: object
    description: 批量创建工具响应
    required:
      - ids
      - count
    properties:
      ids:
        type: array
        description: 工具创建ID
        items:
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
          maxLength: 64
        minItems: 0
      count:
        type: integer
        description: 成功创建的工具数量
        minimum: 0
  CreatePluginToolRsp:
    type: object
    description: 创建工具响应
    required:
      - tool_id
    properties:
      tool_id:
        type: string
        example: reserve_meeting_room
        description: 工具ID
        pattern: ^[a-zA-Z0-9_-]+$
        maxLength: 64
  ActionBaseInfo:
