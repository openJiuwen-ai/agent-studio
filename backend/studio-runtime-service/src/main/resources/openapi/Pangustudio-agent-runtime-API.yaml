swagger: '2.0'
info:
  version: v1
  title: agent manager API
  description: agent manager API
schemes:
  - https
host: localhost.com
basePath: /
tags:
  - name: ConversationManagement
    description: 会话管理
  - name: KnowledgeRagSearch
    description: 知识库检索
  - name: AgentRuntime
    description: Agent运行态
  - name: WorkflowRuntime
    description: workflow运行态
  - name: AnalyticsEvent
    description: 增加分析事件
  - name: ToolRuntime
    description: 插件运行态
  - name: McpServerRuntime
    description: Mcp 服务运行态
  - name: IamTokenResolver
    description: 用于解析IAM token，主要用于认证
  - name: TaskManagement
    description: 工作流异步任务
  - name: AgentMemoryManagement
    description: Agent的运行态记忆管理
  - name: AgentVariable
    description: Agent会话变量管理
  - name: ResourcesCleaner
    description: 资源清理服务
paths:
  /v1/{project_id}/workflows/{workflow_id}/conversations/{conversation_id}:
    post:
      tags:
        - WorkflowRuntime
      summary: run workflow applications
      operationId: RunWorkflow
      description: 运行场景化应用接口
      parameters:
        - name: project_id
          in: path
          description: 租户项目id
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_()-]+$'
            maxLength: 64
        - name: workflow_id
          in: path
          description: workflow id
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_()-]+$'
            maxLength: 64
        - name: conversation_id
          in: path
          description: conversation id
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_()-]+$'
            maxLength: 64
        - name: workspace_id
          in: query
          description: 空间id
          required: false
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_()-]+$'
            maxLength: 64
        - name: environment_id
          in: query
          description: 环境id
          required: false
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_()-]+$'
            maxLength: 64
        - name: version
          in: query
          description: 版本
          required: false
          schema:
            type: string
        - name: stream
          in: header
          description: 是否流式返回
          required: false
          schema:
            type: boolean
        - name: workflow_run_req
          in: body
          description: 执行工作流会话请求体
          required: false
          schema:
            $ref: '#/definitions/WorkflowRunReq'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/CommonRsp'
        '400':
          description: Error response
          schema:
          $ref: '#/definitions/ErrorRsp'
  /v1/{project_id}/agents/{agent_id}/conversations/{conversation_id}:
    post:
      tags:
        - AgentRuntime
      summary: run agent
      operationId: RunAgent
      description: 运行知识型Agent
      parameters:
        - name: project_id
          in: path
          description: 项目id
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]+$'
            maxLength: 64
        - name: agent_id
          in: path
          description: agent id
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_()-]+$'
            maxLength: 64
        - name: conversation_id
          in: path
          description: conversation id
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]+$'
            maxLength: 64
        - name: workspace_id
          in: query
          description: 空间id
          required: false
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_()-]+$'
            maxLength: 64
        - name: agent_type
          in: query
          description: Agent类型
          required: false
          schema:
            type: string
        - name: version
          in: query
          description: 发布版本号
          required: false
          schema:
            type: string
        - name: X-Invoke-Mode
          in: header
          description: 调用模式
          required: false
          schema:
            type: string
        - name: type
          in: query
          description: 类型
          required: false
          schema:
            type: string
        - name: stream
          in: header
          description: 是否流式返回
          required: false
          schema:
            type: boolean
        - name: X-Invoke-Source
          in: header
          description: 调用来源
          required: false
          schema:
            type: string
        - name: X-Execution-Id
          in: header
          description: 执行ID
          required: false
          schema:
            type: string
      requestBody:
        required: true
        schema:
          $ref: '#/definitions/AgentRunReq'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/CommonRsp'
        '400':
          description: Error response
          schema:
            $ref: '#/definitions/ErrorRsp'
  /v1/{project_id}/agents/{agent_id}/conversations/{conversation_id}/variables:
    get:
      tags:
        - AgentVariable
      description: 获取资源全局变量
      operationId: getAgentVariable
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: agent_id
          in: path
          required: true
          type: string
          description: 资源ID
        - name: conversation_id
          in: path
          required: true
          type: string
          description: 会话ID
        - name: resource_type
          in: query
          required: false
          type: string
          description: 资源类型，agent-单智能体、controller-多智能体、workflow-工作流
          enum:
            - agent
            - workflow
            - controller
          default: workflow
        - name: version_id
          in: query
          required: false
          type: string
          description: 版本ID
      responses:
        '200':
          description: success
          schema:
            $ref: '#/definitions/AgentVariableRsp'
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/ErrorRsp'
  /v1/{project_id}/agents/{agent_id}/conversations/{conversation_id}/variables/{var_id}:
    put:
      tags:
        - AgentVariable
      description: 更新会话变量
      operationId: updateAgentVariable
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 项目ID
        - name: agent_id
          in: path
          required: true
          type: string
          description: 资源ID
        - name: conversation_id
          in: path
          required: true
          type: string
          description: 会话ID
        - name: var_id
          in: path
          required: true
          type: string
          description: 变量名称
        - name: update_variable_req
          in: body
          required: true
          description: 接口请求体
          schema:
            $ref: '#/definitions/UpdateVariableReq'
      responses:
        '200':
          description: success
          schema:
            $ref: '#/definitions/VariableInfo'
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/ErrorRsp'
  /v1/{project_id}/asr/short-audio:
    post:
      tags:
        - AgentRuntime
      description: 一句话语音识别
      operationId: VoiceRecognition
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
        - name: asr_req
          in: body
          required: true
          description: 接口请求体
          schema:
            $ref: '#/definitions/AsrReq'
      responses:
        '200':
          description: 语音识别返回数据
          schema:
            $ref: '#/definitions/AsrRsp'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorRsp'
  /v1/{project_id}/agents/token:
    get:
      tags:
        - AgentRuntime
      description: 委托换取token
      operationId: DelegateExchangeToken
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
        - name: auth_project_id
          in: query
          required: false
          type: string
          description: 需要换取的token的project id
        - name: auth_domain_id
          in: query
          required: false
          type: string
          description: 需要换取的token的domain id
      responses:
        '200':
          description: success
          schema:
            type: string
          headers:
            X-Auth-Token:
              description: 委托换取的token
              type: string
        '400':
          description: Bad request
          schema:
            $ref: '#/definitions/ErrorRsp'
  /v1/{project_id}/agents/{agent_id}/conversations/{conversation_id}/memory-variables:
    get:
      tags:
        - ConversationManagement
      summary: 根据conversation_id查询会话记忆
      description: 根据conversation_id查询会话记忆
      operationId: RetrieveConversationMemory
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: agent_id
          in: path
          required: true
          type: string
          description: agent_id
          maxLength: 64
          pattern: ^[a-zA-Z0-9_-]+$
        - name: conversation_id
          in: path
          required: true
          type: string
          description: conversation_id
          maxLength: 64
          pattern: ^[a-zA-Z0-9_-]+$
        - name: version_id
          in: query
          required: false
          description: 版本号
          type: string
          maxLength: 32
      responses:
        '200':
          description: conversation记忆列表
          schema:
            items:
              $ref: '#/definitions/MemoryVariable'
            type: array
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: '#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: '#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: '#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: '#/definitions/ErrorRsp'
      x-order: 1
  /v1/{project_id}/agents/{agent_id}/conversations/{conversation_id}/memory-variables/reset:
    post:
      tags:
        - ConversationManagement
      summary: 根据conversation_id重置会话记忆
      description: 根据conversation_id重置会话记忆
      operationId: ResetConversationMemory
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: conversation_id
          in: path
          required: true
          type: string
          description: conversation_id
          maxLength: 64
          pattern: ^[a-zA-Z0-9_-]+$
        - name: agent_id
          in: path
          required: true
          type: string
          maxLength: 64
          pattern: ^[a-zA-Z0-9_-]+$
          description: 应用id
        - name: version_id
          in: query
          required: false
          description: 版本号
          type: string
          maxLength: 32
      responses:
        '200':
          description: conversation记忆列表
          schema:
            items:
              $ref: '#/definitions/MemoryVariable'
            type: array
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: '#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: '#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: '#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: '#/definitions/ErrorRsp'
      x-order: 1
  /v1/{project_id}/agents/{agent_id}/conversations/{conversation_id}/history:
    get:
      tags:
        - ConversationManagement
      summary: 根据conversation_id查询会话
      description: 根据conversation_id查询会话
      operationId: RetrieveConversation
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: agent_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: workflow/agent id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: conversation_id
          in: path
          required: true
          type: string
          description: conversation_id
          maxLength: 64
          pattern: ^[a-zA-Z0-9_-]+$
        - name: version_id
          in: query
          required: false
          description: 版本号
          type: string
          maxLength: 32
      responses:
        '200':
          description: conversation消息
          schema:
            items:
              $ref: '#/definitions/Message'
            type: array
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: '#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: '#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: '#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: '#/definitions/ErrorRsp'
      x-order: 1
    delete:
      tags:
        - ConversationManagement
      summary: 根据conversation_id删除会话
      description: 根据conversation_id删除会话
      operationId: DeleteConversation
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: agent_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: workflow/agent id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: conversation_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: conversation_id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: version_id
          in: query
          required: false
          description: 版本号
          type: string
          maxLength: 32
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/ConversationDeleteResp'
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: '#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: '#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: '#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: '#/definitions/ErrorRsp'
      x-order: 4
  /v1/{project_id}/knowledge/rag-search:
    post:
      tags:
        - KnowledgeRagSearch
      summary: 知识库检索
      description: 知识库检索
      operationId: SearchKnowledgeText
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: repo_id
          in: query
          required: true
          type: string
          maxLength: 512
          description: 知识库id列表
        - name: req
          in: body
          required: true
          schema:
            $ref: '#/definitions/KnowledgeToolCallReq'
          description: 检索内容
        - name: top_k
          in: query
          required: false
          description: 最大召回数量
          type: integer
          format: int32
          default: 10
          minimum: 1
          maximum: 50
        - name: recall_threshold
          in: query
          required: false
          description: 相关度得分阈值
          type: number
          format: float
          default: 0.5
        - name: faq_threshold
          in: query
          required: false
          description: FAQ直出阈值
          type: number
          format: float
          default: 0.9
        - name: search_mode
          in: query
          required: false
          description: |-
            检索策略模式，有三种取值：
            - doc，语义检索
            - keyword，关键词检索
            - mix，混合检索
            - faq,faq检索
          type: string
          default: doc
          enum:
            - doc
            - keyword
            - mix
            - faq
          minLength: 1
          maxLength: 16
        - name: type
          in: query
          required: false
          description: 知识库类型， external：用户在知识库平台创建的知识库，在Agent平台中进行引用，internal（默认）：用户在Agent平台创建的知识库
          type: string
          maxLength: 32
          default: internal
        - name: source
          in: query
          required: false
          description: 知识库来源，KooSearch（默认）、LakeSearch
          type: string
          maxLength: 64
          default: KooSearch
        - name: filter_string
          in: query
          required: false
          description: 知识库标签过滤
          type: string
        - name: knowledge_bases
          in: query
          type: string
          description: 知识库id和标签。
        - name: extra_params
          in: query
          type: string
          description: 自定义参数。
        - name: need_extras_faq_search
          in: query
          required: false
          description: 是否扩展的FAQ搜索功能
          type: boolean
          default: false
        - name: retrieve_image
          in: query
          required: false
          description: 是否召回图片
          type: boolean
          default: false
      responses:
        '200':
          description: rag 检索内容
          schema:
            $ref: '#/definitions/KnowledgeToolCallResp'
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: '#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: '#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: '#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: '#/definitions/ErrorRsp'
      x-order: 1

  /v2/{project_id}/knowledge/rag-search:
    post:
      tags:
        - KnowledgeRagSearch
      summary: 知识库检索
      description: 知识库检索
      operationId: SearchRagKnowledge
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          maxLength: 64
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
        - name: req
          in: body
          required: false
          schema:
            $ref: '#/definitions/KnowledgeCallReq'
          description: 检索内容
      responses:
        '200':
          description: rag 检索内容
          schema:
            $ref: '#/definitions/KnowledgeToolCallResp'
        '400':
          description: Bad Request 请求错误
          schema:
            $ref: '#/definitions/ErrorRsp'
        '401':
          description: Unauthorized 鉴权失败
          schema:
            type: string
        '403':
          description: Forbidden 没有操作权限
          schema:
            $ref: '#/definitions/ErrorRsp'
        '404':
          description: Not Found 找不到资源
          schema:
            $ref: '#/definitions/ErrorRsp'
        '500':
          description: Internal Server Error 服务内部错误
          schema:
            $ref: '#/definitions/ErrorRsp'
      x-order: 1

  /v1/{project_id}/workflows/{workflow_id}/conversations/{conversation_id}/additional-questions:
    post:
      tags:
        - WorkflowRuntime
      summary: 自动生成追问
      description: 自动生成追问
      operationId: AdditionalQuestionsWorkflow
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
        - name: workflow_id
          in: path
          required: true
          type: string
        - name: conversation_id
          in: path
          required: true
          type: string
        - name: workspace_id
          in: query
          type: string
          required: true
        - name: additional_questions_workflow
          in: body
          required: true
          description: 追问请求体
          schema:
            $ref: '#/definitions/AdditionalQuestionsWorkflowReq'
      responses:
        '200':
          description: 追问列表
          schema:
            $ref: '#/definitions/AutoAddResultJsonObject'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorRsp'
      x-order: 1

  /v1/{project_id}/agents/{agent_id}/conversations/{conversation_id}/additional-questions:
    post:
      tags:
        - AgentRuntime
      summary: 自动生成追问
      description: 自动生成追问
      operationId: AdditionalQuestions
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
        - name: agent_id
          in: path
          required: true
          type: string
        - name: conversation_id
          in: path
          required: true
          type: string
        - name: workspace_id
          in: query
          type: string
          required: true
        - name: additional_questions
          in: body
          required: true
          description: 追问请求体
          schema:
            $ref: '#/definitions/AdditionalQuestionsReq'
      responses:
        '200':
          description: 追问列表
          schema:
            $ref: '#/definitions/AutoAddResultJsonObject'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorRsp'
      x-order: 1

  /v1/{project_id}/workflows/{workflow_id}/conversations:
    get:
      tags:
        - WorkflowRuntime
      summary: 查询当前对话中用户输入内容的列表
      operationId: listConversationQueries
      produces:
        - application/json
      parameters:
        - name: project_id
          in: path
          required: true
          type: string
          description: 租户项目id
          pattern: ^[a-zA-Z0-9_-]+$
          maxLength: 64
          minLength: 1
        - name: workflow_id
          in: path
          required: true
          type: string
          description: 工作流id
          pattern: ^[a-zA-Z0-9_-]+$
          maxLength: 64
          minLength: 1
        - name: offset
          in: query
          required: false
          type: integer
          format: int32
          default: 0
          minimum: 0
          maximum: 100000
        - name: limit
          in: query
          required: false
          type: integer
          format: int32
