definitions:
  AsrReq:
    type: object
    description: 一句话语音识别接口请求体
    required:
      - config
      - data
    properties:
      config:
        description: 配置信息
        $ref: '#/definitions/AsrConfig'
      data:
        type: string
        description: 语音数据，Base64编码，要求Base64编码后大小不超过4M，音频时长不超过1分钟
  AsrRsp:
    type: object
    description: 接口响应体
    required:
      - trace_id
      - result
    properties:
      trace_id:
        type: string
        description: 服务内部的令牌，可用于在日志中追溯具体流程，调用失败无此字段。在某些错误情况下可能没有此令牌字符串。
      result:
        description: 调用成功表示识别结果，调用失败时无此字段
        $ref: '#/definitions/Result'
  AsrConfig:
    type: object
    description: ASR配置
    required:
      - audio_format
      - property
    properties:
      audio_format:
        type: string
        description: 支持语音的格式
      property:
        type: string
        description: 所使用的模型特征串，通常是 “语种_采样率_领域”的形式，采样率需要与音频采样率保持一致
      add_punc:
        type: string
        description: 表示是否在识别结果中添加标点，取值为“yes”和“no”，默认为“no”
      digit_norm:
        type: string
        description: 表示是否将语音中的数字识别为阿拉伯数字，取值为“yes” 和 “no”，默认为“yes”
      vocabulary_id:
        type: string
        description: 热词表id，不使用则不填写
      need_word_info:
        type: string
        description: 表示是否在识别结果中输出分词结果信息，取值为“yes”和“no”，默认为“no”
  Result:
    type: object
    description: Result
    required:
      - text
      - score
    properties:
      text:
        type: string
        description: 调用成功表示识别出的内容
      score:
        type: number
        format: float
        description: 调用成功表示识别出的置信度，取值范围：0~1
      word_info:
        type: array
        items:
          $ref: '#/definitions/WordInfo'
        description: 分词信息列表，分词是指将识别出的文本进一步拆分成单独的词语
  WordInfo:
    type: object
    description: WordInfo
    properties:
      start_time:
        type: integer
        format: int32
        description: 起始时间
      end_time:
        type: integer
        format: int32
        description: 结束时间
      word:
        type: string
        description: 分词
  ErrorRsp:
    type: object
    description: 完整错误信息
    properties:
      error_code:
        type: string
        description: 错误码
      error_msg:
        type: string
        description: 错误信息
      error_reason:
        type: string
        description: 错误原因
      error_suggestion:
        type: string
        description: 错误建议
      details:
        type: array
        items:
          $ref: '#/definitions/ErrorDetail'
        description: 调用接口返回的错误信息
  ErrorDetail:
    type: object
    description: 错误信息
    properties:
      error_code:
        type: string
        description: 错误码
      error_msg:
        type: string
        description: 错误信息
  AdditionalQuestionsWorkflowReq:
    type: object
    description: 自动追问请求体
    required:
      - name
      - enable
    properties:
      name:
        type: string
        description: 工作流名称
      description:
        type: string
        description: 工作流描述
      enable:
        description: 追问是否启用
        type: boolean
      prompt:
        type: string
        description: 追问prompt
      version_id:
        type: string
        description: 版本号
      model_id:
        type: string
        description: 模型id
      model_name:
        type: string
        description: 模型名称
      model_type:
        type: string
        description: 模型类型
  AdditionalQuestionsReq:
    type: object
    description: 自动追问请求体
    required:
      - name
      - enable
    properties:
      name:
        type: string
        description: agent名称
      description:
        type: string
        description: agent描述
      enable:
        description: 追问是否启用
        type: boolean
      prompt:
        type: string
        description: 追问prompt
      version_id:
        type: string
        description: 版本号
  WorkflowComponent:
    type: object
    description: 工作流组件详细配置信息
    required:
      - id
      - name
      - type
    properties:
      id:
        type: string
        maxLength: 64
      name:
        type: string
        maxLength: 64
      type:
        type: string
        maxLength: 64
      inputs:
        type: array
        items:
          $ref: '#/definitions/WorkflowConfig'
        description: 工作流节点输入信息
      outputs:
        type: array
        items:
          $ref: '#/definitions/WorkflowConfig'
        description: 工作流节点输出信息
      configs:
        type: array
        items:
          $ref: '#/definitions/WorkflowConfig'
        description: 工作流节点配置信息
      condition:
        type: object
        properties:
          branches:
            type: array
            items:
              $ref: '#/definitions/WorkflowBranch'
            description: 工作流分支节点条件
  WorkflowConnection:
    type: object
    description: 工作流节点连接信息
    required:
      - source
      - target
    properties:
      source:
        type: string
        description: 源节点
        maxLength: 64
      target:
        type: string
        description: 目标节点
        maxLength: 64
      conditionId:
        type: string
        description: 分支条件
        maxLength: 64
  AdditionalQuestionsConfig:
     type: object
     required:
      - enable
      - prompt
      - rounds
     properties:
       enable:
         type: boolean
         description: 追问开关
       prompt:
         type: string
         description: 提示词
       rounds:
         type: int64
         description: 回合数
  WorkflowDetails:
    type: object
    required:
      - id
      - name
      - components
      - connections
    properties:
      id:
        type: string
        description: workflow id
        maxLength: 64
      name:
        type: string
        description: 工作流名称
        maxLength: 64
      description:
        type: string
        description: 工作流描述
        maxLength: 256
      components:
        type: array
        items:
          $ref: '#/definitions/WorkflowComponent'
        description: 工作流组件配置
      connections:
        type: array
        items:
          $ref: '#/definitions/WorkflowConnection'
        description: 工作流连接关系
      metadata:
        type: object
  Status:
    type: object
    required:
      - code
      - desc
    properties:
      code:
        type: integer
        description: 错误码
      desc:
        type: string
        maxLength: 1024
        description: 错误描述信息
  WorkflowRunInfo:
    type: object
    properties:
      parent_workflow_id:
        type: string
        maxLength: 32
        description: 父工作流id
      status:
        $ref: '#/definitions/Status'
        description: 工作流运行状态
      error_code:
        type: string
        maxLength: 256
        description: 错误码
      error_message:
        type: string
        maxLength: 4096
        description: 错误信息
      outputs:
        type: object
        additionalProperties:
          type: object
        description: 工作流整体输出
      metadata:
        type: object
        additionalProperties:
          type: object
        description: 节点特有的输出，如：大模型原始回复debug才设置
      start_time:
