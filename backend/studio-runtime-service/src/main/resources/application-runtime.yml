# ==========================================云服务私有配置项start=====================================
server:
  port: 31113
  address: ${server_ip:0.0.0.0}
  max-http-request-header-size: 100KB
  ssl:
    client-auth: none
    protocol: TLS
    # 支持TLS1.3的java版本，可以配置为：TLSv1.3,TLSv1.2
    enabled-protocols: TLSv1.2
    # 默认配置支持的算法为安全推荐的算法
    # 支持TLS1.3的java版本，可以配置为：TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    ciphers: TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    key-password: ${server_ssl_key_password}
    key-store: ${APP_PATH:/opt/cloud/studio-service}/ssl/server.keystore
    key-store-password: ${server_ssl_key_store_password}
    key-store-type: jks
    trust-store: ${APP_PATH:/opt/cloud/studio-service}/ssl/trust.keystore
    trust-store-password: ${server_ssl_trust_store_password}
    trust-store-type: JKS
    # 是否开启ssl
    enabled: ${server_ssl_enabled:false}
  tomcat:
    max-http-response-header-size: 16KB
    accesslog:
      enabled: ${tomcat_access_enable:false}
      pattern: '%t %a "%r" %s (%D ms)'
      directory: /opt/cloud/logs/agent-builder-agent-runtime
      prefix: access
      file-date-format: .yyyy-MM-dd
      rotate: true
      buffered: true

    threads:
      max: ${tomcat_threads_max:400}
      min-spare: ${tomcat_threads_min_spare:40}

spring:
  servlet:
    multipart:
      max-file-size: ${spring_servlet_multipart_max_file_size:128MB}
      max-request-size: ${spring_servlet_multipart_max_request_size:128MB}
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${spring_datasource_url:}
    username: ${spring_datasource_username:}
    password: ${spring_datasource_password:}
    driver-class-name: ${spring_datasource_driver_class_name:org.mariadb.jdbc.Driver}
    hikari:
      initialization-fail-timeout: -1  # 禁用启动时的连接检查
  sql:
    init:
      encoding: UTF-8
      schema-locations: classpath:sql/init.sql
      data-locations: classpath:sql/init_data.sql
      mode: ${spring_sql_init_mode:always}
      continue-on-error: true
  h2:
    console:
      enabled: false
  jackson:
    time-zone: GMT+8
    date-format: 'yyyy-MM-dd HH:mm:ss'
    default-property-inclusion: non_null
  # 线程池配置
  pools:
    asyncExecutor:
      corePoolSize: ${agent_settings_pools_asyncExecutor_corePoolSize:10}
      maxPoolSize: ${agent_settings_pools_asyncExecutor_maxPoolSize:100}
      queueCapacity: ${agent_settings_pools_asyncExecutor_queueCapacity:10}
      threadNamePrefix: asyncExecutor-
      keepAliveSeconds: ${agent_settings_pools_asyncExecutor_keepAliveSeconds:60}
  data:
    redis:
      host: ${redis_host:127.0.0.1}
      port: ${redis_port:6379}
      password: ${redis_password:}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  type-handlers-package: com.openjiuwen.studio.agent.runtime.mapper.handler

mybatis-plus:
  configuration:
    log-impl: ${mybatis_log_impl:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      id-type: auto # 全局默认主键策略设置为数据库自增
      db-type: mysql
redis:
  host: ${redis_host:127.0.0.1}
  password: ${redis_password:}
  port: ${redis_port:6379}
  expire_time: ${redis_expire_time:604800}
  max_message_num: ${redis_max_message_num:100}
  max_message_size: ${max_message_size:5000000}
  max_debug_msg_size: ${max_debug_msg_size:10000}
  database: 0
  user-variables-expire-time: ${redis_user_variables_expire_time:31536000}
  conversation-variables-expire-time: ${redis_conversation_variables_expire_time:604800}
  node_addr_list: ${redis_node_addr_list:}
  master: ${redis_master_name:mymaster}
  sentinel_ports: ${redis_sentinel_ports:26800,26801}
  target_ports: ${redis_target_ports:16800,16801}
  cluster_node_list: ${cluster_node_list:}
  client-type: ${redis_client_type:redisson}
  enable-log: ${redis_enable_log:false}

# 委托换取token
delegate:
  token:
    itep-dispatcher-endpoint: ${itep_dispatcher_endpoint:}
    agency-token-url: ${agency_token_url:}

# health check
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: none # Web 端不暴露任何端点（核心）

lite:
  api-code:
    enabled: ${lite_api_code_enabled:false}

storage:
  type: ${storage_type:OBS}
  expires: ${obs_expire_time:7}
  bucket-storage-limit: ${obs_bucket_storage_limit:100}
  custom-class: ${STORAGE_CUSTOM_CLASS:}
  custom-classpath: ${STORAGE_CUSTOM_CLASSPATH:}
  obs:
    url: ${obs_url:}
    ak: ${obs_ak:}
    sk: ${obs_sk:}
    bucket: ${obs_bucket:}
    staging-bucket: ${obs_staging_bucket:}
    opensource: ${obs_opensource:true}
    auto-create-bucket: ${obs_bucket_auto_create:true}
    path-style: ${DATASOURCE_OBS_PATH_STYLE:path}
  local:
    base-path: ${storage_local_base_path:}
    bucket: ${storage_local_bucket:}
    staging-bucket: ${storage_local_staging_bucket:}
    server-url: ${storage_local_server_url:}

iam:
  url: ${iam_endpoint:}
