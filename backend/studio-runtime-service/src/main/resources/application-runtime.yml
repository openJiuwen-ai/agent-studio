# ==================================== AgentOps配置 begin =========================================
agent-ops:
  default-mode: ${agent_ops_default_mode:API}
  enable: ${agent_ops_enable:false}
  base-url: ${agent_ops_base_url:https://localhost:8080}
  trace-api: ${agent_ops_trace_api:/ops/openapi/v2/trace}
  session-api: ${agent_ops_session_api:/ops/openapi/v1/session}
  core-pool-size: ${agent_ops_core_pool_size:8}
  max-pool-size: ${agent_ops_max_pool_size:32}
  pool-keep-alive: ${agent_ops_pool_keep_alive:60}
# ==================================== AgentOps配置 end =========================================

# ==================================== workflow配置 begin =========================================
workflow:
  ir-obs-path: ${workflow_ir_obs_path:workflow/ir}
  ir-cache-hours: ${workflow_ir_cache_in_hours:1}
  sse-timeout-milliseconds: ${workflow_sse_timeout_milliseconds:900000}
  max-query-length: ${workflow_max_query_length:100000}
  insight-exec-rel: ${workflow_insight_exec_rel:insight_exec_rel_%s_%s_%s}
  insight-conv-rel: ${workflow_insight_conv_rel:insight_conv_%s_%s}
  insight-exec: ${workflow_insight_exec:insight_exec_%s_%s}
  instance-expire: ${workflow_instance_expire:10}
  conversation-expire: ${workflow_conversation_expire:7}
  max-conversation-size: ${workflow_max_conversation_size:20}
  max-execution-size: ${workflow_max_execution_size:20}
  run-interface:
    timeout: ${workflow_run_interface_timeout:900}
  log-event: ${workflow_log_event:START,WORKFLOW_START,DONE,WORKFLOW_END}
  connector_config_host_blacklist: ${host_blacklist:}
  connector_config_host_whitelist: ${host_whitelist:}
  finish-keep-text: ${finish_keep_text:false}
# ==================================== workflow配置 end =========================================

# ==================================== 知识型agent配置 begin =========================================
agent:
  ir-obs-path: ${agent_ir_obs_path:agent/ir}
  ir-cache-hours: ${agent_ir_cache_in_hours:1}
  max-query-length: ${agent_max_query_length:100000}
  max-deep-research-message-length: ${deep_research_max_message_length:20000}
  sse-timeout-milliseconds: ${agent_sse_timeout_milliseconds:900000}
  deep-research-sse-timeout-milliseconds: ${deep_research_sse_timeout_milliseconds:7200000}
  jiuwen-timeout-milliseconds: ${agent_jiuwen_timeout_milliseconds:900000}
  insight-conv-rel: ${agent_insight_conv_rel:insight_conv_%s_%s}
  insight-exec-rel: ${agent_insight_exec_rel:insight_exec_rel_%s_%s_%s}
  insight-exec: ${agent_insight_exec:insight_exec_%s_%s}
  max-conversation-size: ${agent_max_conversation_size:50}
  max-execution-size: ${agent_max_execution_size:20}
  max-resolve-size: ${agent_max_resolve_size:5000}
  max-resolve-file-number: ${agent_max_resolve_file_number:10}
  max-upload-file-size: ${agent_max_upload_file_size:131072}
  max-upload-image-size: ${agent_max_upload_image_size:5120}
  conversion_file_max_num: ${conversion_file_max_num:10}
  finish-keep-text: ${finish_keep_text:false}
  skill-enabled: ${skill_enabled:true}
# ==================================== 知识型agent配置 end =========================================

# ==================================== 知识库配置 begin =========================================
knowledge:
  retrieve-merging-strategy: ${knowledge_retrieve_merging_strategy:KooSearchScoreMergingStrategy}
  source: ${knowledge_source:LakeSearch}
  bound:
    limit: ${knowledge_bound_limit:3}
