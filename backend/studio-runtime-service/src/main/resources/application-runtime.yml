okhttp:
  ignore-cert: ${okhttp_ignore_cert:true}
  max-idle-connections: ${okhttp_max_idle_connections:40}
  keep-alive-duration: ${okhttp_keep_alive_duration:30}
  connect-timeout: ${okhttp_connect_timeout:10}
  wait-timeout: ${okhttp_wait_timeout:10}
  read-timeout: ${okhttp_read_timeout:900}
  max-requests-perhost: ${okhttp_max-requests-perhost:400}
  max-requests: ${okhttp_max-requests:400}

memory:
  chunk-num: ${memory_chunk_num:10}
  conversation-num: ${memory_conversation_num:4}

feedback:
  backflow-enabled: ${feedback_backflow_enabled:false}
  backflow-interval-ms: ${feedback_backflow_interval_ms:1800000}
  backflow-clear-cron-expression: ${feedback_backflow_clear_cron_expression:0 0 0 * * ?}

file:
  img-type: ${file_img_type:.png,.jpg,.jpeg,.bmp,.gif}
  video-type: ${file_video_type:.mp4,.avi,.mov,.wmv,.flv}
  icon-type: ${file_icon_type:.jpg,.jpeg,.png,.gif}
  import-type: ${file_import_type:.jsonl}
  default-type: ${file_default_type:.doc,.docx,.txt,.pdf,.csv,.xlsx,.xls,.pptx,.ppt,.png,.jpg,.jpeg,.bmp,.gif,.mp3,.mp4,.wav,.amr,.m4a,.ogg,.flac,.webm,.aac,.ac3,.mov,.wma,.avi,.rmvb,.mkv,.flv,.f4v,.wmv,.3gp,.jsonl}
  max-upload-num: ${max_upload_num:20}
  time-scope-upload-num: ${time_scope_upload_num:300}
  max-upload-total-size: ${max_upload_total_size:204800}
  time-scope-upload-total-size: ${time_scope_upload_total_size:86400}
  readonly:
    enable: ${file_readonly_enable:false}
  access:
    expiration-minutes: ${file_upload_expiration_minutes:10080}

icon:
  max-size: ${icon_max_size:200}

# openfeign配置
