# =============== 轻量化版本 =========================

tenant:
  freeze:
    filter:
      # 是否开启被冻结租户的拦截
      enabled: ${freeze_filter_enable:false}
      # 当前服务不需要进行拦截的接口API，使用url通配符进行处理
