# ==================================== 内容审核配置 begin =========================================
sensitive:
  buffer:
    length: ${sensitive_buffer_length:1}
# ==================================== 内容审核配置 end =========================================

# ==================================== 公共配置 begin =========================================
release:
  web-rel: ${release_web_rel:release_web_rel_%s}
  app-rel: ${release_app_rel:release_app_rel_%s_%s}
  cloud-rel: ${release_cloud_rel:release_cloud_rel_%s}

model:
  invoke:
    debug: ${model_invoke_debug_log:false}
  video:
    task:
      keep-time: ${video_generation_task_keep_time:604800}
  platform:
    provider: ${platform_provider:100}
  security:
    report: ${model_chat_content_report:false}
    allreport: ${model_chat_content_allreport:false}
    record:
      pathPrefix: ${model_chat_content_path:chat/contents/}
      keepNum: ${model_chat_keepnum:200}
      localPath: ${model_chat_local_path:/opt/cloud/logs/agent-builder-agent-runtime/tmp}
  prompt-build:
    id: ${prompt_build_model_id:}
    type: ${prompt_build_model_type:openai}

  request:
    timeout: ${model_request_time:900000}
    connection-timeout: ${model_connection_timeout:10000}
    maxTotal: ${model_request_max_total:200}
    defaultMaxPerRoute: ${model_request_max_pre_route:50}
    thread:
      corePoolSize: ${model_invoke_thread_core_pool:150}
      maxPoolSize: ${model_invoke_thread_max_pool:500}
      queueCapacity: ${model_invoke_thread_core:50}

    securityCheck: ${model_request_security_check:true}
    proxy:
      open: ${model_request_proxy_open:false}
      user: ${model_request_proxy_user:}
      password: ${model_request_proxy_pwd:}
      host: ${model_request_proxy_host:}
      no-host: ${model_request_proxy_no_host:}
      port: ${model_request_proxy_port:8080}

task:
  async:
    pool-size: ${task_async_pool_size:100}
    execute-cron-expression: ${task_async_execute_cron_expression:0/30 * * * * ?}
    expire-days: ${task_async_expire_days:7}
    clear-cron-expression: ${task_async_clear_cron_expression:0 0 2 */7 * ?}
    max-execute-milliseconds: ${task_async_max_execute_milliseconds:172800000}
    execute-lock-key: ${task_async_execute_lock_key:async_execute_lock}
    clear-lock-key: ${task_async_clear_lock_key:async_clear_lock}
# ==================================== 公共配置 end =========================================


# ==================================== 流式接口心跳事件配置 start ===============================
heartbeat:
  pool-size: ${heartbeat_pool_size:150}
  interval-seconds: ${heartbeat_interval_seconds:10}
  # 开关模式: always,debug,off
  switch-mode: ${heartbeat_switch_mode:debug}
# ==================================== 流式接口心跳事件配置 end ===============================

