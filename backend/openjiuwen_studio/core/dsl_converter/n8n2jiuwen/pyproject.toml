[project]
name = "n8n2jiuwen"
version = "0.1.0"
description = "A high-performance transpiler to convert n8n workflow JSON exports into executable Python code"
authors = [{name = "Amir", email = "amir@example.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.25.0",
    "langchain>=0.1.0",
    "openai>=1.0.0",
]

[project.scripts]
n8_bridge = "n8n2jiuwen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]