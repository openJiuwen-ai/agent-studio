openjiuwen.02001060.reason=Message template name violates system naming rules, possibly due to name too short, \
  contains special characters, or uses disallowed keywords.
openjiuwen.02001060.suggestion=Please follow these specifications to modify structured message name: 1) Ensure name length is between 2-64 characters; \
  2) Remove leading and trailing spaces; 3) Only use allowed characters (Chinese, English, numbers, _, -, spaces); 4) Avoid special symbols like @, #, %, &, etc.; 5) Example formats: "Exception Message Template", "System Notification_1", "error message", etc.
