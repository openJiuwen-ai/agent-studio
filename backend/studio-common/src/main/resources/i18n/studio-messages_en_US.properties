openjiuwen.02001032=Tool information is incorrect.
openjiuwen.02001032.reason=Unable to parse tool JSON from OBS. Possible reasons include JSON format corruption, field mismatch, data type error, \
  or tool entity conversion failure. Original data is corrupted or does not meet PluginEntity/ToolEntity structure requirements.
openjiuwen.02001032.suggestion=Please check if the tool configuration file complies with the latest JSON schema specification, repackage and upload the plugin.
openjiuwen.02001033=TTS API service exception.
openjiuwen.02001033.reason=TTS API service call failed, possibly due to network issues or service unavailability.
openjiuwen.02001033.suggestion=Please check network connectivity and ensure TTS API service is running properly. If the problem persists, \
  please contact technical support.
openjiuwen.02001034=Interface call exception, queryDomainToken error.
openjiuwen.02001034.reason=Smart supplementary question feature interface call exception. Possible reasons include: the feature is disabled, Agent status abnormal, version incompatibility, \
  Domain Token verification failed, or related configuration parameters incorrect. System detected abnormal interface call behavior and prevented request execution.
openjiuwen.02001034.suggestion=Please confirm if the smart supplementary question feature is enabled, check if Agent status is normal, verify version compatibility, \
  re-obtain valid Domain Token, or contact system administrator to confirm feature permissions and configuration status.
openjiuwen.02001035=You do not have permission to perform this operation because you are not the creator.
openjiuwen.02001035.reason=Tool version release permission denied. System only allows tool creators or system administrators \
  (Op tenant) to perform this operation. Please confirm if you have the release permission for this tool.
openjiuwen.02001035.suggestion=Option 1: If you are the tool creator, please confirm if the login account is correct. Option 2: Please contact the tool creator to request release permission. \
  Option 3: For administrator operations, please confirm if the current account belongs to Op tenant permissions. Option 4: Check if user permission configuration is correct, and contact system administrator if necessary to fix permission information.
openjiuwen.02001036=API delete interface error.
openjiuwen.02001036.reason=API gateway API group creation failed. System encountered exception when calling API gateway service to create API group. \
  Possible reasons include: authentication token expired, network connection timeout, parameter configuration errors, API gateway service unavailable, quota exceeded, or insufficient permissions.
openjiuwen.02001036.suggestion=Please contact the development team.
openjiuwen.02001037=File upload rate limit exceeded, please try again later.
openjiuwen.02001037.reason=File upload request frequency exceeds LakeSearch service limits. System triggered rate limiter when calling LakeSearch service to upload knowledge base documents. \
  Possible reasons include: high upload frequency for single user, concurrent upload quantity exceeded, user quota exhausted, IP access frequency too high, or application/project call quota insufficient.
openjiuwen.02001037.suggestion=Option 1: Reduce upload frequency and add delay between consecutive upload operations (e.g., 2-3 files per minute). Option 2: Implement batch upload mechanism to split large files into small batches for processing. \
  Option 3: Check and upgrade user quota, contact administrator to adjust upload limits.
openjiuwen.02001038=Streaming interface execution timeout.
openjiuwen.02001038.reason=Streaming interface exceeded system timeout limit during execution, causing request interruption.
openjiuwen.02001038.suggestion=Please check network connection status and data processing logic, increase timeout settings if necessary, \
  or contact technical support to optimize interface performance.
openjiuwen.02001039=Model does not exist or model configuration conversion failed.
openjiuwen.02001039.reason=Invalid workflow model configuration caused introduction generation failure. System discovered the following issues when parsing workflow configuration: \
  1) root-level config object is empty or missing; 2) default_model field does not exist in configuration; 3) default_model value cannot be converted to expected Map<String, String> format; 4) default_model field type mismatch (such as string, array, null, etc. non-object type).
openjiuwen.02001039.suggestion=Option 1: Check if workflow DSL configuration file contains "default_model" field, confirm its value is a valid object format. \
  Option 2: Verify JSON format of configuration file is correct, use JSON formatter tool to check syntax. Option 3: Check default_model field value format, ensure no special characters or invalid data. Option 4: Check if workflow configuration file is correctly deployed to object storage.
openjiuwen.02001040=Redisson get bucket failed.
openjiuwen.02001040.reason=Exception occurred while trying to get Redis distributed storage bucket resource, possibly due to \
  Redis service unavailability or permission issues.
openjiuwen.02001040.suggestion=Please check Redis service status, network connection and permission configuration, \
  ensure Redis service is running properly and has sufficient access permissions.
openjiuwen.02001041=Get user token error.
openjiuwen.02001041.reason=Exception occurred during user authentication token acquisition, possibly due to authentication service unavailability \
  or user information verification failure.
openjiuwen.02001041.suggestion=Please check user login status, confirm authentication service is working properly, re-login \
  if necessary or contact system administrator.
openjiuwen.02001042=SQL execution failed.
openjiuwen.02001042.reason=Exception occurred while executing SQL query statement, possibly due to SQL syntax errors, \
  database connection issues, or insufficient permissions.
openjiuwen.02001042.suggestion=Please check if SQL syntax is correct, confirm database connection status is normal, \
  verify if current user has the corresponding database operation permissions.
openjiuwen.02001043=Failed to get provider authentication metadata. Project: {0}, Provider: {1}.
openjiuwen.02001043.reason=System returned empty result when getting provider authentication metadata, causing model service provider update operation to fail. \
  Specific reasons may include: 1) Specified provider (ID: {0}, Name: {1}) has not configured any authentication metadata; 2) Provider authentication metadata was accidentally deleted or set to unavailable; 3) Metadata service query encountered database exception or SQL execution failed; 4) Authentication configuration does not match provider type causing metadata information missing.
openjiuwen.02001043.suggestion=Option 1: Check if provider configuration is complete, go to provider management interface to see if authentication metadata configuration exists. Option 2: Reconfigure provider authentication information, ensure correct authentication type is selected and complete parameters are filled. \
  Option 3: View system logs, analyze SQL execution logs for querying authentication metadata. Option 4: Clear related cache and retry operation, possible cache inconsistency issue.
openjiuwen.02001044=Node type not supported.
openjiuwen.02001044.reason=Current node type is not within supported range.
openjiuwen.02001044.suggestion=Please check if the node type is correct, or contact technical support for more assistance.
openjiuwen.02001045=Unsupported data source type.
openjiuwen.02001045.reason=Current system does not support the selected data source type.
openjiuwen.02001045.suggestion=Please check if the data source type is correct, or contact administrator for support.
openjiuwen.02001046=Failed to parse event data answer.
openjiuwen.02001046.reason=Error occurred while parsing event data answer, possibly due to incorrect data format or abnormal data content.
openjiuwen.02001046.suggestion=Please check if the format and content of the event data answer are correct, \
  ensure it meets the expected JSON format.
openjiuwen.02001047=Failed to import agents|workflows|tools.
openjiuwen.02001047.reason=Error occurred while getting resources, causing agents, workflows, or tools import to fail.
openjiuwen.02001047.suggestion=Please check if the input content is correct, or contact technical support for further assistance.
openjiuwen.02001048=Authentication type not supported.
openjiuwen.02001048.reason=System cannot find corresponding authentication adapter for specified authentication type. \
  System returns empty result when querying this type in authentication adapter registry. Possible reasons include: 1) This authentication type has never been registered in the system or plugin was not properly loaded; 2) Authentication type name spelling error (case-sensitive); 3) Authentication plugin initialization failed or disabled; 4) Dependent authentication service or library unavailable; 5) Dynamic plugin loading mechanism failed.
openjiuwen.02001048.suggestion=Option 1: Check if authentication type name is correct, ensure case-sensitive spelling is correct. Option 2: View plugin loading failure information in system logs, troubleshoot dependency issues. \
  Option 3: Check if authentication plugin package is correctly deployed and available in system path. Option 4: Check if dynamic plugin loading feature is enabled. Option 5: Check if system configuration file contains correct definition for this authentication type.
openjiuwen.02001049=HTTP client initialization failed.
openjiuwen.02001049.reason=Error occurred during HTTP client initialization, possibly due to incorrect SSL context \
  configuration or secure random number generator unavailability.
openjiuwen.02001049.suggestion=Please check SSL context configuration, ensure correct protocol version is used \
  (such as TLSv1.2), and verify that secure random number generator is available.
openjiuwen.02001050=Failed to get request IAM context.
openjiuwen.02001050.reason=System cannot get request IAM context information. System failed to get IAM context in the following order: \
  1) Get from request attributes (used for processing standard HTTP request loops); 2) Get from ThreadLocal thread variables (used for processing async or downstream service calls). Possible reasons include: IAM authentication filter not properly configured or mispositioned, request attributes cleaned during processing, ThreadLocal context transfer failed in multi-threaded environment, IAM authentication service unavailable or authentication failed, Token expired or invalid, permission verification failed, context loss caused by gateway or load balancer, context transfer exception during service-to-service calls, context maintenance issues during async task execution.
openjiuwen.02001050.suggestion=Option 1: Check if IAM authentication filter configuration is correct, ensure it is in appropriate position in request processing chain. \
  Option 2: Check network connection status, confirm IAM service is accessible. Option 3: Verify user access Token is valid, regenerate Token if necessary. Option 4: Check IAM service API response status, confirm authorization status is normal. Option 5: For async call issues, check if ThreadLocal context is properly passed or set.
openjiuwen.02001053=Cannot find endpoint.
openjiuwen.02001053.reason=endpoint URI format is incorrect, causing inability to parse.
openjiuwen.02001053.suggestion=Please check if endpoint format is correct, ensure it complies with URI standards.
openjiuwen.02001054=Cannot load JsonReadFeature and JsonWriteFeature classes due to version conflicts, will use deprecated \
  JsonParser and JsonGenerator instead.
openjiuwen.02001054.reason=Jackson library version conflicts causing inability to load JsonReadFeature and JsonWriteFeature \
  classes, system will fall back to use deprecated JsonParser and JsonGenerator.
openjiuwen.02001054.suggestion=Please upgrade Jackson library version to compatible version, or ensure all dependent Jackson \
  library versions are consistent, though functionality is normal it is recommended to resolve version conflicts in time.
openjiuwen.02001055=Failed to convert file to Base64 string.
openjiuwen.02001055.reason=Error occurred while converting file to Base64 string, possibly due to inability \
