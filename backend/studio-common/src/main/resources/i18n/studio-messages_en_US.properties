openjiuwen.02001058=Failed to export structured message.
openjiuwen.02001058.reason=Exception occurred during Excel export, possible reasons include: 1) Exported message data volume is too large causing memory insufficient; 2) Message objects contain non-serializable special data types; \
  3) Insufficient file write permissions or insufficient disk space; 4) Excel template configuration abnormal.
openjiuwen.02001058.suggestion=Please follow these steps to troubleshoot: 1) Reduce the number of messages exported at once, recommend no more than 200 per export; 2) Check if message data contains complex objects or special characters, \
  ensure contentMap field is standard JSON format; 3) Ensure system has sufficient disk space and file write permissions; 4) For large data volume issues, please export in batches.
