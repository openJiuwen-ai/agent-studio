openjiuwen.02001059.suggestion=请检查环境变量配置，确保Redis服务正常运行，并重试刷新操作。
openjiuwen.02001060=消息模板名称不合法。
openjiuwen.02001060.reason=消息模板名称违反了系统的命名规则，可能是名称过短、包含特殊字符或不允许使用的关键字。
openjiuwen.02001060.suggestion=请按照以下规范修改结构化消息名称：1) 确保名称长度在2-64个字符之间；2) 移除开头和结尾的空格；3) 只使用允许的字符（中文、英文、数字、_、-、空格）；\
  4) 避免使用特殊符号如@、#、%、&等；5) 示例格式："异常消息模板"、"系统通知_1"、"error message"等。
