openjiuwen.02001033=TTS API服务异常。
openjiuwen.02001033.reason=TTS API服务调用失败，可能由于网络问题或服务不可用。
openjiuwen.02001033.suggestion=请检查网络连接，确保TTS API服务正常运行。如果问题持续，请联系技术支持。
openjiuwen.02001034=接口调用异常，queryDomainToken错误。
openjiuwen.02001034.reason=智能补充问题功能接口调用异常。可能是该功能被禁用、Agent状态异常、版本不兼容、Domain Token验证失败，\
  或相关配置参数不正确。系统检测到异常的接口调用行为，阻止了请求的继续执行。
openjiuwen.02001034.suggestion=请确认智能补充问题功能是否已开启，检查Agent状态是否正常，验证版本兼容性，重新获取有效的Domain Token，\
  或联系系统管理员确认该功能权限和配置状态。
openjiuwen.02001035=您没有执行此操作的权限，因为您不是创建者。
openjiuwen.02001035.reason=工具版本发布权限拒绝。系统仅允许工具创建者或系统管理员（Op租户）执行此操作。请确认您是否拥有该工具的发布权限。
openjiuwen.02001035.suggestion=方案1：如果您是工具创建者，请确认登录账号是否正确。方案2：请联系工具创建者申请发布权限。方案3：如为管理员操作，\
  请确认当前账号是否属于Op租户权限。方案4：检查用户权限配置是否正确，必要时联系系统管理员修复权限信息。
openjiuwen.02001036=API删除接口错误。
openjiuwen.02001036.reason=API网关API组创建失败。系统在调用API网关服务创建API组时发生异常。可能是认证令牌过期、网络连接超时、参数配置错误、\
  API网关服务不可用、配额超额或权限不足。
openjiuwen.02001036.suggestion=请联系开发人员。
openjiuwen.02001037=文件上传超出速率限制，请稍后重试。
openjiuwen.02001037.reason=文件上传请求频率超出LakeSearch服务限制。系统在调用LakeSearch服务上传知识库文档时触发了速率限制器，可能原因包括：\
  单个用户上传频率过高、并发上传数量超限、用户配额已用完、IP访问频率过高、或应用/项目的调用配额不足。
openjiuwen.02001037.suggestion=方案1：降低上传频率，在连续上传操作之间增加延迟（如每分钟2-3个文件）。方案2：实现分批次上传机制，\
  将大量文件分成小批次处理。方案3：检查并升级用户配额，联系管理员调整上传限制。
openjiuwen.02001038=流式接口执行超时。
openjiuwen.02001038.reason=流式接口在执行过程中超过了系统设定的超时时间限制，导致请求被中断。
openjiuwen.02001038.suggestion=请检查网络连接状态和数据处理逻辑，必要时增加超时时间设置，或联系技术支持优化接口性能。
openjiuwen.02001039=模型不存在或模型配置转换失败。
openjiuwen.02001039.reason=工作流模型配置无效导致前言生成失败。系统在解析工作流配置时发现以下问题之一：1) root级配置对象为空或缺失；2) default_model字段不存在于配置中；\
  3) default_model值无法转换为预期的Map<String, String>格式；4) default_model字段类型不匹配（如为字符串、数组、null等非对象类型）。
openjiuwen.02001039.suggestion=方案1：检查工作流DSL配置文件是否存在字段"default_model"，确认其值是一个有效的对象格式。方案2：验证配置文件的JSON格式是否正确，\
  可使用JSON格式化工具检查语法。方案3：检查default_model字段的值格式，确保不包含特殊字符或无效数据。方案4：检查工作流配置文件是否被正确部署到对象存储。
openjiuwen.02001040=Redisson获取bucket失败。
openjiuwen.02001040.reason=在尝试获取Redis分布式存储的bucket资源时发生异常，可能是Redis服务不可用或权限问题。
openjiuwen.02001040.suggestion=请检查Redis服务状态、网络连接和权限配置，确保Redis服务正常运行且有足够的访问权限。
openjiuwen.02001041=获取用户token错误。
openjiuwen.02001041.reason=在获取用户认证token过程中发生异常，可能是认证服务不可用或用户信息验证失败。
openjiuwen.02001041.suggestion=请检查用户登录状态，确认认证服务正常工作，必要时重新登录或联系系统管理员。
openjiuwen.02001042=SQL执行失败。
openjiuwen.02001042.reason=在执行SQL查询语句时发生异常，可能是由于SQL语句语法错误、数据库连接问题或权限不足导致的。
openjiuwen.02001042.suggestion=请检查SQL语句语法是否正确，确认数据库连接状态正常，验证当前用户是否具有相应的数据库操作权限。
openjiuwen.02001043=获取提供方认证元数据失败。项目：{0}，提供方：{1}。
openjiuwen.02001043.reason=系统在获取提供方认证元数据时返回空结果，导致模型服务提供方更新操作失败。具体原因可能是：1) 指定提供方（ID: {0}，名称: {1}）\
  尚未配置任何认证元数据；2) 提供方认证元数据被意外删除或置为不可用状态；3) 元数据服务查询出现数据库异常或SQL执行失败；4) 认证配置与提供方类型不匹配导致元数据信息缺失。
openjiuwen.02001043.suggestion=方案1：检查提供方配置是否完整，进入提供方管理界面查看是否存在认证元数据配置。方案2：重新配置提供方认证信息，\
  确保选择正确的认证类型并填写完整参数。方案3：查看系统日志，分析查询认证元数据的SQL执行日志。方案4：清除相关缓存并重试操作，可能存在缓存不一致问题。
openjiuwen.02001044=节点类型不支持。
openjiuwen.02001044.reason=当前节点类型不在支持范围内。
openjiuwen.02001044.suggestion=请检查节点类型是否正确，或联系技术支持以获取更多帮助。
openjiuwen.02001045=不支持的数据源类型。
openjiuwen.02001045.reason=当前系统不支持您选择的数据源类型。
openjiuwen.02001045.suggestion=请检查数据源类型是否正确，或联系管理员以获取支持。
openjiuwen.02001046=解析事件数据答案失败。
openjiuwen.02001046.reason=解析事件数据答案时发生错误，可能由于数据格式不正确或数据内容异常。
openjiuwen.02001046.suggestion=请检查事件数据答案的格式和内容是否正确，确保其符合预期的JSON格式。
openjiuwen.02001047=导入agents|workflows|tools失败。
openjiuwen.02001047.reason=在获取资源时发生错误，导致agents、workflows或tools导入失败。
openjiuwen.02001047.suggestion=请检查输入内容是否正确，或联系技术支持以获取进一步帮助。
openjiuwen.02001048=认证类型不支持。
openjiuwen.02001048.reason=系统无法为指定的认证类型找到对应的认证适配器。系统在认证适配器注册表中查询该类型时返回空结果，可能原因包括：1) 该认证类型从未在系统中注册或插件未正确加载；\
  2) 认证类型名称拼写错误（大小写敏感）；3) 认证插件初始化失败或被禁用；4) 依赖的认证服务或库不可用；5) 动态插件加载机制失败。
openjiuwen.02001048.suggestion=方案1：检查认证类型名称是否正确，确保大小写拼写无误。方案2：查看系统日志中的插件加载失败信息，排查依赖问题。\
  方案3：检查认证插件包是否已正确部署并在系统路径中可用。方案4：检查是否启用了动态插件加载功能。方案5：查看系统配置文件中是否包含了该认证类型的正确定义。
openjiuwen.02001049=HTTP客户端初始化失败。
openjiuwen.02001049.reason=在初始化HTTP客户端时发生错误，可能是由于SSL上下文配置不正确或安全随机数生成器不可用。
openjiuwen.02001049.suggestion=请检查SSL上下文配置，确保使用正确的协议版本（如TLSv1.2），并验证安全随机数生成器是否可用。
openjiuwen.02001050=获取请求IAM上下文失败。
openjiuwen.02001050.reason=系统无法获取请求的IAM上下文信息。系统按以下顺序尝试获取IAM上下文均失败：1) 从请求属性中获取（用于处理标准HTTP请求循环）；\
  2) 从ThreadLocal线程变量中获取（用于处理异步或下游服务调用）。可能原因包括：IAM认证过滤器未正确配置或位置错误、请求属性在处理过程中被清理、多线程环境下ThreadLocal上下文传递失败、IAM认证服务不可用或认证失败、Token过期或无效、权限验证失败、网关或负载均衡导致的上下文丢失、服务间调用时的上下文传递异常、异步执行任务时的上下文维护问题。
openjiuwen.02001050.suggestion=方案1：检查IAM认证过滤器配置是否正确，确保位于请求处理链的合适位置。方案2：查看网络连接状态，确认IAM服务是否可正常访问。\
  方案3：验证用户访问Token是否有效，必要时重新生成Token。方案4：检查IAM服务API响应状态，确认授权状态正常。方案5：如果是异步调用问题，检查ThreadLocal上下文是否正确传递或设置。
openjiuwen.02001053=无法找到endpoint。
openjiuwen.02001053.reason=endpoint的URI格式不正确，导致无法解析。
openjiuwen.02001053.suggestion=请检查endpoint的格式是否正确，确保其符合URI标准。
openjiuwen.02001054=由于版本冲突，无法加载JsonReadFeature和JsonWriteFeature类，将使用已弃用的JsonParser和JsonGenerator替代。
openjiuwen.02001054.reason=Jackson库版本冲突导致无法加载JsonReadFeature和JsonWriteFeature类，系统将回退到使用已弃用的JsonParser和JsonGenerator。
openjiuwen.02001054.suggestion=请升级Jackson库版本到兼容版本，或确保所有依赖的Jackson库版本一致，尽管功能正常但建议及时解决版本冲突问题。
openjiuwen.02001055=文件转换为Base64字符串失败。
openjiuwen.02001055.reason=在将文件转换为Base64字符串时发生错误，可能是由于文件内容无法读取或编码失败。
openjiuwen.02001055.suggestion=请检查文件是否有效，确保文件内容可以被正确读取和编码为Base64字符串。
openjiuwen.02001056=获取图标图片失败。
openjiuwen.02001056.reason=在获取图标图片时发生错误，可能是由于图片文件无法下载或MIME类型无法识别。
openjiuwen.02001056.suggestion=请检查图片文件是否有效，确保文件可以被正确下载，并确认文件扩展名是否正确以识别MIME类型。
openjiuwen.02001057=当前租户下的应用数量已经超过了套餐配额。
openjiuwen.02001057.reason=免费套餐已使用完。
openjiuwen.02001057.suggestion=请升级套餐。
openjiuwen.02001058=导出结构化消息失败。
openjiuwen.02001058.reason=Excel导出过程中发生异常，可能的原因包括：1) 导出的消息数据量过大导致内存不足；2) 消息对象中包含不可序列化的特殊数据类型；\
  3) 文件写入权限不足或磁盘空间不够；4) Excel模板配置异常。
openjiuwen.02001058.suggestion=请按以下步骤排查问题：1) 减少单次导出的消息数量，建议每次导出不超过200条；2) 检查消息数据是否包含复杂对象或特殊字符，\
  确保contentMap字段为标准JSON格式；3) 确保系统有足够的磁盘空间和文件写入权限；4) 如为数据量大问题，请分批次导出。
openjiuwen.02001059=请刷新环境。
