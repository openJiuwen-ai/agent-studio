Start:
  name: "开始"
  type: "Start"
  description: "工作流的起始节点，用于最开始接收用户输入，可以支持多个变量"
  schema:
    example: |
      {"id":"node_start","type":"Start","parameters":{"outputs":[{"name":"query","type":"string","description":"用户输入"}]},"next":"node_end"}
    description: "工作流的起始节点，支持多个输出, 限制：outputs必须包含用户输入参数，即存在 '{\"name\":\"query\",\"type\":\"string\",\"description\":\"用户输入\"}'元素"
LLM:
  name: "大模型"
  type: "LLM"
  description: "调用大语言模型的节点，根据入参和提示词生成回复"
  schema:
    example: |
      {"id": "node_llm", "type": "LLM", "parameters": {"inputs": [{"name": "query", "type": "string", "value": "${node_start.query}"}], "outputs": [{"name": "output", "type": "string", "description": "大模型输出"}], "configs": {"system_prompt": "## 人设\\n你是一个xxx。\\n\\n## 任务描述\\nxxx", "user_prompt": "{{query}}"}}, "next": "node_end"}
    description: "通过配置system_prompt和user_prompt调用大模型生成回复。限制：system_prompt和user_prompt中引用inputs的参数需要使用双花括号的形式{{}}"
IntentDetection:
  name: "意图识别"
  type: "IntentDetection"
  description: "根据用户输入进行分类并控制流程走向不同分支进行处理"
  schema:
    example: |
      {"id":"node_intent_detection","type":"IntentDetection","parameters":{"inputs":[{"name":"input","type":"string","value":"${node_start.query}"}],"configs":{"prompt":"你是一个功能分类器，可以根据用户的请求，结合相应的功能类别描述，帮助用户选择正确的分支"},"conditions":[{"branch":"branch_1","expression":"${node_intent_detection.rawOutput} contain 分类1","next":"node_llm"},{"branch":"branch_2","expression":"${node_intent_detection.rawOutput} contain 分类2","next":"node_llm_2"},{"branch":"branch_0","expression":"default","next":"node_end"}]}}
    description: "可以自定义配置prompt进行分类。限制：1. conditions中expression固定只能使用contain2. default分支必须存在，表示其他意图。3. 只包含input一个输入参数，没有输出参数。4. configs中必须包含prompt，内容可自定义5. 没有输出参数，禁止其他节点引用意图识别节点的输出"
Branch:
  name: "判断"
  type: "Branch"
  description: "根据条件判断，决定工作流的执行路径。"
  schema:
    example: |
      {"id": "node_branch", "type": "Branch", "parameters": {"conditions": [{"branch": "branch_1", "expressions": ["${node_questioner.number} longer_than 0", "${node_questioner.number} shorter_than 5"], "operator": "and", "next": "node_llm"}, {"branch": "branch_2", "expression": "${node_questioner.number} is_empty", "next": "node_llm_2"}, {"branch": "branch_0", "expression": "default", "next": "node_end"}]}}
    description: "通过对参数进行条件判断控制分支走向。限制：1. 当一个条件分支只有一个条件关系时使用`\"expression\": \"条件表达式\"`，存在多个条件关系时使用`\"expressions\": [\"条件表达式1\", \"条件表达式2\"]`。2. expression/expressions 中支持 eq/not_eq/contain/not_contain/longer_than/longer_than_or_eq/shorter_than/shorter_than_or_eq/is_empty/is_not_empty 十种方式条件关系。3. operator支持and/or两种方式，只有一个条件分支存在多个条件表达式时才被使用。4. default分支必须存在。"
Questioner:
  name: "提问器"
  type: "Questioner"
  description: "通过与用户对话的方式完成预配置参数的提取"
  schema:
    example: |
      {"id":"node_questioner","type":"Questioner","parameters":{"inputs":[{"name":"input","type":"string","value":"${node_start.query}"}],"outputs":[{"name":"destination","type":"string","description":"出行目的地"},{"name":"travel_mode","type":"string","description":"出行方式"}],"configs":{"prompt":"请输入出行目的地以及出行方式"}},"next":"node_llm"}
    description: "配置prompt向用户提问，按照预配置的outputs参数从用户回复中提取内容。限制：1. prompt中引用inputs的参数需要使用双花括号的形式{{}}。2. outputs中的参数类型只能是string, integer, number, boolean四种基本类型"
Message:
  name: "消息"
  type: "Message"
  description: "在工作流执行过程中输出指定的消息内容，例如 '正在执行中'等 Loading 状态展示或安抚语"
  schema:
    example: |
      {"id":"node_message","type":"Message","parameters":{"inputs":[{"name":"content","type":"string","value":"${node_llm.output}"}],"configs":{"template":"{{content}}"}},"next":"node_end"}
    description: "配置template定义输出消息的内容形式。限制：1. template中使用双花括号形式{{}}引用输入参数  2. 需要使用inputs中的所有参数，不能遗漏，支持零到多个输入参数 3. 没有输出参数，禁止其他节点引用消息节点的输出"
Code:
  name: "代码"
  type: "Code"
  description: "执行自定义python代码逻辑，无法完成主观任务。"
  schema:
    example: |
      {"id": "node_code", "type": "Code", "parameters": {"inputs": [{"name": "height", "type": "string", "value": "${node_questioner.height}"}, {"name": "weight", "type": "string", "value": "${node_questioner.weight}"}], "outputs": [{"name": "bmi", "type": "string", "description": "计算的BMI结果"}], "configs": {"code": "def main(args: dict):\\n    '''运行代码会调用此函数\\n    :param args: 输入固定为args字典类型，kv为输入参数键值对\\n    :return: 输出参数为字典类型，kv为输出参数键值对\\n    '''\\n    height = args.get('height')\\n    weight = args.get('weight')\\n    bmi = weight / height / height\\n    result = {'bmi': bmi}\\n    return result"}}, "next": "node_llm"}
    description: "配置code自定义代码逻辑，保障代码正常运行，需要在代码区域使用转义字符。限制：inputs参数按照`name: value`的键值对放入args.params中，代码返回结果时同样需要按照`名称: 值`的形式返回字典，且名称需要和outputs配置的参数保持一致"
Plugin:
  name: "插件"
  type: "Plugin"
  description: "集成预置或自定义的第三方插件，完成特定功能。"
  schema:
    example: |
      {"id":"node_plugin","type":"Plugin","parameters":{"inputs":[{"name":"image_file","type":"file/default","value":"${node_start.input_file}"}],"outputs":[{"name":"text","type":"string","description":"文本识别结果"}],"configs":{"apiId":"mock_ocr","tool_name":"ocr"}},"next":"node_llm"}
    description: "通过配置apiId选取插件。限制：apiId需要从提供的工具资源列表中选取，并保持输入输出参数与对应资源的输入输出相同"
End:
  name: "结束"
  type: "End"
  description: "工作流的终止节点，可以配置template定义最终输出消息的形式，支持多个输入参数"
  schema:
    example: |
      {"id": "node_end", "type": "End", "parameters": {"inputs": [{"name": "result", "type": "string", "value": "${node_start.query}"}], "configs": {"template": "{{result}}"}}}
    description: "配置template定义最终输出的形式，支持多个输入参数，限制：1. 没有输出参数，禁止其他节点引用结束节点的输出 2. template中需要引用inputs的全部参数，引用形式是双花括号{{}}"
Loop:
  name: "循环"
  type: "Loop"
  description: "循环执行循环体内的工作流，直到满足结束条件"
  schema:
    example: |
      {"id": "node_loop", "type": "Loop", "parameters": {"inputs": [{"name": "arr_loop_var", "type": "array<string>", "value": "${node_code.querys}"}], "outputs": [{"name": "results", "type": "array<string>", "description": "循环输出", "value": "${node_llm.result}"}], "configs": {"loop_type": "arrayLoop", "loop_body": ["node_loop_input", "node_llm", "node_loop_output"]}}, "next": "node_end"}
    description: "多次执行循环体内的节点，直到满足结束条件限制：1. 只能使用数组循环，也就是configs中loop_type只能设置为arrayLoop，inputs中必须存在一个array类型变量arr_loop_var，表示遍历的数组，循环体内的节点引用当前循环的遍历变量的方式为${node_loop.arr_loop_var.item} 2. 循环体内节点可以引用循环的索引，索引从0开始每循环一次加1，引用方式为`${循环节点id.index}` 3. outputs中的变量必须是数组类型，且包含value字段。仅能引用循环体内部节点的输出变量，输出类型由引用变量决定，例如所引用变量类型为string时，对应输出变量类型为array<string> 4. configs中的loop_body用于配置循环体，是一个节点id列表，列出循环体内的所有节点id，需要包含配对使用的LoopInput和LoopOutput节点，确保逻辑链路完整。"
LoopInput:
  name: "循环输入"
  type: "LoopInput"
  description: "循环体内的开始节点，与循环节点配套使用"
  schema:
    example: |
      {"id": "node_loop_input", "type": "LoopInput", "next": "node_llm"}
    description: "循环体的开始。限制：next指向所在循环体除循环输入外的第一个节点"

LoopOutput:
  name: "循环输出"
  type: "LoopOutput"
  description: "循环体内的结束节点，与循环节点配套使用"
  schema:
    example: |
      {"id": "node_loop_output", "type": "LoopOutput", "next": "node_loop"}
    description: "表示循环体的结束，限制：next指向循环节点"

SetVariable:
  name: "变量赋值"
  type: "SetVariable"
  description: "将工作流中的变量参数赋值到全局记忆变量"
  schema:
    example: |
      {"id": "node_set_variable", "type": "SetVariable", "parameters": {"settings": [{"left": "${memory.mem_var}", "right": "${node_start.query}"}]}, "variables": [{"name": "mem_var", "type": "string", "description": "记忆变量", "default": ""}], "next": "node_next"}
    description: "将工作流中的参数赋值到全局记忆变量，方便后续节点使用。限制：1. settings中元素的left字段的值只能是全局记忆变量，需要满足`${memory.var}`的形式，当引用的变量var必须在variables中定义 2. settings中元素的right字段的值只能采用引用赋值的形式`${node.var}`，不能使用其他方式 3. 整个工作流中所有变量赋值节点的variables是共同的，name相同的变量在不同变量赋值节点的variables中定义必须完全相同"

Workflow:
  name: "工作流"
  type: "Workflow"
  description: "将工作流中的变量参数赋值到全局记忆变量"
  schema:
    example: |
      {"id": "node_workflow", "type": "Workflow", "parameters": {"inputs": [{"name": "query", "type": "string", "value": "${node_start.query}"}], "outputs": [{"name": "response_content", "type": "string", "description": "最终输出"}], "configs": {"workflow_id": "mock_workflow_id", "workflow_name": "天气预测", }}, "next": "node_next"}
    description: "通过配置workflow_id选取工作流，限制：workflow_id需要从提供的工作流资源列表中选取，并保持输入输出参数与对应资源的输入输出相同"


