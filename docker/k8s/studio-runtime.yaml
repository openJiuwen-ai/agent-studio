kind: Deployment
apiVersion: apps/v1
metadata:
  name: studio-runtime
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studio-runtime
  template:
    metadata:
      labels:
        app: studio-runtime
    spec:
      volumes:
        - name: shm-volume
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      containers:
        - name: container-studio-runtime
          image: studio-runtime:1.0.0.20260526091150.x86_64
          env:
            # ======== [必填] Redis ========
            # 单机模式：配置 REDIS_HOST、REDIS_PORT、REDIS_PASSWORD
            # 集群模式：配置 REDIS_CLUSTER_NODES、REDIS_PASSWORD、REDIS_MODE=cluster
            # 哨兵模式：配置 REDIS_SENTINEL_MASTER、REDIS_SENTINEL_NODES、REDIS_PASSWORD、REDIS_MODE=sentinel
            - name: REDIS_HOST
              value: ''
            - name: REDIS_PASSWORD
              value: ''
            - name: REDIS_PORT
              value: '6379'
            # 集群模式时填写，格式：host1:port1,host2:port2,host3:port3
            - name: REDIS_CLUSTER_NODES
              value: ''
            # 哨兵模式时填写
            - name: REDIS_SENTINEL_MASTER
              value: ''
            # 哨兵模式时填写，格式：host1:port1,host2:port2,host3:port3
            - name: REDIS_SENTINEL_NODES
              value: ''
            # 单机填single，集群填cluster，哨兵填sentinel
            - name: REDIS_MODE
              value: 'single'
            # Redis数据库编号，默认0
            - name: REDIS_DATABASE
              value: '0'
            # ======== [必填] 对象存储 ========
            - name: DATASOURCE_OBS_SERVER
              value: ''
            - name: DATASOURCE_OBS_BUCKET
              value: ''
            - name: DATASOURCE_OBS_AK
              value: ''
            - name: DATASOURCE_OBS_SK
              value: ''
            - name: DATASOURCE_OBS_ENABLE_SSL
              value: 'false'
            # 寻址方式：path（路径风格，默认）或 virtual（虚拟托管风格）
            - name: DATASOURCE_OBS_PATH_STYLE
              value: 'path'
            # ======== 服务间调用地址（默认无需修改） ========
            # 模型配置来源策略：env（环境变量）/ ir（旧版路由）/ obs（OBS直连，默认，绕过模型路由）
            - name: MODEL_CONFIG_STRATEGY
              value: 'obs'
            # 模型缓存 LRU 容量，默认 500
            - name: MAX_MODEL_SERVICE_CACHE_NUM
              value: '500'
            - name: MAX_MODEL_AUTH_CACHE_NUM
              value: '500'
            # 模型缓存 TTL（秒），默认 L1=60 / L2=300
            - name: MODEL_CACHE_MEM_TTL
              value: '60'
            - name: MODEL_CACHE_REDIS_TTL
              value: '300'
            # ======== [选填] HTTPS证书 ========
            # 启用时设HTTPS=true，并填写证书Base64编码
            - name: HTTPS
              value: 'false'
            - name: HTTPS_CERT_FILE
              value: ''
            - name: HTTPS_KEY_FILE
              value: ''
            - name: TLS_CERT_KEY_PASSWD
              value: ''
            - name: TLS_CERT_KEY_PATH
              value: '/opt/cloud/agent-runtime/tls/key.pem'
            - name: TLS_CERT_PATH
              value: '/opt/cloud/agent-runtime/tls/cert.pem'
            # ======== [选填] 沙箱配置 ========
            # 远程沙箱地址（配置后启用沙箱模式，为空则沙箱不可用自动走 local）
            - name: SECURITY_SANDBOX_SERVER
              value: ''
            # 沙箱类型：aio / jiuwenbox
            - name: SECURITY_SANDBOX_TYPE
              value: 'jiuwenbox'
            - name: SECURITY_SANDBOX_SSL_VERIFY
              value: 'false'
            - name: SECURITY_SANDBOX_IDLE_TTL
              value: '600'
            - name: SECURITY_SANDBOX_TIMEOUT
              value: '300'
            - name: SECURITY_SANDBOX_SCOPE
              value: 'system'
            # ======== [选填] OpenSearch（启用记忆库时必填） ========
            # 格式: host:port，多节点用逗号分隔
            - name: OPENSEARCH_HOSTS
              value: ''
            - name: OPENSEARCH_USERNAME
              value: 'admin'
            - name: OPENSEARCH_PASSWORD
              value: 'admin'
            - name: OPENSEARCH_USE_SSL
              value: 'false'
            - name: OPENSEARCH_SSL_VERIFY
              value: 'false'
            # ======== [选填] 记忆库配置（默认关闭） ========
            # 总开关，设为true启用记忆库功能
            - name: MEMORY_ENABLED
              value: 'false'
            - name: LONG_TERM_MEMORY_ENABLE
              value: 'false'
            - name: MEMORY_USER_PROFILE_ENABLE
              value: 'false'
            # 记忆库抽取用的Embedding模型配置（启用记忆库时必填）
            - name: MEMORY_EMBEDDING_MODEL
              value: 'bge-m3'
            - name: MEMORY_EMBEDDING_BASE_URL
              value: ''
            - name: MEMORY_EMBEDDING_API_KEY
              value: ''
            # 记忆库抽取用的LLM模型配置（启用记忆库时必填）
            - name: MEMORY_LLM_MODEL
              value: ''
            - name: MEMORY_LLM_BASE_URL
              value: ''
            - name: MEMORY_LLM_API_KEY
              value: ''
            # ======== [选填] 其他配置 ========
            # Uvicorn worker 数量，未设置时默认 CPU 核心数 + 1
            - name: GUNICORN_WORK_NUM
              value: ''
            - name: PORT
              value: '31014'
            - name: PLUGIN_SSL_API_CERT
              value: 'false'
            - name: WORKFLOW_EXECUTE_TIMEOUT
              value: '900'
            - name: IR_LLM_API_KEY
              value: 'sk-placeholder'
            - name: JIUWEN_LOG_FILE
              value: '/opt/cloud/logs/tgf_python.log'
            - name: JIUWEN_LOG_PATH
              value: '/opt/cloud/logs/jiuwen.log'
            - name: JIUWEN_LOGGING_LOG_FILE
              value: '/opt/cloud/logs/jiuwen_python.log'
            - name: LOGGING_LOG_PATH
              value: '/opt/cloud/logs/'
            - name: TGF_LOG_DIR
              value: '/opt/cloud/logs/'
            # 日志转存目录，默认 /opt/cloud/logs/common_log_backup
            - name: BACKUP_COMMON_LOG_DIR
              value: ''
            # 源日志文件路径，默认 /opt/cloud/logs/common.log
            - name: BACKUP_COMMON_LOG_FILE
              value: ''
            # 日志详细模式，设为true时显示完整错误信息
            - name: LOG_VERBOSE
              value: 'true'
            # ======== [选填] 提示词优化任务持久化存储（不填则仅存内存） ========
            # 数据库类型：mysql 或 gaussdb，默认mysql
            - name: STORE_DB_TYPE
              value: 'mysql'
            # MySQL默认端口3306，GaussDB默认端口5432；GaussDB多节点时HOST填多个IP逗号分隔
            - name: STORE_DB_HOST
              value: ''
            - name: STORE_DB_PORT
              value: '3306'
            - name: STORE_DB_USER
              value: ''
            - name: STORE_DB_PASSWORD
              value: ''
            - name: STORE_DB_DATABASE
              value: 'agent-builder'
            # Schema 模式（仅GaussDB生效）：设置后连接以该 schema 作为默认 search_path；为空则用数据库默认
            - name: STORE_DB_SCHEMA
              value: ''
            # SSL模式（仅GaussDB生效）：disable（默认）/ require / verify-ca / verify-full
            - name: STORE_DB_SSLMODE
              value: 'disable'
            # 意图识别工作流开关
            - name: ENABLE_INTENT_WORKFLOW
              value: 'true'
            # ======== [选填] Nginx 负载均衡（默认关闭） ========
            # 启用后 Worker 以单进程模式运行，由 Nginx 做负载均衡
            - name: NGINX_LOAD_BALANCING
              value: 'false'
            # 负载均衡策略：least_conn（默认，推荐SSE场景）/ round_robin / ip_hash
            - name: LB_STRATEGY
              value: 'least_conn'
            - name: INSIGHT_EI_DEBUG_INFO_ENABLE
              value: 'true'
            - name: EXECUTION_STATE_STORAGE_MEDIUM
              value: 'redis'
            - name: STORAGE_TYPE
              value: 'OBS'
            - name: STORAGE_CUSTOM_MODULE
              value: ''
            - name: STORAGE_CUSTOM_CLASS
              value: ''
            - name: STORAGE_LOCAL_BASE_PATH
              value: ''
            - name: STORAGE_LOCAL_BUCKET
              value: ''
          resources:
            limits:
              cpu: '2'
              memory: 4Gi
            requests:
              cpu: '2'
              memory: 4Gi
          volumeMounts:
            - name: shm-volume
              mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 31014
              # https启动时，需要改成https
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 5
          startupProbe:
            tcpSocket:
              port: 31014
            initialDelaySeconds: 10
            timeoutSeconds: 30
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 240
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Never
          securityContext:
            privileged: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: default-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 60
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - studio-runtime
                topologyKey: failure-domain.beta.kubernetes.io/zone
            - weight: 40
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - studio-runtime
                topologyKey: kubernetes.io/hostname
      schedulerName: default-scheduler
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
kind: Service
apiVersion: v1
metadata:
  name: studio-runtime
  namespace: default
spec:
  ports:
    - name: cce-service-0
      protocol: TCP
      port: 31014
      targetPort: 31014
  selector:
    app: studio-runtime
  type: ClusterIP
