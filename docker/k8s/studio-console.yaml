---

kind: Deployment
apiVersion: apps/v1
metadata:
  name: studio-console
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studio-console
      version: v1
  template:
    metadata:
      labels:
        app: studio-console
        version: v1
      annotations:
        redeploy-timestamp: '1758698556242'
    spec:
      volumes:
        - name: vol-175869654720512159
          configMap:
            name: nginx.conf
            defaultMode: 420
      # HTTPS启动：删除以下行首的#号和空格，使缩进与上方已有的卷定义对齐
        # - name: vol-175885593369061328
        #   secret:
        #     secretName: cert
        #     defaultMode: 420
        # - name: vol-175885817081510014
        #   secret:
        #     secretName: nginx-secret
        #     defaultMode: 420
      containers:
        - name: container-studio-console
          image: studio-console:1.0.0.20260526091150.x86_64
          resources:
            limits:
              cpu: '2'
              memory: 4Gi
            requests:
              cpu: '2'
              memory: 4Gi
          volumeMounts:
            - name: vol-175869654720512159
              readOnly: true
              mountPath: /home/conf
          # HTTPS启动：删除以下行首的#号和空格，使缩进与上方已有的挂载项对齐
            # - name: vol-175885593369061328
            #   readOnly: true
            #   mountPath: /home/service/nginx
            # - name: vol-175885817081510014
            #   readOnly: true
            #   mountPath: /home/secret
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Never
          securityContext:
            privileged: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: default-secret
      schedulerName: default-scheduler
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
