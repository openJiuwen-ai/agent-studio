openapi: 3.1.0
info:
  title: Agent Runtime API
  description: 智能体运行时 API 文档（对话/推理/执行）
  version: v1
paths:
  /v1/health:
    get:
      tags:
      - execution_app
      summary: 健康检查
      description: Restful API for server health.
      operationId: health_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string
  /v1/orchestration/ir/execute:
    post:
      tags:
      - execution_app
      summary: IR 执行（流式/非流式）
      description: 'IR execute endpoint.

        直接透传 openjiuwen 原生格式，不做额外包装'
      operationId: ir_execute_v1_orchestration_ir_execute_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Req Json
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - execution_app
      summary: 删除执行实例
      description: Restful API for delete Agent instance and Workflow instance by
        executionId.
      operationId: delete_ir_execution_instance_v1_orchestration_ir_execute_delete
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Req Json
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/orchestration/ir/component/{component_id}/execute:
    post:
      tags:
      - execution_app
      summary: 单组件调试执行
      description: 单组件调试端点（：与普通执行一致 — body 安全 + effective userId 服务器覆盖）
      operationId: component_debug_execute_v1_orchestration_ir_component__component_id__execute_post
      parameters:
      - name: component_id
        in: path
        required: true
        schema:
          type: string
          title: Component Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Req Json
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{project_id}/agents/{agent_id}/conversations/{conversation_id}/additional-questions:
    post:
      tags:
      - execution_app
      summary: 生成追问（智能体场景）
      description: 自动生成追问（Agent 场景）。
      operationId: agent_additional_questions_v1__project_id__agents__agent_id__conversations__conversation_id__additional_questions_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
          title: Workspace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Req Json
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{project_id}/workflows/{workflow_id}/conversations/{conversation_id}/additional-questions:
    post:
      tags:
      - execution_app
      summary: 生成追问（工作流场景）
      description: 自动生成追问（Workflow 场景）。
      operationId: workflow_additional_questions_v1__project_id__workflows__workflow_id__conversations__conversation_id__additional_questions_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: workflow_id
        in: path
        required: true
        schema:
          type: string
          title: Workflow Id
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
          title: Workspace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Req Json
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{project_id}/workflows/{workflow_id}/conversations/{conversation_id}:
    post:
      tags:
      - app_run
      summary: 工作流对话
      description: 通过 workflow_id 和 conversation_id 发起工作流对话（流式响应）。设置请求头 stream=false
        可切换为非流式响应。version=latest 时使用最新发布版本的 IR。
      operationId: run_workflow_app_v1__project_id__workflows__workflow_id__conversations__conversation_id__post
      parameters:
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      - name: environment_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment Id
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowAppRunRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{project_id}/agents/{agent_id}/conversations/{conversation_id}:
    post:
      tags:
      - app_run
      summary: 智能体对话（单智能体/多智能体）
      description: 通过 agent_id 和 conversation_id 发起智能体对话。支持单智能体（ReAct）和多智能体（Controller），由
        IR 文件的 mode 字段自动决定执行模式。设置请求头 stream=false 可切换为非流式响应。version=latest 时使用最新发布版本的
        IR。
      operationId: run_agent_app_v1__project_id__agents__agent_id__conversations__conversation_id__post
      parameters:
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      - name: environment_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment Id
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentAppRunRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{project_id}/workflows/{workflow_id}/conversations/{conversation_id}/node_execute/{node_id}:
    post:
      tags:
      - app_run
      summary: 工作流单节点执行
      description: 对指定工作流中的单个节点进行独立调试执行，使用开发版 IR（无 version）。
      operationId: run_node_execute_v1__project_id__workflows__workflow_id__conversations__conversation_id__node_execute__node_id__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeExecuteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/workflows/chat/{short_code}/conversations/{conversation_id}:
    post:
      tags:
      - web_run
      summary: 网页工作流对话
      description: 通过 short_code 查询发布信息后复用工作流执行链。先从 Redis 查询 release_web_rel_{short_code}
        获取 ReleaseInfo，再用其中的 appId/versionId/projectId 构造执行上下文。
      operationId: run_web_workflow_v1_workflows_chat__short_code__conversations__conversation_id__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowAppRunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/agents/chat/{short_code}:
    post:
      tags:
      - web_run
      summary: 网页智能体对话
      description: 通过 short_code 查询发布信息后复用智能体执行链。conversation_id 为空时自动生成 UUID。handler_type
        由 IR 的 mode 决定（ReAct/Controller/PlanExecute）。
      operationId: run_web_agent_v1_agents_chat__short_code__post
      parameters:
      - name: workspace_id
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Workspace Id
      - name: conversation_id
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Conversation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentAppRunRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{project_id}/agents/{agent_id}/conversations/{conversation_id}/variables:
    get:
      tags:
      - conversation_variable
      summary: 获取会话全局变量
      description: 获取会话全局变量
      operationId: get_conversation_variables_v1__project_id__agents__agent_id__conversations__conversation_id__variables_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      - name: resource_type
        in: query
        required: false
        schema:
          type: string
          default: workflow
          title: Resource Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{project_id}/agents/{agent_id}/conversations/{conversation_id}/variables/{var_id}:
    put:
      tags:
      - conversation_variable
      summary: 更新会话全局变量
      description: 更新会话全局变量
      operationId: update_conversation_variable_v1__project_id__agents__agent_id__conversations__conversation_id__variables__var_id__put
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      - name: var_id
        in: path
        required: true
        schema:
          type: string
          title: Var Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVariableReq'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/memory-repos/{memory_repo_id}:
    delete:
      tags:
      - memory-internal
      summary: Delete Memory Repo
      description: 'Delete all memory data for a memory repo.


        Called by Java Manager via Runtime RCE when a memory repo is deleted.'
      operationId: delete_memory_repo_internal_v1_memory_repos__memory_repo_id__delete
      parameters:
      - name: memory_repo_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Repo Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/memory-repos/{memory_repo_id}/users/{user_id}/memories:
    delete:
      tags:
      - memory-internal
      summary: Clear User Memories
      description: Clear all memories for a user within a memory repo scope.
      operationId: clear_user_memories_internal_v1_memory_repos__memory_repo_id__users__user_id__memories_delete
      parameters:
      - name: memory_repo_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Repo Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - memory-internal
      summary: List User Memories
      description: Paginated list of memories for a user within a memory repo scope.
      operationId: list_user_memories_internal_v1_memory_repos__memory_repo_id__users__user_id__memories_get
      parameters:
      - name: memory_repo_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Repo Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 10
          title: Page Size
      - name: page_num
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page Num
      - name: memory_type
        in: query
        required: false
        schema:
          type: string
          title: Memory Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/memory-repos/{memory_repo_id}/users/{user_id}/memories/batch-delete:
    post:
      tags:
      - memory-internal
      summary: Batch Delete Memories
      description: 'Batch-delete memories by ID list.


        Body: {"memory_ids": ["id1", "id2", ...]}'
      operationId: batch_delete_memories_internal_v1_memory_repos__memory_repo_id__users__user_id__memories_batch_delete_post
      parameters:
      - name: memory_repo_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Repo Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/memory-repos/{memory_repo_id}/users/{user_id}/memories/search:
    post:
      tags:
      - memory-internal
      summary: Search Memories
      description: 'Semantic search for memories within a memory repo scope.


        Body: {"query": "...", "top_k": 10, "threshold": 0.3}'
      operationId: search_memories_internal_v1_memory_repos__memory_repo_id__users__user_id__memories_search_post
      parameters:
      - name: memory_repo_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Repo Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/memory-repos/{memory_repo_id}/memories/{memory_id}:
    put:
      tags:
      - memory-internal
      summary: Update Memory
      description: 'Update a single memory''s content.


        Body: {"user_id": "...", "content": "new content"}'
      operationId: update_memory_internal_v1_memory_repos__memory_repo_id__memories__memory_id__put
      parameters:
      - name: memory_repo_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Repo Id
      - name: memory_id
        in: path
        required: true
        schema:
          type: string
          title: Memory Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/inner-tools/file/resolve:
    post:
      tags:
      - inner_tools
      summary: 解析文件
      description: 根据 file_url 下载并解析文件内容，支持 txt/csv/xlsx/docx
      operationId: resolve_file_v1_inner_tools_file_resolve_post
      parameters:
      - name: file_url
        in: query
        required: true
        schema:
          type: string
          description: 文件访问url
          title: File Url
        description: 文件访问url
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResolveResponse'
        '422':
          description: Validation Error
          content:
