        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDocumentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{project_id}/releases:
    post:
      tags:
      - release
      summary: 创建应用发布信息
      description: '创建应用发布信息 — 将 ReleaseInfo 写入 Redis。


        1. 根据 short_code 构建 Redis key

        2. 补充 projectId / workspaceId / domainId / alreadyBeenCalled / updateTime

        3. 写入 Redis'
      operationId: create_release_info_v1__project_id__releases_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseInfo'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/{project_id}/releases/{release_id}:
    delete:
      tags:
      - release
      summary: 删除应用发布信息
      description: '删除应用发布信息 — 从 Redis 删除 ReleaseInfo。


        1. 根据 short_code 构建 Redis key

        2. 从 Redis 删除'
      operationId: delete_release_info_v1__project_id__releases__release_id__delete
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: release_id
        in: path
        required: true
        schema:
          type: string
          title: Release Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/kb/create:
    post:
      tags:
      - openjiuwen_kb
      summary: 创建知识库
      description: 创建知识库。
      operationId: create_kb_internal_v1_kb_create_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKBRequest'
        required: true
      responses:
