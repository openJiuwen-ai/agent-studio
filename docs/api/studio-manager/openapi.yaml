          type: number
          format: double
          description: 温度参数
          example: 0.0
        max_tokens:
          type: integer
          format: int32
          description: 最大Token数
          example: 1024
        url:
          type: string
          description: 接口地址
          example: https://example.com
        api_key:
          type: string
          description: API密钥
          example: sk-xxxxxxxxxxxxxxxx
    PromptTaskCreateReq:
      type: object
      properties:
        name:
          type: string
          description: 名称
          example: 示例名称
          minLength: 1
        desc:
          type: string
          description: 描述
          example: 示例描述
        promptId:
          type: string
          description: 提示词ID
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        execTime:
          type: integer
          format: int64
          description: 执行时间
          example: 1700000000000
        ptType:
          type: string
          description: 提示词类型
          enum:
          - text
          - multi
          example: text
        ptText:
          type: string
          description: 提示词文本
          example: 示例文本
        ptVars:
          type: string
          description: 提示词变量
          example: 示例文本
        dataSetId:
          type: string
          description: 数据集ID
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        ptObject:
          $ref: "#/components/schemas/ExecConfig"
          description: 执行对象配置
