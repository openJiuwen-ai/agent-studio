          type: integer
          format: int32
          description: 展示用例数量
          example: 3
        targetType:
          type: string
          description: 目标类型
          enum:
          - objective
          - subjective
          example: objective
        scoreStandard:
          type: string
          description: 评分标准
          example: 示例文本
        backKnowledge:
          type: string
          description: 背景知识
          example: 示例文本
        algorithm:
          type: string
