openapi: 3.1.0
info:
  title: Agent Studio Manager API
  description: 智能体管理平台 API 文档 — 涵盖智能体创建、配置、发布、知识库管理、提示词工程等管理面接口
  contact:
    name: OpenJiuWen Team
  license:
    name: Apache 2.0
  version: v1
servers:
- url: /
  description: 当前环境
paths:
  /v2/{project_id}/prompt/tasks/{task_id}:
    get:
      tags:
      - prompt-engineer-api-controller
      summary: 查询提示词优化任务详情
      description: Get details of a specific prompt optimization task
      operationId: getPromptTask
      parameters:
      - name: project_id
        in: path
        description: 项目ID
        required: true
        schema:
          type: string
      - name: task_id
        in: path
        description: 任务ID
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      - name: workspace_id
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptBaseResp"
    put:
      tags:
      - prompt-engineer-api-controller
      summary: 全量更新提示词优化任务（只能更新草稿）
      description: Fully update a prompt optimization task (all fields required)
      operationId: updatePromptTaskDraft
      parameters:
      - name: project_id
        in: path
        description: 项目ID
        required: true
        schema:
          type: string
      - name: task_id
        in: path
        description: 任务ID
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptTaskCreateReq"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptBaseResp"
    post:
      tags:
      - prompt-engineer-api-controller
      summary: 创建提示词优化任务
      description: Create a new prompt optimization task
      operationId: createPromptTask
      parameters:
      - name: project_id
        in: path
        description: 项目ID
        required: true
        schema:
          type: string
      - name: task_id
        in: path
        description: 任务ID
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePromptTaskRsp"
    delete:
      tags:
      - prompt-engineer-api-controller
      summary: 删除提示词优化任务
      description: Delete a prompt optimization task
      operationId: deletePromptTask
      parameters:
      - name: project_id
        in: path
        description: 项目ID
        required: true
        schema:
          type: string
      - name: task_id
        in: path
        description: 任务ID
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptBaseInfo"
  /v2/{project_id}/prompt/tasks/{task_id}/data/items/{item_id}:
    put:
      tags:
      - prompt-engineer-data-set-api-controller
      summary: 更新优化任务中的单条用例
      description: Update a specific data item in a dataset
      operationId: updateEvalDataSetItem
      parameters:
      - name: project_id
        in: path
        description: 项目ID
        required: true
        schema:
          type: string
      - name: task_id
        in: path
        description: 优化任务ID
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      - name: item_id
        in: path
        description: 数据用例ID
        required: true
        schema:
          type: string
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptEvalDataItem"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptEvalDataItem"
    delete:
      tags:
      - prompt-engineer-data-set-api-controller
      summary: 删除优化任务中的单条用例
      description: Delete a specific data item from a dataset
      operationId: deleteEvalDataSetItem
      parameters:
      - name: project_id
        in: path
        description: 项目ID
        required: true
        schema:
          type: string
      - name: task_id
        in: path
        description: 优化任务ID
        required: true
        schema:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      - name: item_id
        in: path
        description: 数据用例ID
        required: true
        schema:
          type: string
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseInfo"
  /v2/{project_id}/agent-manager/tools/{tool_id}:
    put:
      tags:
      - plugin-api-controller
      summary: 修改一个工具
      description: 修改一个工具
      operationId: modifyTool
      parameters:
      - name: project_id
        in: path
        description: 租户项目id
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
          pattern: "^[a-zA-Z0-9_-]+$"
      - name: workspace_id
        in: query
        description: 项目空间id
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "^[a-zA-Z0-9_()\\-]+$"
      - name: tool_id
        in: path
        description: 工具id
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
          pattern: "^[a-zA-Z0-9_-]+$"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePluginToolReq"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResp"
    delete:
      tags:
      - plugin-api-controller
      summary: 删除一个工具
      description: 删除一个工具，如果assistant引用了该工具，必须先进行解绑，否则删除报错
      operationId: deleteTool
      parameters:
      - name: project_id
        in: path
        description: 租户项目id
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
          pattern: "^[a-zA-Z0-9_-]+$"
      - name: plugin_id
        in: query
        description: 插件id
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "^[a-zA-Z0-9_-]+$"
      - name: tool_id
        in: path
        description: 工具id
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 0
          pattern: "^[a-zA-Z0-9_-]+$"
      - name: workspace_id
        in: query
        description: 项目空间id
        required: true
        schema:
          type: string
          maxLength: 64
          minLength: 1
          pattern: "^[a-zA-Z0-9_()\\-]+$"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseResp"
