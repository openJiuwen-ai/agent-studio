name: Build & Push Dev Docker Images

on:
  workflow_dispatch:
    inputs:
      agent_core_ref:
        description: 'agent-core 分支/tag (默认 develop)'
        required: false
        default: develop

concurrency:
  group: build-push-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_ts: ${{ steps.meta.outputs.build_ts }}
    steps:
      - name: Checkout agent-studio
        uses: actions/checkout@v4

      - name: Checkout agent-core
        run: |
          set -euo pipefail
          AGENT_CORE_REF="${{ inputs.agent_core_ref || 'develop' }}"
          git clone --branch "${AGENT_CORE_REF}" --depth 1 https://gitcode.com/openJiuwen/agent-core.git agent-core

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.13.1
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract metadata
        id: meta
        run: echo "build_ts=$(date +"%Y%m%d%H%M%S")" >> "$GITHUB_OUTPUT"

      - name: Build backend with Maven
        run: |
          cd backend
          mvn clean package -Dmaven.test.skip=true -U

      - name: Prepare studio-manager artifacts
        run: |
          mkdir -p docker/studio-manager/lib
          cp backend/studio-manager/target/studio-manager-*.jar docker/studio-manager/lib/studio-manager.jar
          if [ -d backend/studio-manager/target/lib ]; then
            cp backend/studio-manager/target/lib/* docker/studio-manager/lib/
          fi
          mkdir -p docker/studio-manager/config
          cp backend/studio-manager-service/src/main/resources/application-manager.yml docker/studio-manager/config/
          cp backend/studio-manager-service/src/main/resources/log4j2.xml docker/studio-manager/config/

      - name: Prepare studio-service artifacts
        run: |
          mkdir -p docker/studio-service/lib
          cp backend/studio-runtime/target/studio-runtime-*.jar docker/studio-service/lib/studio-service.jar
          if [ -d backend/studio-runtime/target/lib ]; then
            cp backend/studio-runtime/target/lib/* docker/studio-service/lib/
          fi
          mkdir -p docker/studio-service/config
          cp backend/studio-runtime-service/src/main/resources/application-runtime.yml docker/studio-service/config/
          cp backend/studio-runtime-service/src/main/resources/log4j2.xml docker/studio-service/config/

      - name: Build frontend with pnpm
        run: |
          cd frontend
          pnpm install --ignore-scripts
          pnpm run build
          cd ..
          tar -cf docker/studio-console/agent-console.tar -C frontend dist

      - name: Prepare studio-runtime artifacts (dev)
        run: |
          # 复制 runtime 源码到构建上下文
          rm -rf docker/studio-runtime/agent_runtime
          cp -rf agent-runtime/agent_runtime docker/studio-runtime/agent_runtime
          rm -rf docker/studio-runtime/jiuwen
          cp -rf agent-runtime/jiuwen docker/studio-runtime/jiuwen
          rm -rf docker/studio-runtime/agent_builder
          test -d agent_builder
          cp -rf agent_builder docker/studio-runtime/agent_builder
          rm -rf docker/studio-runtime/model_service
          test -d packages/model_service/model_service
          cp -rf packages/model_service/model_service docker/studio-runtime/model_service
          rm -rf docker/studio-runtime/tests
          cp -rf agent-runtime/tests docker/studio-runtime/tests
          rm -rf docker/studio-runtime/bin
          cp -rf docker/studio-runtime/script docker/studio-runtime/bin

          # 移除 requirements.txt 中的 openjiuwen 行（改为从源码安装）—— 先拷贝再 sed 副本，不动检出源文件
          cp -f agent-runtime/requirements.txt docker/studio-runtime/requirements.txt
          sed -i -E '/^openjiuwen([[:space:]]|[<>=!~]|$)/d' docker/studio-runtime/requirements.txt

          # 复制 agent-core 源码到构建上下文（清理不必要的文件以减小构建上下文）
          cp -rf agent-core docker/studio-runtime/agent-core
          rm -rf docker/studio-runtime/agent-core/.git \
                 docker/studio-runtime/agent-core/tests \
                 docker/studio-runtime/agent-core/docs \
                 docker/studio-runtime/agent-core/.venv \
                 docker/studio-runtime/agent-core/__pycache__ \
                 docker/studio-runtime/agent-core/.pytest_cache \
                 docker/studio-runtime/agent-core/report

      - name: Use official package repositories in CI
        shell: bash
        run: |
          set -euo pipefail
          find docker -type f -name 'Dockerfile*' -print0 | while IFS= read -r -d '' dockerfile; do
            sed -i \
              -e 's|https://mirrors.aliyun.com/pypi/simple/|https://pypi.org/simple|g' \
              -e '/pip3 config set global.trusted-host mirrors.aliyun.com/d' \
              -e 's|mirrors.aliyun.com|deb.debian.org|g' \
              "${dockerfile}"
          done

      - name: Upload build contexts
        uses: actions/upload-artifact@v4
        with:
          name: docker-dev-build-contexts
          path: |
            docker/studio-manager
            docker/studio-service
            docker/studio-console
            docker/studio-runtime
          retention-days: 1
          if-no-files-found: error

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [studio-manager, studio-service, studio-console, studio-runtime]
        arch: [amd64, arm64]

    steps:
      - name: Download build contexts
        uses: actions/download-artifact@v4
        with:
          name: docker-dev-build-contexts
          path: docker

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image repository config
        id: image_config
        env:
          GHCR_IMAGE_REPOSITORY_OVERRIDE: ${{ vars.GHCR_IMAGE_REPOSITORY }}
        run: |
          set -euo pipefail
          REPOSITORY_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE_REPOSITORY="${GHCR_IMAGE_REPOSITORY_OVERRIDE:-ghcr.io/${REPOSITORY_LOWER}}"
          echo "ghcr_registry=${GHCR_IMAGE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "ghcr_repository=${GHCR_IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image_config.outputs.ghcr_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} for ${{ matrix.arch }}
        env:
          REPOSITORY: ${{ steps.image_config.outputs.ghcr_repository }}
          SERVICE: ${{ matrix.service }}
          ARCH: ${{ matrix.arch }}
          BUILD_TS: ${{ needs.prepare.outputs.build_ts }}
        run: |
          set -euo pipefail
          case "${SERVICE}" in
            studio-manager) BASE_IMAGE=eclipse-temurin:17-jre; DOCKERFILE=Dockerfile ;;
            studio-service) BASE_IMAGE=eclipse-temurin:17-jre; DOCKERFILE=Dockerfile ;;
            studio-console) BASE_IMAGE=nginx:1.27; DOCKERFILE=Dockerfile ;;
            studio-runtime) BASE_IMAGE=python:3.11-slim; DOCKERFILE=Dockerfile.dev ;;
          esac
          if [ "${ARCH}" = amd64 ]; then SUFFIX=x86_64; else SUFFIX=arm64; fi
          TAG="dev-${BUILD_TS}.${SUFFIX}"
          docker buildx build \
            --file "docker/${SERVICE}/${DOCKERFILE}" \
            --platform "linux/${ARCH}" \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --cache-from "type=gha,scope=${SERVICE}-dev-${ARCH}" \
            --cache-to "type=gha,scope=${SERVICE}-dev-${ARCH},mode=min" \
            --tag "${REPOSITORY}/${SERVICE}:${TAG}" \
            --progress plain \
            --push \
            "docker/${SERVICE}"

  summary:
    needs: [prepare, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Print image summary
        run: |
          echo "Dev images published with tags:"
          echo "  dev-${{ needs.prepare.outputs.build_ts }}.x86_64"
          echo "  dev-${{ needs.prepare.outputs.build_ts }}.arm64"
