name: Test studio-manager-service

on:
  pull_request:
    branches:
      - studio-2.0-dev
    paths:
      - 'backend/**'

permissions:
  contents: read

concurrency:
  group: test-studio-manager-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Test studio-manager-service
        run: |
          cd backend
          mvn -B -pl studio-manager-service -am test -U
