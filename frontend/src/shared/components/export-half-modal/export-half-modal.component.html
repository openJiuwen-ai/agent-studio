<div class="com-drawer-title">{{exportTypeOptions[0].text}}</div>
<div class="main-container com-drawer-content">
  <div class="search-container mb-[16px]">
    <nz-input-group [nzSuffix]="suffixIconClear">
      <input type="text" nz-input placeholder="{{ 'search_placeholder' | i18nextEager }}" [(ngModel)]="searchValue" (keyup.enter)="onSearch()" />
    </nz-input-group>
    <ng-template #suffixIconClear>
      <span *ngIf="searchValue" class="cursor-pointer" (click)="onClear()">
        <nz-icon nzType="close" nzTheme="outline"></nz-icon>
      </span>
    </ng-template>
    <button nz-button nzType="default" (click)="onSearch()">
      <span nz-icon nzType="search"></span>
    </button>
    <button nz-button nzType="default" (click)="onRefresh()">
      <span nz-icon nzType="reload"></span>
    </button>
  </div>
  <nz-table
    #remoteTable
    [nzFrontPagination]="false"
    [nzData]="listOfData"
    [nzTotal]="total"
    [(nzPageIndex)]="pageIndex"
    [(nzPageSize)]="pageSize"
    [nzLoading]="loading"
    nzShowSizeChanger
    nzShowPagination
    [nzPageSizeOptions]="[10, 20, 50, 100]"
    (nzQueryParams)="onQueryParamsChange($event)"
    (nzPageIndexChange)="onPageIndexChange($event)"
    (nzPageSizeChange)="onPageSizeChange($event)"
    [nzScroll]="{ x: '500px', y: '400px' }"
  >
    <thead>
      <tr>
        <th [(nzChecked)]="isAllChecked" [nzWidth]="'50px'" (nzCheckedChange)="onAllChecked($event)"></th>
        <th *ngFor="let column of listOfColumns" [nzWidth]="column.width ? column.width + 'px' : null">
          {{ column.title }}
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of remoteTable.data">
        <td [nzChecked]="setOfCheckedId.has(data[selectedType.rowKey])" (nzCheckedChange)="onItemChecked(data[selectedType.rowKey], data, $event)"></td>
        <td *ngFor="let column of listOfColumns" [nz-tooltip]="data[column.dataIndex]">
          {{ data[column.dataIndex] }}
        </td>
      </tr>
    </tbody>
  </nz-table>
</div>
<div class="com-drawer-footer">
  <nz-space>
    <button *nzSpaceItem type="button" nz-button (click)="dismiss()">
      {{ 'cancel' | i18nextEager }}
    </button>
    <button *nzSpaceItem type="button" nz-button nzType="primary" [disabled]="!selectedRows.length" (click)="handleExport()">
      {{ 'export' | i18nextEager }}
    </button>
  </nz-space>
</div>
