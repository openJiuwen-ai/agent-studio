<div class="model-service-compare-router">
  <div class="debug-header-container">
    <div class="title">{{ 'effect_preview' | i18nextEager }}</div>
  </div>
  <div class="main-wrapper-history">
    <div class="left-container">
      <div
        class="main-container"
        cdkScrollable
        #chatContainerRef
        (scroll)="onScroll($event.target)"
      >
        <div
          [ngClass]="
            result.length === 0
              ? 'init-chat-content-container'
              : 'chat-content-container gap-5'
          "
        >
          <div
            class="chat-content"
          >
            <div class="flex w-full">
              <div
                class="assistant-content chat-content"
              >
                <div class="cv-content">
                  <div class="flex w-full gap-[12px]">
                    <div class="content-text">
                      {{ 'vectorization_input_hint'| i18nextEager }}
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="flex w-full" *ngIf="result">
              <div
                class="assistant-content chat-content"
              >
                <div class="cv-content">
                  <div class="flex w-full gap-[12px]">
                    <div class="textEmbedding">
                      <p class="title">{{ 'vectorization_output_hint'|i18nextEager }}</p>
                      <div class="content">
                        <div class="flex-right">
                          <img alt="" [src]="changeUrl('assets/model/copy.svg')" (click)="copyToClipboard()" />
                        </div>

                        <p>{{ result }}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div *ngIf="isLoading" class="pl-[5px]">
              <img alt=""
                class="w-[20px] h-[20px]"
                [src]="changeUrl('assets/agent-center/images/running.webp')"
                [alt]="'loading' | i18nextEager"
              />
            </div>
          </div>

        </div>

      </div>
      <!-- *ngIf 提到容器上：空容器会作为透明条覆盖预览区底部，吞掉落在其下方的点击 -->
      <div class="bottom-container" *ngIf="isShowStopIcon">
        <div class="stop-button" (click)="stopChat()">
          <div class="container">
            <!-- 旋转的边框层 -->
            <div class="rotating-border"></div>

            <!-- 静止的小方块 -->
            <div class="center-square"></div>
          </div>
          <span>{{ 'stop_answering' | i18nextEager }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
