<div class="com-drawer-title">{{ 'reference_plugins' | i18nextEager }}</div>
<div class="com-drawer-content">
  <nz-tabs class="add-mcp-tabs" [(nzSelectedIndex)]="tabSelectIndex" (nzSelectChange)="tabActiveChange($event)">
    <nz-tab [nzTitle]="tabs[0].title"> </nz-tab>
    <nz-tab [nzTitle]="tabs[1].title"> </nz-tab>
  </nz-tabs>
  <!-- 仅刷新表格区域：loading 只覆盖 nz-table，tab 栏始终保持挂载不重建 -->
  <nz-spin [nzSpinning]="isLoading">
    <nz-table
      [nzData]="srcData.data"
      [nzFrontPagination]="false"
      [(nzPageIndex)]="currentPage"
      [nzTotal]="totalNumber"
      [(nzPageSize)]="pageSize.size"
      (nzPageIndexChange)="getReferenceList()"
      (nzPageSizeChange)="onPageSizeChange()"
      [nzShowSizeChanger]="true"
      [nzPageSizeOptions]="pageSize.options"
    >
      <thead>
        <tr>
          <th *ngFor="let column of columns">
            {{ column.title }}
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of srcData.data">
          <td>
            <span *ngIf="isFromAgentBuilder">{{ row.app_name }}</span>
            <a *ngIf="!isFromAgentBuilder" nz-typography nzEllipsis class="cursor-pointer" (click)="navigateAppDetail(row)">
              {{ row.app_name }}
            </a>
          </td>
          <td>{{ row.app_version || ('unpublished' | i18nextEager) }}</td>
          <td>{{ row.resource_version || ('unpublished' | i18nextEager) }}</td>
        </tr>
      </tbody>
    </nz-table>
  </nz-spin>
</div>
<div class="com-drawer-footer"></div>
