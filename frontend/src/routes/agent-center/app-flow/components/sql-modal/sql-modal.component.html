<div class="flex h-full w-full flex-col" (keydown)="handleKeyDown($event)">
  <div class="mb-[16px] block">
    <div class="flex w-[calc(100%-38px)] items-center justify-between">
      <div class="flex items-center gap-[8px]">
        <img class="model-config-icon" [src]="iconUrl" alt="sql-node" />
        <edit-name [(name)]="nodeInfo.name" (onBlurConfirm)="updateName()"></edit-name>
      </div>

      <div class="flex items-center gap-[16px]" *ngIf="!isFlowReadonly">
        <div (click)="onClickTest()" class="single-test-icon-modal" nz-tooltip [nzTooltipTitle]="'single-test' | i18nextEager"></div>
        <div class="cursor-pointer" nz-dropdown [nzDropdownMenu]="actionsMenu" nzTrigger="click" nzPlacement="bottomRight">
          <span nz-icon nzType="more" nzTheme="outline"></span>
        </div>
        <nz-dropdown-menu #actionsMenu="nzDropdownMenu">
          <ul nz-menu>
            <li *ngFor="let action of actions" nz-menu-item (click)="onClickAction(action)">{{ action.label }}</li>
          </ul>
        </nz-dropdown-menu>
        <div class="h-[16px] w-[1px] bg-[#dbdbdb]"></div>
      </div>
    </div>

    <node-description [nodeInfo]="nodeInfo" (descriptionChange)="updateView()"></node-description>

    <div class="mt-[16px] h-[1px] w-full bg-[#f0f0f0]"></div>
  </div>

  <div id="flow-sql-modal-body" class="relative h-full w-full overflow-auto flex-1 pr-[16px]">
    <div class="h-full w-full overflow-auto">
      <meta-acc-block class="block w-[calc(100%-8px)]" [title]="'input_params' | i18nextEager">
        <ng-template #content>
          <div class="mt-2 flex items-center gap-2">
            <div class="w-1/3 text-label">{{ 'param_name' | i18nextEager }}</div>
            <div class="flex w-2/3 items-center gap-2 text-label">
              <div class="flex h-fit w-full items-center">
                <div class="w-[35%]">{{ 'type' | i18nextEager }}</div>
                <div class="w-[65%]">{{ 'value' | i18nextEager }}</div>
              </div>
              <div class="h-full w-[16px]"></div>
            </div>
          </div>

          <form #inputForm="ngForm">
            <div *ngFor="let param of inputParams; index as i" class="mt-2 flex items-start gap-2">
              <div class="w-1/3">
                <input
                  style="width: 100%"
                  type="text"
                  [name]="'inputFormName' + i"
                  nz-input
                  [maxlength]="paramNameMaxLen"
                  [(ngModel)]="param.name"
                  [title]="param.name"
                  (input)="onNameChange()"
                  [placeholder]="'input_placeholder' | i18nextEager"
                  [valueValidityValidator]="getInputNames(i)"
                  (ngModelChange)="changeUpdateTime()"
                  (blur)="inputOnSave()"
                />
              </div>

              <div class="flex w-2/3 gap-[8px]">
                <div class="flex h-fit w-[calc(100%-16px)] items-center gap-2">
                  <div class="flex w-full">
                    <div class="w-[35%]">
                      <nz-select
                        class="combo-select-left"
                        style="width: 100%"
                        [name]="'inputFormType' + i"
                        [nzOptions]="$any(inputSourceOptions)"
                        [(ngModel)]="param.value.type"
                        nzLabelKey="value"
                        (ngModelChange)="onInputValueTypeChange(param)"
                      ></nz-select>
                    </div>

                    <div class="w-[65%]">
                      <input
                        class="combo-select-right"
                        *ngIf="param.value.type === 'literal'"
                        style="width: 100%"
                        [name]="'inputFormValue' + i"
                        type="text"
                        nz-input
                        nonEmptyValidator
                        [placeholder]="'input_placeholder' | i18nextEager"
                        [(ngModel)]="param.value.content"
                        (ngModelChange)="onSave()"
                        [title]="param.value.content"
                      />

                      <input-tree-select
                        *ngIf="param.value.type === 'ref'"
                        style="width: 100%"
                        [(ngModel)]="param.value.content"
                        [options]="param.refs"
                        [name]="'inputFormValue' + i"
                        refSelectedRequire
                        [placeholder]="'select_placeholder' | i18nextEager"
                        (select)="treeSelect()"
                      ></input-tree-select>
                    </div>
                  </div>
                </div>
                <span
                  (click)="deleteInputParam(i)"
                  style="font-size: 16px; color: #191919; cursor: pointer; padding-top: 6px"
                  nz-icon
                  nzType="delete"
                  nzTheme="outline"
                ></span>
              </div>
            </div>
          </form>
        </ng-template>

        <ng-template #right>
          <div class="flex items-center justify-center">
            <button
              (click)="addInputParam()"
              class="w-fit"
              nz-button
              nzType="text"
              nz-tooltip
              [nzTooltipTitle]="'add_params' | i18nextEager"
              [disabled]="isReachedParamLimit(inputParams)"
            >
              <span nz-icon nzType="plus" nzTheme="outline"></span>
            </button>
          </div>
        </ng-template>
      </meta-acc-block>

      <div class="mt-[16px] h-[1px] w-full bg-[#f0f0f0]"></div>

      <meta-acc-block class="mt-4 block w-[calc(100%-8px)]" [title]="'data_query.sql' | i18nextEager">
        <ng-template #content>
          <nz-select
            class="mt-[8px] w-full"
            [ngModel]="selectedDatasource"
            (ngModelChange)="selectedDatasource = $event; onSave()"
            nzAllowClear
            [compareWith]="compareDatasource"
            [nzPlaceHolder]="'select_placeholder' | i18nextEager"
            [nzShowSearch]="true"
            [nzLoading]="datasourceLoading"
            (nzOnSearch)="onDatasourceSearch($event)"
            style="width: 100%"
          >
            <nz-option
              *ngFor="let ds of datasourceOptions"
              [nzValue]="ds"
              [nzLabel]="ds.name + ' (' + ds.type + ')'"
            >
              <span class="flex items-center gap-1">
                {{ ds.name }}
                <span class="flex h-[18px] items-center rounded-[2px] bg-[#e6e6e6] px-1">
                  {{ ds.type }}
                </span>
              </span>
            </nz-option>
          </nz-select>
        </ng-template>
      </meta-acc-block>

      <div class="mt-[16px] h-[1px] w-full bg-[#f0f0f0]"></div>

      <meta-acc-block class="mt-4 block">
        <ng-template #blockTitle>
          <div class="font-bold">SQL</div>
        </ng-template>

        <ng-template #content>
          <div class="mt-2 w-full">
            <textarea
              nz-input
              class="w-full"
              style="min-height: 120px; font-family: monospace;"
              [(ngModel)]="sql"
              [placeholder]="'sqlmodalcomponent_586' | i18nextEager"
              (ngModelChange)="changeUpdateTime()"
              (blur)="inputOnSave()"
            ></textarea>
          </div>
        </ng-template>
      </meta-acc-block>

      <div class="mt-[16px] h-[1px] w-full bg-[#f0f0f0]"></div>

      <meta-acc-block class="mt-4 block" [title]="'output_params' | i18nextEager">
        <ng-template #content>
          <div class="mt-2 flex items-center gap-2">
            <div class="text-label flex-1">{{ 'param_name' | i18nextEager }}</div>
            <div class="text-label w-[90px]">{{ 'type' | i18nextEager }}</div>
            <div class="w-[36px]"></div>
          </div>

          <form #outputForm="ngForm">
            <nz-tree id="node-param-tree" [nzData]="$any(outputParams)" nzBlockNode [nzTreeTemplate]="nzTreeTemplate">
              <ng-template #nzTreeTemplate let-node let-origin="origin">
                <div class="mt-[8px] flex w-full items-start gap-2">
                  <div style="flex: 1">
                    <input
                      style="width: 100%"
                      type="text"
                      [name]="'outputFormName' + node.key"
                      [maxlength]="paramNameMaxLen"
                      [disabled]="disableEdit(origin)"
                      nz-input
                      [(ngModel)]="origin.name"
                      [title]="origin.name"
                      [valueValidityValidator]="getOutputNames(origin)"
                      [placeholder]="'input_placeholder' | i18nextEager"
                      (ngModelChange)="changeUpdateTime()"
                      (blur)="inputOnSave()"
                    />
                  </div>

                  <div style="width: 90px">
                    <nz-select
                      *ngIf="origin.depth === 0; else otherTypes"
                      style="width: 100%"
                      [name]="'outputFormType' + node.key"
                      [(ngModel)]="origin.type"
                      [nzOptions]="$any(inputTypeOptions)"
                      nzLabelKey="value"
                      [disabled]="disableEdit(origin)"
                      [nzPlaceHolder]="'select_placeholder' | i18nextEager"
                      (ngModelChange)="onOutputParamTypeChange(origin); onSave()"
                    ></nz-select>

                    <ng-template #otherTypes>
                      <nz-select
                        *ngIf="origin.depth === 5; else subTypes"
                        style="width: 100%"
                        [name]="'outputFormType' + node.key"
                        [(ngModel)]="origin.type"
                        [nzOptions]="$any(noneObjDataTypes)"
                        nzLabelKey="value"
                        [disabled]="disableEdit(origin)"
                        [nzPlaceHolder]="'select_placeholder' | i18nextEager"
                        (ngModelChange)="onOutputParamTypeChange(origin); onSave()"
                      ></nz-select>

                      <ng-template #subTypes>
                        <nz-select
                          style="width: 100%"
                          [name]="'outputFormType' + node.key"
                          [(ngModel)]="origin.type"
                          [nzOptions]="$any(outputDataTypes)"
                          nzLabelKey="value"
                          [disabled]="disableEdit(origin)"
                          [nzPlaceHolder]="'select_placeholder' | i18nextEager"
                          (ngModelChange)="onOutputParamTypeChange(origin); onSave()"
                        ></nz-select>
                      </ng-template>
                    </ng-template>
                  </div>

                  <div class="flex items-center gap-1" style="width: 36px">
                    <meta-add-props-icon
                      *ngIf="isObjectLikeType(origin.type)"
                      (click)="addChild(origin); onSave()"
                    />
                    <span
                      *ngIf="showDelete(origin)"
                      (click)="deleteOutputParam(origin)"
                      style="font-size: 16px; color: #191919; cursor: pointer"
                      nz-icon
                      nzType="delete"
                      nzTheme="outline"
                    ></span>
                  </div>
                </div>
              </ng-template>
            </nz-tree>
          </form>
        </ng-template>
      </meta-acc-block>
    </div>
  </div>
</div>
