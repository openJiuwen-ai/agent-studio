<div class="flex h-full w-full flex-col" (keydown)="handleKeyDown($event)">
  <div class="mb-[16px] block">
    <div class="flex w-[calc(100%-38px)] items-center justify-between">
      <div class="flex items-center gap-[8px]">
        <img class="model-config-icon" [src]="icon" alt="message-node" />

        <edit-name
        [(name)]="nodeInfo.name"
        (onBlurConfirm)="updateName()"
      ></edit-name>
      </div>

      <div class="flex items-center gap-[16px]" *ngIf="!isFlowReadonly">
        <div class="cursor-pointer" nz-tooltip [nzTooltipTitle]="'icon-more'| i18nextEager">
          <div nz-dropdown [nzDropdownMenu]="actionsMenu" nzTrigger="click" class="pw-three-dots-more-modal">
            <span nz-icon nzType="more" nzTheme="outline"></span>
          </div>
          <nz-dropdown-menu #actionsMenu="nzDropdownMenu">
            <ul nz-menu>
              <li *ngFor="let action of actions" nz-menu-item (click)="onClickAction(action)">{{ action.label }}</li>
            </ul>
          </nz-dropdown-menu>
        </div>
        <div class="h-[16px] w-[1px] bg-[#dbdbdb]"></div>
      </div>
    </div>

    <node-description [nodeInfo]="nodeInfo" (descriptionChange)="updateView()"></node-description>

    <div class="mt-[16px] h-[1px] w-full bg-[#f0f0f0]"></div>
  </div>

  <div id="flow-llm-modal-body" class="relative h-full w-full overflow-auto flex-1 pr-[16px]">
    <meta-acc-block class="mt-2 block" [title]="'input_params' | i18nextEager">
      <ng-template #content>
        <div class="mt-2 flex items-center gap-2">
          <div class="w-1/3 text-label">{{ 'variable_name' | i18nextEager }}
            <span nz-tooltip [nzTooltipTitle]="(workflowType==='chat'?'set_var_tip_chat':'set_var_tip_task') | i18nextEager" nz-icon nzType="question-circle" nzTheme="outline" class="cursor-pointer ml-1"></span>
          </div>
          <div class="flex w-2/3 items-center gap-2 text-label">
            <div class="flex h-fit w-[calc(100%-16px)] items-center">
              <div class="w-[35%]">{{ 'type' | i18nextEager }}</div>
              <div class="w-[65%]">{{ 'value' | i18nextEager }}</div>
            </div>
            <div class="h-full w-[16px]"></div>
          </div>
        </div>

        <form #paramForm="ngForm">
          <div
            *ngFor="let param of params; index as i"
            class="mt-2 flex items-start gap-2"
          >
            <div class="w-1/3">
              <input-tree-select
                [radiusLeft]="true"
                style="width: 100%"
                [(ngModel)]="param.left.value.content"
                [options]="param.left.refs"
                [name]="'leftParamFormValue' + i"
                refSelectedRequire
                [placeholder]="'select_placeholder' | i18nextEager"
                (ngModelChange)="onLeftSelect($event, param)"
                (select)="treeSelect()"
              ></input-tree-select>
              <div
              *ngIf="
                paramForm?.controls['leftParamFormValue' + i]?.invalid &&
                (paramForm?.controls['leftParamFormValue' + i]?.dirty || paramForm?.controls['leftParamFormValue' + i]?.touched)
              "
              class="error-tip"
            >
              {{ paramForm?.controls['leftParamFormValue' + i]?.errors?.serviceName?.tiErrorMessage }}
            </div>
            </div>

            <div class="flex items-start w-2/3 gap-[8px]">
              <div class="flex h-fit w-[calc(100%-16px)] items-start gap-2">
                <div class="flex w-full">
                  <div class="w-[35%]">
                    <nz-select
                      class="combo-select-left"
                      style="width: 100%"
                      [nzOptions]="$any(param.typeOpts)"
                      [name]="'rightParamComFormType' + i"
                      [nzPlaceHolder]="'select_placeholder' | i18nextEager"
                      [(ngModel)]="param.right.value.type"
                      (ngModelChange)="onIntegerTypeChange(param, $event)"
                      nzLabelKey="label"
                    ></nz-select>
                  </div>

                  <div class="w-[65%]">
                    <ng-container *ngIf="param.right.value.type === 'literal'">
                      <input
                        class="combo-select-right"
                        *ngIf="param.right.type === 'string'"
                        style="width: 100%"
                        type="text"
                        [name]="'rightParamFormValue' + i"
                        nonEmptyValidator
                        [placeholder]="'input_placeholder' | i18nextEager"
                        [(ngModel)]="param.right.value.content"
                        [disabled]="isRightDisabled(param)"
                        [title]="param.right.value.content"
                        (ngModelChange)="changeUpdateTime()"
                        (blur)="inputOnSave()"
                        nz-input
                        [class.input-error]="
                        paramForm?.controls['rightParamFormValue' + i]?.invalid &&
                        (paramForm?.controls['rightParamFormValue' + i]?.dirty || paramForm?.controls['rightParamFormValue' + i]?.touched)
                      "
                      />

                      <nz-select
                        *ngIf="param.right.type === 'boolean'"
                        class="combo-select-right"
                        style="width: 100%"
                        [name]="'rightParamFormValue' + i"
                        [nzOptions]="$any(booleanOps)"
                        [(ngModel)]="param.right.value.content"
                        [disabled]="isRightDisabled(param)"
                        [nzPlaceHolder]="'select_placeholder' | i18nextEager"
                        nzLabelKey="label"
                        (ngModelChange)="onSave()"
                        [class.input-error]="
                        paramForm?.controls['rightParamFormValue' + i]?.invalid &&
                        (paramForm?.controls['rightParamFormValue' + i]?.dirty || paramForm?.controls['rightParamFormValue' + i]?.touched)
                      "
                      ></nz-select>

                      <input
                        *ngIf="param.right.type === 'number'"
                        class="combo-select-right"
                        [name]="'rightParamFormValue' + i"
                        style="width: 100%"
                        [placeholder]="'input_placeholder' | i18nextEager"
                        type="text"
                        [(ngModel)]="param.right.value.content"
                        [title]="param.right.value.content"
                        [disabled]="isRightDisabled(param)"
                        numberStr
                        nonEmptyValidator
                        (ngModelChange)="changeUpdateTime()"
                        (blur)="inputOnSave()"
                        nz-input
                        [class.input-error]="
                        paramForm?.controls['rightParamFormValue' + i]?.invalid &&
                        (paramForm?.controls['rightParamFormValue' + i]?.dirty || paramForm?.controls['rightParamFormValue' + i]?.touched)
                      "
                      />

                      <input
                        *ngIf="param.right.type === 'integer'"
                        class="combo-select-right"
                        [name]="'rightParamFormValue' + i"
                        style="width: 100%"
                        [placeholder]="'input_placeholder' | i18nextEager"
                        type="text"
                        [(ngModel)]="param.right.value.content"
                        [title]="param.right.value.content"
                        [disabled]="isRightDisabled(param)"
                        nonEmptyValidator
                        integerStr
                        (ngModelChange)="changeUpdateTime()"
                        (blur)="inputOnSave()"
                        nz-input
                        [class.input-error]="
                        paramForm?.controls['rightParamFormValue' + i]?.invalid &&
                        (paramForm?.controls['rightParamFormValue' + i]?.dirty || paramForm?.controls['rightParamFormValue' + i]?.touched)
                      "
                      />
                    </ng-container>

                    <input-tree-select
                      *ngIf="param.right.value.type === 'ref'"
                      style="width: 100%"
                      [(ngModel)]="param.right.value.content"
                      [options]="param.right.refs"
                      [name]="'rightParamFormValue' + i"
                      refSelectedRequire
                      (select)="treeSelect()"
                      [placeholder]="'select_placeholder' | i18nextEager"
                    ></input-tree-select>

                    <nz-select
                      *ngIf="param.right.value.type === 'operator'"
                      class="combo-select-right"
                      style="width: 100%"
                      [nzOptions]="$any(param.operatorOpts)"
                      [name]="'rightParamFormType' + i"
                      [(ngModel)]="param.right.value.operator"
                      nzLabelKey="label"
                      (ngModelChange)="onSave()"
                      [class.input-error]="
                      paramForm?.controls['rightParamFormValue' + i]?.invalid &&
                      (paramForm?.controls['rightParamFormValue' + i]?.dirty || paramForm?.controls['rightParamFormValue' + i]?.touched)
                    "
                    ></nz-select>

                    <div
                    *ngIf="
                      paramForm?.controls['rightParamFormValue' + i]?.invalid &&
                      (paramForm?.controls['rightParamFormValue' + i]?.dirty || paramForm?.controls['rightParamFormValue' + i]?.touched)
                    "
                    class="error-tip"
                  >
                    {{ paramForm?.controls['rightParamFormValue' + i]?.errors?.serviceName?.tiErrorMessage }}
                  </div>
                  </div>
                </div>
              </div>
              <span
                *ngIf="params.length > 1"
                (click)="deleteParam(i)"
                style="
                  font-size: 16px;
                  color: #191919;
                  cursor: pointer;
                  padding-top: 6px;
                "
                nz-icon
                nzType="delete"
                nzTheme="outline"
              ></span>
            </div>
          </div>
        </form>
      </ng-template>

      <ng-template #right>
        <div class="flex items-center justify-center">
          <button
            (click)="addParam()"
            class="w-fit"
            nz-button
            nzType="text"
            nz-tooltip [nzTooltipTitle]="'add_params' | i18nextEager"
            [disabled]="isReachedParamLimit(inputParams)"
          >
            <span nz-icon nzType="plus" nzTheme="outline"></span>
          </button>
        </div>
      </ng-template>
    </meta-acc-block>
  </div>
</div>
