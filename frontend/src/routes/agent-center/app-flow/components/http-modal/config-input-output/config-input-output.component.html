<meta-acc-block class="block" [title]="'input_params' | i18nextEager">
  <ng-template #content>
    <div class="mt-2 flex items-center gap-2">
      <div class="w-1/3 text-label">{{ 'param_name' | i18nextEager }}</div>
      <div class="flex w-2/3 items-center gap-2 text-label">
        <div class="flex h-fit w-[calc(100%-16px)] items-center">
          <div class="w-[35%]">{{ 'type' | i18nextEager }}</div>
          <div class="w-[65%]">{{ 'value' | i18nextEager }}</div>
        </div>
        <div class="h-full w-[16px]"></div>
      </div>
    </div>

    <form #inputForm="ngForm">
      <div *ngFor="let param of inputParams; index as i" class="mt-2 flex gap-2">
        <div class="w-1/3">
          <input nz-input
            [name]="'inputFormName' + i"
            [maxlength]="paramNameMaxLen"
            [(ngModel)]="param.name"
            (ngModelChange)="onParamChange()"
            [title]="param.name"
            [placeholder]="'input_placeholder' | i18nextEager"
            [valueValidityValidator]="getInputNames(i)"
            [class.input-error]="inputForm?.controls['inputFormName' + i]?.invalid && (inputForm?.controls['inputFormName' + i]?.dirty || inputForm?.controls['inputFormName' + i]?.touched)"
          />
          <div *ngIf="inputForm?.controls['inputFormName' + i]?.invalid && (inputForm?.controls['inputFormName' + i]?.dirty || inputForm?.controls['inputFormName' + i]?.touched)" class="error-tip">
            {{inputForm?.controls['inputFormName' + i]?.errors?.serviceName?.tiErrorMessage}}
          </div>
        </div>
        <div class="flex w-2/3 gap-[8px]">
          <div class="flex h-fit w-[calc(100%-16px)] items-center gap-2">
            <div class="flex w-full">
              <div class="w-[35%]">
                <nz-select
                  class="combo-select-left"
                  style="width: 100%"
                  [name]="'inputFormType' + i"
                  [(ngModel)]="param.value.type"
                  (ngModelChange)="onTypeChange(param)"
                >
                  <nz-option *ngFor="let opt of sourceOptions" [nzLabel]="opt.label" [nzValue]="opt.value"></nz-option>
                </nz-select>
              </div>
              <div class="w-[65%]">
                <input nz-input
                  class="combo-select-right"
                  *ngIf="param.value.type === 'literal'"
                  [name]="'inputFormValue' + i"
                  nonEmptyValidator
                  [(ngModel)]="param.value.content"
                  (ngModelChange)="onParamChange()"
                  [title]="param.value.content"
                  [placeholder]="'input_placeholder' | i18nextEager"
                  [class.input-error]="inputForm?.controls['inputFormValue' + i]?.invalid && (inputForm?.controls['inputFormValue' + i]?.dirty || inputForm?.controls['inputFormValue' + i]?.touched)"
                />
                <div *ngIf="inputForm?.controls['inputFormValue' + i]?.invalid && (inputForm?.controls['inputFormValue' + i]?.dirty || inputForm?.controls['inputFormValue' + i]?.touched)" class="error-tip">
                  {{inputForm?.controls['inputFormValue' + i]?.errors?.serviceName?.tiErrorMessage}}
                </div>
                <input-tree-select
                  class="combo-select-right"
                  style="width: 100%"
                  *ngIf="param.value.type === 'ref'"
                  [options]="param.refs"
                  [(ngModel)]="param.value.content"
                  (ngModelChange)="onParamChange()"
                  [placeholder]="'select_placeholder' | i18nextEager"
                  refSelectedRequire
                  [name]="'inputFormValue' + i"
                ></input-tree-select>
              </div>
            </div>
          </div>
          <span nz-icon nzType="delete" nzTheme="outline"
            style="font-size: 16px; cursor: pointer; padding-top: 8px;"
            (click)="deleteInputParam(i)"></span>
        </div>
      </div>
    </form>
  </ng-template>

  <ng-template #right>
    <div class="flex items-center justify-center">
      <button nz-btn nzType="text" (click)="addInputParam()"
        nz-tooltip [nzTooltipTitle]="'add_params' | i18nextEager"
        [disabled]="isReachedParamLimit(inputParams)">
        <span nz-icon nzType="plus" nzTheme="outline"></span>
      </button>
    </div>
  </ng-template>
</meta-acc-block>
