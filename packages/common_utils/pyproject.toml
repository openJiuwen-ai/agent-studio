[project]
name = "common-utils"
version = "0.1.0"
description = "agent-studio 公共工具层（agent-runtime / agent-builder 共享）"
requires-python = ">=3.11"
dependencies = [
    "openjiuwen",
    "redis>=5.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common_utils*"]
